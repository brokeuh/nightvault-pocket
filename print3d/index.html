<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Nightvault 3D Print</title>
<link rel="icon" href="../favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../hub/nvtheme.js"></script>
<script>NVTHEME.apply('print3d')</script>
<script src="../hub/nvlog.js"></script>
<script src="../hub/nvgroups.js"></script>
<script src="../hub/nvpc.js"></script>
<script src="../hub/nvbackup.js"></script>
<script src="../hub/nvsetup.js"></script>
<script src="../hub/nvmenu.js"></script>
<!-- Nightvault 3D Print (test): your 3D models (STL, OBJ, 3MF) from a phone folder, copied into the app or from the PC (Take with me),
     a 3D viewer (viewer.js), projects (one folder = one tile, shared groups ../hub/nvgroups.js) and a print log. Plan: plans/print3d.md (nightvault-src). -->
<style>
:root{--bg:#0b0e13;--pan:#151a22;--pan2:#10141b;--line:#232b36;--text:#e9edf2;--dim:#9aa7b5;--dim2:#8fa0b2;--accent:#7fd8e8;--accentd:#1f6b7a;--accentbg:#12303a;--blue:#7fb2ff;--amber:#f1dc6b;--red:#ef8a8f;--cover-ratio:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.muted{color:var(--dim)}.small{font-size:12.5px}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.top h1{font-size:21px;margin:0;flex:1;min-width:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--pan);display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text);cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.hubback{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;margin:0 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--pan);color:var(--text);text-decoration:none;font-size:13.5px}
.btn{height:44px;border-radius:13px;border:1px solid var(--line);background:var(--pan);color:var(--text);font-size:14.5px;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accentd);border-color:#3f9fb0;color:#fff;font-weight:700}
.btn.sm{height:34px;font-size:13px;padding:0 12px;border-radius:11px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{height:32px;border-radius:99px;border:1px solid var(--line);background:var(--pan2);color:var(--dim);padding:0 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accentbg);border-color:#2f7a8a;color:var(--accent)}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=password],textarea{width:100%;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--pan2);color:var(--text);padding:0 12px;font:inherit;font-size:14.5px;color-scheme:dark}
textarea{padding:10px 12px;min-height:80px;resize:vertical}
select{height:34px;border-radius:11px;border:1px solid var(--line);background:var(--pan2);color:var(--text);padding:0 8px;font:inherit;font-size:13px}
.sec{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--dim2);margin:18px 0 6px;text-transform:uppercase}
.mbar{display:flex;gap:8px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
.mtot{font-size:13px;color:var(--dim2);margin:0 2px 6px}
.mlist{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:36px 16px;border:1px dashed var(--line2);border-radius:20px;margin-top:14px}
.empty svg{width:48px;height:48px;color:var(--accent)}
.store{font-size:12px;color:var(--dim2);text-align:center;margin-top:22px}
.note{padding:12px 14px;border-radius:16px;background:var(--pan2);border:1px solid var(--line);font-size:13.5px;margin:8px 0}
.note b{color:var(--accent)}
/* shelf tiles (start screen) */
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px}
.shelf{position:relative;min-height:150px;border-radius:22px;padding:14px;border:1px solid #ffffff14;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;-webkit-touch-callout:none;user-select:none}
.shelf:active{transform:scale(.985)}
.shelf:not(.add){color:#e9edf2}
.shelf .ic{position:absolute;left:14px;top:14px;width:44px;height:44px;border-radius:13px;background:#0b0e1366;display:flex;align-items:center;justify-content:center}
.shelf .ic svg{width:26px;height:26px}
.shelf b{font-size:17px;position:relative}
.shelf .s{font-size:12.5px;color:#e9edf2b0;position:relative}
.shelf .fan{position:absolute;right:10px;top:12px;width:84px;height:84px}
.shelf .fan img{position:absolute;width:54px;height:54px;object-fit:cover;border-radius:8px;box-shadow:0 4px 14px #0009;border:1px solid #ffffff22;background:color-mix(in srgb,var(--pan),var(--text) 7%)}
.shelf .fan img:nth-child(1){right:0;top:0;transform:rotate(8deg)}.shelf .fan img:nth-child(2){right:12px;top:6px;transform:rotate(0)}.shelf .fan img:nth-child(3){right:24px;top:12px;transform:rotate(-8deg)}
/* recently played row */
.recent{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent .bk{width:92px;flex:none}
/* cover grid: square tiles for game boxes (--cover-ratio). A cover that doesn't fit is shown whole, a blurred copy fills the edges. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 12px;margin-top:6px}
.bk{cursor:pointer;min-width:0;position:relative;-webkit-touch-callout:none;user-select:none}
.cv{position:relative;aspect-ratio:var(--cover-ratio);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--pan),var(--text) 7%);flex:none}
.cv img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv img.b{object-fit:cover;filter:blur(12px) brightness(.55);transform:scale(1.2)}
.cv img.f{object-fit:contain}
.cv .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-weight:700;font-size:13.5px;line-height:1.2;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));overflow:hidden}
.cv .ph span{font-size:11px;font-weight:500;opacity:.8;margin-top:3px}
.cv .ph svg{position:absolute;top:10px;left:10px;width:22px;height:22px;opacity:.55}
.bk .t{font-size:13px;font-weight:600;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .a{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .np{position:absolute;left:6px;bottom:6px;z-index:1;background:#0b0e13d9;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;pointer-events:none}
.cv .tag{position:absolute;top:6px;right:6px;z-index:1;background:#0b0e13d9;color:var(--amber);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;border:1px solid #f1dc6b55;pointer-events:none;max-width:calc(100% - 40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .tag.x{color:#7fe3ff;border-color:#7fe3ff55}
.bk.stack .cv,.stack .gcv{box-shadow:5px -5px 0 -1px #2a3442,10px -10px 0 -2px #1c2430}
.bk.stack{padding-top:10px;padding-right:10px}
.bk .cdl{position:absolute;top:7px;right:7px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;font-size:10.5px;background:#0b0e13d9;color:#7fe3ff;font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:99px;border:1px solid #7fe3ff55;pointer-events:none}
.bk.stack .cdl{top:17px;right:17px}
.pinb{position:absolute;left:7px;top:7px;width:24px;height:24px;border-radius:50%;background:#0b0e13d9;border:1px solid #f1dc6b88;color:var(--amber);font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
.bk.stack>.pinb{top:17px}
.bk.sel .cv{outline:3px solid var(--accent);outline-offset:-3px;transform:scale(.94)}
.bk.sel::after{content:'✓';position:absolute;right:8px;bottom:44px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#062027;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
#msel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 20px));display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:#0f2228f5;border:1px solid #2f7a8a;box-shadow:0 8px 30px #0009;z-index:7;font-size:14px}
/* group / game header */
.alhead{display:flex;gap:16px;align-items:flex-end;margin:6px 0 12px}
.alhead .cv,.alhead .gcv{width:min(36vw,160px);border-radius:14px;box-shadow:0 10px 30px #0008}
.alhead b{display:block;font-size:19px;line-height:1.25}
.lnk{color:var(--blue);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:12px 0}
.stat{padding:9px 10px;border-radius:14px;background:var(--pan2);border:1px solid var(--line)}
.stat small{display:block;font-size:11px;color:var(--dim);letter-spacing:.3px}
.stat b{font-size:15.5px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:12px 0}
.facts span:nth-child(odd){color:var(--dim)}
.desc{font-size:14px;line-height:1.55;color:var(--text);white-space:pre-line}
.desc.clip{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .n{flex:1;min-width:0}.li .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .n .s{font-size:12.5px;color:var(--dim)}
.li .r{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none;text-align:right}
.li .th{width:40px;flex:none}.li .th .cv{border-radius:7px}.li .th .ph{font-size:7px;padding:3px}.li .th .ph span,.li .th .ph svg{display:none}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.badge.ok{color:var(--accent);border-color:#2f7a8a88}.badge.wait{color:var(--amber);border-color:#f1dc6b66}.badge.bad{color:var(--red);border-color:#ef8a8f66}
.win{color:var(--amber)}
/* sheets */
.scrim{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--pan);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));color:var(--text)}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:#3a4553;margin:-6px auto 12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt label{flex:1}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--accentd)}
.field{margin-bottom:10px}.field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
/* the play form */
.prow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.prow input[type=text]{flex:1;min-width:0}
.prow input.sc{width:74px;flex:none;text-align:center;padding:0 6px}
.prow .wb{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--pan2);color:#55606d;font-size:19px;cursor:pointer;padding:0}
.prow .wb.on{color:var(--amber);border-color:#f1dc6b88;background:#2a2610}
.prow .xb{width:34px;height:42px;flex:none;border:0;background:none;color:var(--dim);font-size:18px;cursor:pointer;padding:0}
.gpick{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--pan2);margin-bottom:10px}
.gpick .cv{width:52px;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222a33;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center;color:var(--text)}
#toast.on{opacity:1}
/* the 3D viewer */
.v3{position:relative;width:100%;aspect-ratio:1/0.82;max-height:62vh;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1b2a36,#0d1218 75%);border:1px solid var(--line);margin:4px 0 10px}
.v3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.v3 .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);font-size:13.5px;text-align:center;padding:20px}
.v3 .vt{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;align-items:center;z-index:2;pointer-events:none}
.v3 .vt>*{pointer-events:auto}
.v3 .vb{width:38px;height:38px;border-radius:12px;border:1px solid #ffffff1f;background:#0b0e13cc;color:#d4dde6;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.v3 .vb.on{color:var(--accent);border-color:#7fd8e888}
.v3 .vb svg{width:19px;height:19px}
.v3 .dim{position:absolute;left:10px;top:9px;font-size:12px;color:#c7d3de;background:#0b0e13b3;padding:3px 9px;border-radius:99px;z-index:2;pointer-events:none;font-variant-numeric:tabular-nums}
.v3 .sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px #ffffff44;cursor:pointer;padding:0}
.v3.full{position:fixed;inset:0;max-height:none;aspect-ratio:auto;border-radius:0;margin:0;z-index:40;border:0}
.v3 .spin{width:34px;height:34px;border-radius:50%;border:3px solid #2a3a48;border-top-color:var(--accent);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tg{height:28px;border-radius:99px;border:1px solid var(--line);background:var(--pan2);color:#c4d3df;padding:0 11px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center}
.tg.own{border-color:#2f7a8a;color:var(--accent)}
.tg.add{color:var(--dim);border-style:dashed}
.prog{height:6px;border-radius:9px;background:#1f2833;overflow:hidden;margin:10px 0 6px}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.prog.busy i{width:35%;animation:pg 1.1s ease-in-out infinite}@keyframes pg{0%{margin-left:-35%}100%{margin-left:100%}}
.pcline{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--pan2);border:1px solid var(--line);font-size:12.5px;color:var(--dim);margin:6px 0}
.pcline i{width:9px;height:9px;border-radius:50%;background:#55606d;flex:none}.pcline.ok i{background:#7fe07a}.pcline.no i{background:var(--red)}
.pcline span{flex:1;min-width:0}
.res{display:flex;gap:8px}.res button{flex:1;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--pan2);color:var(--dim);font-size:14.5px;cursor:pointer}
.res button.on.ok{background:#16301c;border-color:#4f9a5a;color:#9be07a}.res button.on.bad{background:#341a1c;border-color:#a0545a;color:var(--red)}
.sliced{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--pan2);margin-bottom:8px;cursor:pointer}
.sliced .cv{width:64px;border-radius:9px}
.cv .ok{position:absolute;right:6px;bottom:6px;z-index:1;background:#0b0e13d9;color:#9be07a;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;pointer-events:none}
.cv .ok.bad{color:var(--red)}
.cv .src{position:absolute;left:6px;bottom:6px;z-index:1;background:#0b0e13d9;color:var(--text);font-size:10px;font-weight:800;padding:2px 6px;border-radius:7px;pointer-events:none;letter-spacing:.3px}
.cv .src.off{color:var(--dim2)}
.cv .np~.src{display:none}
.bk.away .cv img{filter:grayscale(.7) brightness(.6)}
</style>
</head>
<body>
<script src="../hub/nvsplash.js" data-app="print3d"></script>
<a id="hubback" class="hubback" hidden href="../hub/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7fd8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg>The Nightvault</a>

<div id="app">
  <div class="top"><button class="ib" id="vback" hidden aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><h1 id="vtitle">3D Print</h1>
    <button class="ib" id="prbtn" aria-label="Prints"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V9h12v11M9 9V4h6v5M10 13h4"/></svg></button>
    <button class="ib" id="setbtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    <button class="btn primary sm" id="addbtn" style="height:42px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="addlbl">Add</span></button></div>
  <div id="body"></div>
</div>

<div id="sheets"></div>
<input type="file" id="pickpic" accept="image/*" hidden>
<input type="file" id="pickmod" multiple hidden>
<datalist id="mats"></datalist>
<div id="toast"></div>

<script src="viewer.js"></script>
<script src="app.js"></script>
<script>try{NVMENU.make({app:'print3d', btn:'#setbtn', hub:'../hub/index.html', backup:'print3d', hide:['#prbtn'], items:() => [{label:'Prints', click:'#prbtn'}]})}catch(e){console.error(e)}</script>
</body>
</html>
