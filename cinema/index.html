<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Nightvault Cinema</title>
<link rel="icon" href="../favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../hub/nvtheme.js"></script>
<script>NVTHEME.apply('cinema')</script>
<script src="../hub/nvlog.js"></script>
<script src="../hub/nvgroups.js"></script>
<script src="../hub/nvpc.js"></script>
<script src="../hub/nvbackup.js"></script>
<script src="../hub/nvsetup.js"></script>
<script src="../hub/nvmenu.js"></script>
<!-- Nightvault Cinema (test): movies, TV shows, cartoons and anime, each on its own shelf, with one video player.
     Videos from a folder on the phone (NvFiles, nothing copied), copied into the app, or streamed from the PC over the home network
     (Take with me: ../hub/nvpc.js + the PC app's Phone access). Every shelf organised like Music (shared groups: ../hub/nvgroups.js).
     Movie and show info + posters: TMDB with the owner's own key (kept on this device only). Plan: plans/cinema.md (nightvault-src). -->
<style>
:root{--bg:#0b0e13;--pan:#151a22;--pan2:#10141b;--line:#232b36;--text:#e9edf2;--dim:#9aa7b5;--dim2:#8fa0b2;--accent:#ffb0a8;--accentd:#a3333f;--accentb:#d2505c;--accentbg:#3a1620;--blue:#7fb2ff;--amber:#f1dc6b;--red:#ef8a8f;--green:#8fe0a0;--cover-ratio:2/3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
body.playing{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:var(--blue)}
.muted{color:var(--dim)}.small{font-size:12.5px}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.top h1{font-size:21px;margin:0;flex:1;min-width:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--pan);display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text);cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.hubback{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;margin:0 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--pan);color:var(--text);text-decoration:none;font-size:13.5px}
.btn{height:44px;border-radius:13px;border:1px solid var(--line);background:var(--pan);color:var(--text);font-size:14.5px;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accentd);border-color:var(--accentb);color:#fff;font-weight:700}
.btn.sm{height:34px;font-size:13px;padding:0 12px;border-radius:11px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{height:32px;border-radius:99px;border:1px solid var(--line);background:var(--pan2);color:var(--dim);padding:0 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accentbg);border-color:var(--accentb);color:var(--accent)}
input[type=search],input[type=text],input[type=number],input[type=password],textarea{width:100%;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--pan2);color:var(--text);padding:0 12px;font:inherit;font-size:14.5px}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
select{height:34px;border-radius:11px;border:1px solid var(--line);background:var(--pan2);color:var(--text);padding:0 8px;font:inherit;font-size:13px}
.sec{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--dim2);margin:18px 0 6px;text-transform:uppercase}
.mbar{display:flex;gap:8px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
.mtot{font-size:13px;color:var(--dim2);margin:0 2px 6px}
.mlist{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:36px 16px;border:1px dashed var(--line2);border-radius:20px;margin-top:14px}
.empty svg{width:48px;height:48px;color:var(--accent)}
.store{font-size:12px;color:var(--dim2);text-align:center;margin-top:22px}
.pcline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
.pcline i{width:8px;height:8px;border-radius:50%;background:#56606d;flex:none}.pcline.ok i{background:var(--green)}.pcline.no i{background:var(--red)}
.pcline span{flex:1;min-width:0}
/* shelf tiles (start screen) */
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px}
.shelf{position:relative;min-height:150px;border-radius:22px;padding:14px;border:1px solid #ffffff14;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;-webkit-touch-callout:none;user-select:none}
.shelf:active{transform:scale(.985)}
.shelf:not(.add){color:#e9edf2}
.shelf .ic{position:absolute;left:14px;top:14px;width:44px;height:44px;border-radius:13px;background:#0b0e1366;display:flex;align-items:center;justify-content:center}
.shelf .ic svg{width:26px;height:26px}
.shelf b{font-size:17px;position:relative}
.shelf .s{font-size:12.5px;color:#e9edf2b0;position:relative}
.shelf .fan{position:absolute;right:10px;top:12px;width:78px;height:96px}
.shelf .fan img{position:absolute;width:50px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 4px 14px #0009;border:1px solid #ffffff22;background:color-mix(in srgb,var(--pan),var(--text) 7%)}
.shelf .fan img:nth-child(1){right:0;top:0;transform:rotate(8deg)}.shelf .fan img:nth-child(2){right:12px;top:4px;transform:rotate(0)}.shelf .fan img:nth-child(3){right:24px;top:8px;transform:rotate(-8deg)}
/* continue watching: a row of wide cards */
.cont{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scroll-snap-type:x mandatory}
.cont::-webkit-scrollbar{display:none}
.cw{flex:none;width:min(62vw,250px);scroll-snap-align:start;cursor:pointer}
.cw .pic{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--pan),var(--text) 7%)}
.cw .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cw .pic .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#0b0e13b0;border:1px solid #ffffff33;display:flex;align-items:center;justify-content:center}
.cw .pic .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff26}.cw .pic .bar i{display:block;height:100%;background:var(--accentb)}
.cw .t{font-size:13px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw .a{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* poster grid: tall tiles (--cover-ratio 2/3). A picture that doesn't fit is shown whole, a blurred copy fills the edges. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px 12px;margin-top:6px}
.bk{cursor:pointer;min-width:0;position:relative;-webkit-touch-callout:none;user-select:none}
.cv{position:relative;aspect-ratio:var(--cover-ratio);border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--pan),var(--text) 7%);flex:none}
.cv img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv img.b{object-fit:cover;filter:blur(12px) brightness(.55);transform:scale(1.2)}
.cv img.f{object-fit:contain}
.cv .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-weight:700;font-size:13.5px;line-height:1.2;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));overflow:hidden}
.cv .ph span{font-size:11px;font-weight:500;opacity:.8;margin-top:3px}
.cv .ph i{font-style:normal;position:absolute;top:8px;left:10px;font-size:10px;font-weight:800;letter-spacing:.6px;opacity:.7}
.bk .t{font-size:13px;font-weight:600;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .a{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .vol{position:absolute;left:6px;bottom:8px;right:6px;z-index:1;display:flex;flex-wrap:wrap;gap:3px;pointer-events:none}
.cv .vol span{background:#0b0e13d9;color:#fff;font-size:10px;font-weight:800;letter-spacing:.2px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.cv .vol span.pc{color:#7fe3ff}.cv .vol span.ok{color:var(--green)}
.cv .pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff26;z-index:1}.cv .pbar i{display:block;height:100%;background:var(--accentb)}
.cv .seen{position:absolute;top:6px;right:6px;z-index:1;width:22px;height:22px;border-radius:50%;background:#0b0e13d9;border:1px solid #8fe0a088;color:var(--green);font-size:12px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.bk.off .cv{opacity:.45}
.bk.stack .cv,.stack .gcv{box-shadow:5px -5px 0 -1px #2a3442,10px -10px 0 -2px #1c2430}
.bk.stack{padding-top:10px;padding-right:10px}
.bk .cdl{position:absolute;top:7px;right:7px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;font-size:10.5px;background:#0b0e13d9;color:var(--accent);font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:99px;border:1px solid #ffb0a855;pointer-events:none;z-index:1}
.bk.stack .cdl{top:17px;right:17px}
.pinb{position:absolute;left:7px;top:7px;width:24px;height:24px;border-radius:50%;background:#0b0e13d9;border:1px solid #f1dc6b88;color:var(--amber);font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.bk.stack>.pinb{top:17px}
.bk.sel .cv{outline:3px solid var(--accent);outline-offset:-3px;transform:scale(.94)}
.bk.sel::after{content:'✓';position:absolute;right:8px;bottom:44px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accentbg);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:3}
#msel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 20px));display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:#3a1620f5;border:1px solid var(--accentb);box-shadow:0 8px 30px #0009;z-index:7;font-size:14px}
/* title page */
.hero{position:relative;margin:0 -16px 8px;padding:10px 16px 0;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:.28;filter:blur(2px);mask-image:linear-gradient(#000 40%,transparent)}
.alhead{position:relative;display:flex;gap:16px;align-items:flex-end;margin:6px 0 12px}
.alhead .cv,.alhead .gcv{width:min(34vw,150px);border-radius:12px;box-shadow:0 10px 30px #0008}
.alhead b{display:block;font-size:20px;line-height:1.25}
.lnk{color:var(--blue);cursor:pointer}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:12px 0}
.facts span:nth-child(odd){color:var(--dim)}
.desc{font-size:14px;line-height:1.55;color:var(--text);white-space:pre-line}
.desc.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--text);margin:2px 4px 0 0}
.tag.pc{color:#7fe3ff}.tag.ok{color:var(--green)}
.playbig{flex:1;height:50px;font-size:16px}
.prog2{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 0}.prog2 i{display:block;height:100%;background:var(--accentb)}
/* episodes */
.ep{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.ep:last-child{border-bottom:0}
.ep .no{position:relative;width:92px;aspect-ratio:16/9;border-radius:9px;background:color-mix(in srgb,var(--pan),var(--text) 7%);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--text)}
.ep .no img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ep .no .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff26}.ep .no .bar i{display:block;height:100%;background:var(--accentb)}
.ep .n{flex:1;min-width:0}.ep .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ep .n .s{font-size:12.5px;color:var(--dim)}
.ep.seen .n>div:first-child{color:var(--dim)}
.ep.off{opacity:.5}
.ep .mk{flex:none;font-size:12px;color:var(--green)}
/* lists in sheets */
.li{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .n{flex:1;min-width:0}.li .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .n .s{font-size:12.5px;color:var(--dim)}
.li .r{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.li .th{width:36px;flex:none}.li .th .cv{border-radius:5px}.li .th .ph{font-size:7px;padding:3px}.li .th .ph span,.li .th .ph i{display:none}
.li .th .vol,.li .th .seen,.li .th .pinb,.li .th .pbar{display:none}
/* sheets */
.scrim{position:fixed;inset:0;background:#000a;z-index:130;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--pan);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));color:var(--text)}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:#3a4553;margin:-6px auto 12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt label{flex:1}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--accentd)}
.field{margin-bottom:10px}.field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.prog.busy i{width:30%;transition:none;animation:nvbusy 1.3s ease-in-out infinite}@keyframes nvbusy{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.note{font-size:12.5px;color:var(--dim);background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.ok{color:var(--green)}.bad{color:var(--red)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222a33;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:160;max-width:90vw;text-align:center;color:var(--text)}
#toast.on{opacity:1}
/* the player */
#player{position:fixed;inset:0;z-index:100;background:#000;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#player.fill video{object-fit:cover}
#player video::cue{background:#000a;color:#fff;font-size:clamp(16px,3.6vmin,30px);font-family:'DM Sans',system-ui,sans-serif;line-height:1.3}
#player .ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(#000b,transparent 22%,transparent 70%,#000c);transition:opacity .25s}
#player.hideui .ui{opacity:0;pointer-events:none}
#player.hideui{cursor:none}
#player .pt{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 10px calc(12px + env(safe-area-inset-left,0px))}
#player .pt .n{flex:1;min-width:0}#player .pt .n b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#player .pt .n span{font-size:12.5px;opacity:.75}
#player .pb{padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
#player .pi{width:44px;height:44px;border-radius:50%;border:0;background:#ffffff1a;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
#player .pi svg{width:22px;height:22px}
#player .pi.txt{width:auto;border-radius:22px;padding:0 12px;font-size:13px;font-weight:700}
#player .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:28px;align-items:center}
#player .mid .pi{width:56px;height:56px;background:#0008}
#player .mid .big{width:76px;height:76px}#player .mid .big svg{width:34px;height:34px}
#player .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#player .time{font-size:13px;font-variant-numeric:tabular-nums;opacity:.9;min-width:44px}
#player input[type=range]{flex:1;min-width:120px;accent-color:var(--accentb);height:28px}
#player .wait{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:4px solid #ffffff33;border-top-color:#fff;animation:spin 1s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#player .msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 40px));background:#151a22f2;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;font-size:14px}
#player .seekfx{position:absolute;top:50%;transform:translateY(-50%);font-size:15px;font-weight:800;background:#0009;border-radius:99px;padding:10px 16px;pointer-events:none;opacity:0;transition:opacity .3s}
#player .seekfx.on{opacity:1}
#player .nextup{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));background:#151a22f2;border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13.5px}
#player .menu{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100% - 24px));max-height:60vh;overflow:auto;background:#151a22f5;border:1px solid var(--line);border-radius:14px;padding:6px}
#player .menu button{display:block;width:100%;text-align:left;border:0;background:none;color:#fff;padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer}
#player .menu button.on{background:var(--accentbg);color:var(--accent)}
#player #pcue{position:absolute;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;padding:0 8%;font-size:clamp(16px,3.6vmin,30px);line-height:1.35;font-weight:600;transition:bottom .25s}
#player:not(.hideui) #pcue{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#player #pcue span{background:#000b;color:#fff;padding:2px 10px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;text-shadow:0 1px 2px #000}
/* the calendar */
.calw .pic .when{position:absolute;left:8px;top:8px;background:#0b0e13d9;color:var(--accent);font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;z-index:1}
.calrow .r{min-width:84px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.mgrid .mh{font-size:11px;color:var(--dim2);text-align:center;font-weight:700;padding:2px 0}
.mgrid .md{min-height:64px;border-radius:10px;background:var(--pan2);border:1px solid var(--line);padding:4px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.mgrid .md span{font-size:12px;color:var(--dim)}.mgrid .md.today{border-color:var(--accentb)}.mgrid .md.today span{color:var(--accent);font-weight:800}
.mgrid .md.sel{background:var(--accentbg)}.mgrid .md.has span{color:var(--text)}
.mgrid .md i{font-style:normal;font-size:9.5px;line-height:1.2;padding:1px 3px;border-radius:4px;background:#16243a;color:#bcd4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgrid .md i.film,.mgrid .md i.saga{background:var(--accentbg);color:var(--accent)}.mgrid .md i.more{background:none;color:var(--dim)}
.seg{display:flex;background:var(--pan2);border:1px solid var(--line);border-radius:13px;padding:3px;margin:2px 0 6px}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:none;color:var(--dim);font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accentbg);color:var(--accent)}
.castrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.castrow::-webkit-scrollbar{display:none}
.castp{flex:none;width:78px;font-size:11.5px;line-height:1.25}.castp b{display:block;font-size:12px;margin-top:4px}.castp>span{color:var(--dim)}
.castimg{position:relative;width:78px;height:104px;border-radius:10px;background:color-mix(in srgb,var(--pan),var(--text) 7%);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-weight:800}
.castimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Play on TV: the remote */
#tvr{position:fixed;inset:0;z-index:120;background:var(--bg);overflow:auto}
#tvr .tvbg{position:absolute;inset:0 0 auto 0;height:300px;background-size:cover;background-position:center;opacity:.25;filter:blur(3px);mask-image:linear-gradient(#000 30%,transparent)}
#tvr .tvin{position:relative;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px))}
#tvr .time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--dim)}
#tvr input[type=range]{accent-color:var(--accentb);height:30px}
#tvr .tvb{width:62px;height:62px;border-radius:50%;font-weight:800;font-size:15px}#tvr .tvb.big{width:78px;height:78px;background:var(--accentd);border-color:var(--accentb);color:#fff}#tvr .tvb svg{width:30px;height:30px}
#tvmini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:#3a1620f5;border:1px solid var(--accentb);z-index:90;cursor:pointer;box-shadow:0 8px 30px #0009}
#player .menu .h{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim2);padding:8px 12px 4px}
