<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Nightvault Collectables</title>
<link rel="icon" href="../favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../hub/nvtheme.js"></script>
<script>NVTHEME.apply('collectables')</script>
<script src="../hub/nvlog.js"></script>
<script src="../hub/nvgroups.js"></script>
<script src="../hub/nvbackup.js"></script>
<script src="../hub/nvsetup.js"></script>
<script src="../hub/nvmenu.js"></script>
<script src="../hub/nvnew.js"></script>
<!-- Nightvault Collectables (test): anything you collect. Every collection has its OWN TEMPLATE (the fields its items get), made by you.
     Items with photos, notes, tags and values; groups like Music (../hub/nvgroups.js); camera in Photo and Barcode mode.
     Plan: plans/collectables.md (nightvault-src). -->
<style>
:root{--bg:#0b0e13;--pan:#151a22;--pan2:#10141b;--line:#232b36;--line2:#33404f;--text:#e9edf2;--dim:#9aa7b5;--dim2:#8fa0b2;--accent:#f1dc6b;--accentt:#f1dc6b;--accentd:#7a6410;--accentb:#a8901f;--accentbg:#2e2a12;--onaccent:#0b0e13;--blue:#7fb2ff;--amber:#f1dc6b;--red:#ef8a8f;--green:#8fe0a0;--cover-ratio:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.muted{color:var(--dim)}.small{font-size:12.5px}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.top h1{font-size:21px;margin:0;flex:1;min-width:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--pan);display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text);cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.hubback{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;margin:0 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--pan);color:var(--text);text-decoration:none;font-size:13.5px}
.btn{height:44px;border-radius:13px;border:1px solid var(--line);background:var(--pan);color:var(--text);font-size:14.5px;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accentd);border-color:var(--accentb);color:#fff;font-weight:700}
.btn.sm{height:34px;font-size:13px;padding:0 12px;border-radius:11px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{height:32px;border-radius:99px;border:1px solid var(--line);background:var(--pan2);color:var(--dim);padding:0 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accentbg);border-color:var(--accentb);color:var(--accentt)}
.chip:disabled{opacity:.45;cursor:default}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=url],textarea,.sel{width:100%;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--pan2);color:var(--text);padding:0 12px;font:inherit;font-size:14.5px}
textarea{padding:10px 12px;min-height:80px;resize:vertical}
select{height:34px;border-radius:11px;border:1px solid var(--line);background:var(--pan2);color:var(--text);padding:0 8px;font:inherit;font-size:13px}
select.sel{height:42px}
.sec{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--dim2);margin:18px 0 6px;text-transform:uppercase}
.mbar{display:flex;gap:8px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
.mtot{font-size:13px;color:var(--dim2);margin:0 2px 6px}
.mtot b{color:var(--text)}
.mlist{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:36px 16px;border:1px dashed var(--line2);border-radius:20px;margin-top:14px}
.empty svg{width:48px;height:48px;color:var(--accent)}
.note{padding:12px 14px;border-radius:16px;background:var(--pan2);border:1px solid var(--line);font-size:13.5px;margin:8px 0}
.note b{color:var(--accentt)}
.up{color:var(--green)}.down{color:var(--red)}
/* collection tiles (start screen) */
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px}
.shelf{position:relative;min-height:150px;border-radius:22px;padding:14px;border:1px solid #ffffff14;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;-webkit-touch-callout:none;user-select:none;color:#e9edf2}
.shelf:active{transform:scale(.985)}
.shelf .ic{position:absolute;left:14px;top:14px;width:44px;height:44px;border-radius:13px;background:#0b0e1366;display:flex;align-items:center;justify-content:center}
.shelf .ic svg{width:26px;height:26px}
.shelf b{font-size:17px;position:relative;line-height:1.2}
.shelf .s{font-size:12.5px;color:#e9edf2b0;position:relative}
.shelf .fan{position:absolute;right:10px;top:12px;width:84px;height:84px}
.shelf .fan img{position:absolute;width:54px;height:54px;object-fit:cover;border-radius:8px;box-shadow:0 4px 14px #0009;border:1px solid #ffffff22;background:#1c2430}
.shelf .fan img:nth-child(1){right:0;top:0;transform:rotate(8deg)}.shelf .fan img:nth-child(2){right:12px;top:6px;transform:rotate(0)}.shelf .fan img:nth-child(3){right:24px;top:12px;transform:rotate(-8deg)}
.shelf.add{border:1px dashed var(--line2);background:var(--pan2);color:var(--dim);align-items:center;justify-content:center;text-align:center;gap:6px}
.shelf.add svg{width:34px;height:34px;color:var(--accent)}
/* item grid: tile shape per collection (--cover-ratio) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 12px;margin-top:6px}
.bk{cursor:pointer;min-width:0;position:relative;-webkit-touch-callout:none;user-select:none}
.cv{position:relative;aspect-ratio:var(--cover-ratio);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--pan),var(--text) 7%);flex:none}
.cv img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv img.b{object-fit:cover;filter:blur(12px) brightness(.55);transform:scale(1.2)}
.cv img.f{object-fit:contain}
.cv .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-weight:700;font-size:13.5px;line-height:1.2;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));overflow:hidden}
.cv .ph span{font-size:11px;font-weight:500;opacity:.8;margin-top:3px}
.cv .ph svg{position:absolute;top:10px;left:10px;width:22px;height:22px;opacity:.55}
.bk .t{font-size:13px;font-weight:600;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .a{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .np{position:absolute;left:6px;bottom:6px;z-index:1;background:#0b0e13d9;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;pointer-events:none}
.cv .tag{position:absolute;top:6px;right:6px;z-index:1;background:#0b0e13d9;color:var(--amber);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;border:1px solid #f1dc6b55;pointer-events:none;max-width:calc(100% - 40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.stack .cv,.stack .gcv{box-shadow:5px -5px 0 -1px #2a3442,10px -10px 0 -2px #1c2430}
.bk.stack{padding-top:10px;padding-right:10px}
.bk .cdl{position:absolute;top:7px;right:7px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;font-size:10.5px;background:#0b0e13d9;color:#7fe3ff;font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:99px;border:1px solid #7fe3ff55;pointer-events:none}
.bk.stack .cdl{top:17px;right:17px}
.pinb{position:absolute;left:7px;top:7px;width:24px;height:24px;border-radius:50%;background:#0b0e13d9;border:1px solid #f1dc6b88;color:var(--amber);font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
.bk.stack>.pinb{top:17px}
.bk.sel .cv{outline:3px solid var(--accent);outline-offset:-3px;transform:scale(.94)}
.bk.sel::after{content:'✓';position:absolute;right:8px;bottom:44px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--onaccent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
#msel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 20px));display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:var(--pan);border:1px solid var(--accentb);box-shadow:0 8px 30px #0009;z-index:7;font-size:14px}
/* group / item header */
.alhead{display:flex;gap:16px;align-items:flex-end;margin:6px 0 12px}
.alhead .gcv{width:min(32vw,140px)}
.alhead b{display:block;font-size:19px;line-height:1.25}
.alhead .muted b{display:inline;font-size:inherit}
.lnk{color:var(--blue);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:12px 0}
.stat{padding:9px 10px;border-radius:14px;background:var(--pan2);border:1px solid var(--line)}
.stat small{display:block;font-size:11px;color:var(--dim);letter-spacing:.3px}
.stat b{font-size:15.5px;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.facts span:nth-child(odd){color:var(--dim)}
.facts a{color:var(--blue);overflow-wrap:anywhere}
.desc{font-size:14px;line-height:1.55;white-space:pre-line}
/* photos of one item */
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none;margin:4px 0 10px}
.gal::-webkit-scrollbar{display:none}
.gal .ph1{flex:none;width:min(78vw,340px);aspect-ratio:var(--cover-ratio);border-radius:16px;overflow:hidden;scroll-snap-align:start;position:relative;background:var(--pan2);cursor:zoom-in}
.gal .ph1:only-child{width:100%;max-height:60vh}
.gal .ph1 img{position:absolute;inset:0;width:100%;height:100%}
.gal .ph1 img.b{object-fit:cover;filter:blur(14px) brightness(.5);transform:scale(1.2)}
.gal .ph1 img.f{object-fit:contain}
.tagl{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--pan2);border:1px solid var(--line);color:var(--dim);margin:0 4px 4px 0}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .n{flex:1;min-width:0}.li .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .n .s{font-size:12.5px;color:var(--dim)}
.li .th{width:40px;flex:none}.li .th .cv{border-radius:7px}.li .th .ph{font-size:7px;padding:3px}.li .th .ph span,.li .th .ph svg{display:none}
/* sheets */
.scrim{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--pan);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));color:var(--text)}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:-6px auto 12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt label{flex:1}
.opt input[type=checkbox],.cb{width:22px;height:22px;accent-color:var(--accentd);flex:none}
.opt.off{opacity:.5}
.field{margin-bottom:10px}.field>label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.yn{display:flex;gap:6px}
/* the template editor */
.frow{display:flex;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--pan2);margin-bottom:6px}
.frow .fn{flex:1;min-width:0}.frow .fn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frow .fn span{font-size:12px;color:var(--dim)}
.frow .mv{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--pan);cursor:pointer;padding:0;font-size:14px;color:var(--dim)}
.frow .mv:disabled{opacity:.3}
.frow.fixed{opacity:.65}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icons button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--pan2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.icons button.on{border-color:var(--accentb);background:var(--accentbg);color:var(--accentt)}
.icons svg{width:22px;height:22px}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.starters button{text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--pan2);cursor:pointer;display:flex;gap:10px;align-items:center}
.starters button svg{width:24px;height:24px;color:var(--accent);flex:none}
.starters button b{display:block;font-size:14px}.starters button span{display:block;font-size:11.5px;color:var(--dim);line-height:1.3}
.phs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.phs .p{position:relative;width:76px;height:76px;flex:none;border-radius:12px;overflow:hidden;background:var(--pan2);border:1px solid var(--line)}
.phs .p img{width:100%;height:100%;object-fit:cover;display:block}
.phs .p button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:13px;cursor:pointer;padding:0}
.phs .p.first::after{content:'Cover';position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:800;background:#000b;color:var(--amber);padding:1px 6px;border-radius:6px}
.phs .add{width:76px;height:76px;flex:none;border-radius:12px;border:1px dashed var(--line2);background:none;color:var(--dim);cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
/* the camera */
#cam{position:fixed;inset:0;z-index:65;background:#000;display:flex;flex-direction:column;color:#fff}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
#cam .ctop{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;gap:8px;align-items:center;background:linear-gradient(#000c,#0000)}
#cam .ctop b{flex:1;font-size:15px}
#cam .cx{width:42px;height:42px;border-radius:50%;border:0;background:#0009;color:#fff;font-size:20px;cursor:pointer}
#cam .frame{position:absolute;left:10%;right:10%;top:34%;height:22%;border:3px solid #ffffffcc;border-radius:16px;box-shadow:0 0 0 9999px #0006;pointer-events:none}
#cam .frame.ok{border-color:var(--green)}
#cam .line{position:absolute;left:14%;right:14%;top:45%;height:2px;background:#ff4d5e;box-shadow:0 0 10px #ff4d5e;pointer-events:none}
#cam .cbot{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0000,#000d);display:flex;flex-direction:column;gap:12px;align-items:center}
#cam .modes{display:flex;gap:6px;background:#0008;padding:4px;border-radius:99px}
#cam .modes button{height:34px;border:0;border-radius:99px;background:none;color:#ddd;padding:0 14px;font-size:13.5px;cursor:pointer}
#cam .modes button.on{background:var(--accent);color:var(--onaccent);font-weight:700}
#cam .modes button:disabled{opacity:.4}
#cam .shut{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#ffffff33;cursor:pointer}
#cam .shut:active{background:#fff}
#cam .crow{display:flex;gap:10px;align-items:center;justify-content:center;width:100%}
#cam .crow .btn{background:#0009;border-color:#ffffff33;color:#fff}
#cam .msg{font-size:13.5px;text-align:center;max-width:420px;text-shadow:0 1px 3px #000}
#cam .shots{display:flex;gap:6px}
#cam .shots img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:2px solid #fff}
#zoom{position:fixed;inset:0;z-index:55;background:#000;display:flex;align-items:center;justify-content:center}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pan);border:1px solid var(--line2);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center;color:var(--text)}
#toast.on{opacity:1}
#toast.act{pointer-events:auto}
#toast button{background:none;border:0;color:var(--accentt);font-weight:800;padding:0 0 0 10px;cursor:pointer}
</style>
</head>
<body>
<script src="../hub/nvsplash.js" data-app="collectables"></script>
<a id="hubback" class="hubback" hidden href="../hub/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg>The Nightvault</a>

<div id="app">
  <div class="top"><button class="ib" id="vback" hidden aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><h1 id="vtitle">Collectables</h1>
    <button class="ib" id="setbtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    <button class="btn primary sm" id="addbtn" style="height:42px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="addlbl">Add</span></button></div>
  <div id="body"></div>
</div>

<div id="sheets"></div>
<input type="file" id="pickpic" accept="image/*" multiple hidden>
<div id="toast"></div>

<script src="app.js"></script>
<script>try{NVMENU.make({app:'collectables', btn:'#setbtn', hub:'../hub/index.html', backup:'collectables'})}catch(e){console.error(e)}</script>
<script>try{ NVNEW.watch({app:'collectables', sel:'[data-item],[data-grp]', key:el => { if(el.dataset.item) return 'i:' + el.dataset.item; const v = cur(); if(!v.coll) return null; const g = groupByKey(v.coll, el.dataset.grp); return g ? (g.all || g.items).map(b => 'i:' + b.id) : null }, keys:() => ITEMS.map(x => 'i:' + x.id)}) }catch(e){}</script>
</body>
</html>
