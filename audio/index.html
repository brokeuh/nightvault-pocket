<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Nightvault Audiobooks</title>
<link rel="icon" href="../favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script>/* the debug log names the app after the title: set it before nvlog.js starts */ if(/[?&]mode=music(&|$)/.test(location.search)) document.title = 'Nightvault Music'</script>
<script src="../hub/nvlog.js"></script>
<!-- Nightvault Audio (test): one app for Audiobooks (?mode=audiobooks, built) and Music (?mode=music, later), one shared player.
     Books are copied into the app (IndexedDB), so they play without internet. Plan: plans/audiobooks.md and plans/music.md (nightvault-src). -->
<style>
:root{--bg:#0b0e13;--pan:#151a22;--pan2:#10141b;--line:#232b36;--text:#e9edf2;--dim:#9aa7b5;--dim2:#8fa0b2;--accent:#5fe0b0;--accentd:#2a8f6a;--blue:#7fb2ff;--amber:#f1dc6b;--red:#ef8a8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.muted{color:var(--dim)}.small{font-size:12.5px}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.top h1{font-size:21px;margin:0;flex:1;letter-spacing:.2px}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--pan);display:inline-flex;align-items:center;justify-content:center;padding:0;color:#c4cdd8;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.hubback{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;margin:0 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--pan);color:var(--text);text-decoration:none;font-size:13.5px}
.btn{height:44px;border-radius:13px;border:1px solid var(--line);background:var(--pan);color:var(--text);font-size:14.5px;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accentd);border-color:#3fbf91;color:#fff;font-weight:700}
.btn.sm{height:34px;font-size:13px;padding:0 12px;border-radius:11px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{height:32px;border-radius:99px;border:1px solid var(--line);background:var(--pan2);color:var(--dim);padding:0 12px;font-size:13px;cursor:pointer}
.chip.on{background:#173a30;border-color:#2e6b55;color:var(--accent)}
input[type=search],input[type=text]{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--pan2);color:var(--text);padding:0 12px;font:inherit;font-size:14.5px}
select{height:34px;border-radius:11px;border:1px solid var(--line);background:var(--pan2);color:var(--text);padding:0 8px;font:inherit;font-size:13px}
/* continue card */
.cont{display:flex;gap:14px;align-items:center;padding:12px;border-radius:18px;background:linear-gradient(135deg,#13283d,#13342c);border:1px solid #24405e;cursor:pointer;margin:6px 0 4px}
.cont .cv{width:74px;height:74px;border-radius:12px}
.cont small{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;color:#a9c4ff}
.cont b{display:block;font-size:15.5px;line-height:1.25;margin-top:2px}
/* cover grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px 12px;margin-top:6px}
.bk{cursor:pointer;min-width:0}
.cv{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#1a2230;flex:none}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-weight:700;font-size:14px;line-height:1.2;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2))}
.cv .ph span{font-size:11px;font-weight:500;opacity:.8;margin-top:3px}
.cv .done{position:absolute;top:6px;right:6px;background:#0b0e13cc;color:var(--accent);font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.bk .t{font-size:13.5px;font-weight:600;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .a{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:4px;border-radius:99px;background:#232b36;overflow:hidden;margin-top:5px}.pbar i{display:block;height:100%;background:var(--accent)}
.empty{text-align:center;padding:40px 16px;border:1px dashed #2f3a48;border-radius:20px;margin-top:14px}
.empty svg{width:48px;height:48px;color:var(--blue)}
.store{font-size:12px;color:#6f7d8c;text-align:center;margin-top:22px}
/* mini player */
#mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 20px));display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;background:#18202bf2;border:1px solid #2a3442;box-shadow:0 8px 30px #0008;z-index:4;cursor:pointer}
#mini .cv{width:46px;height:46px;border-radius:10px}
#mini .cv .ph{font-size:9px;padding:5px}#mini .cv .ph span{display:none}
#mini .tx{flex:1;min-width:0}#mini .tx b,#mini .tx div{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mini .tx b{font-size:14px}#mini .tx div{font-size:12px;color:var(--dim)}
#mini .pbar{position:absolute;left:14px;right:14px;bottom:3px;height:2px;margin:0}
/* player */
#player{position:fixed;inset:0;background:var(--bg);z-index:6;overflow:auto}
#player>div{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
#player .bg{position:fixed;inset:0;z-index:-1;opacity:.28;filter:blur(40px) saturate(1.3);background-size:cover;background-position:center}
.pcover{width:min(78vw,340px,42vh);margin:8px auto 0}
.pcover .cv{border-radius:20px;box-shadow:0 18px 50px #000a}
.pcover .cv .ph{font-size:22px;padding:18px}.pcover .cv .ph span{font-size:14px}
.ptitle{text-align:center;margin-top:16px}
.ptitle b{display:block;font-size:19px;line-height:1.25}
.ptitle div{color:var(--dim);font-size:13.5px;margin-top:3px}
.chap{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px auto 0;max-width:100%;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--pan);font-size:13.5px;cursor:pointer;color:var(--text)}
.chap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range].seek{width:100%;margin:16px 0 0;accent-color:var(--accent);height:28px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.booktime{text-align:center;font-size:12px;color:var(--dim2);margin-top:4px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:14px auto 0;width:100%;max-width:400px}
.ctl button{background:none;border:0;cursor:pointer;color:#dfe6ee;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;padding:0}
.ctl button svg{width:30px;height:30px}
.ctl .skip svg{width:40px;height:40px}
.ctl .pp{width:76px;height:76px;background:var(--accent);color:#08251b}
.ctl .pp svg{width:36px;height:36px}
.tools{display:flex;justify-content:space-around;margin-top:auto;padding-top:22px}
.tools button{background:none;border:0;color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;min-width:64px}
.tools button svg{width:22px;height:22px}
.tools button b{color:var(--text);font-size:13px;font-weight:600}
.tools button.on{color:var(--accent)}.tools button.on b{color:var(--accent)}
/* sheets */
.scrim{position:fixed;inset:0;background:#000a;z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--pan);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:#3a4553;margin:-6px auto 12px}
.li{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .n{flex:1;min-width:0}.li .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.li.cur{color:var(--accent)}
.li .x{background:none;border:0;color:var(--dim);cursor:pointer;padding:4px 6px;font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.speedv{font-size:34px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.sheet input[type=range]{width:100%;accent-color:var(--accent)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt label{flex:1}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--accentd)}
.grp{padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--pan2)}
.prog{height:6px;border-radius:99px;background:#232b36;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.prog.busy i{width:30%;transition:none;animation:nvbusy 1.3s ease-in-out infinite}@keyframes nvbusy{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222a33;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
/* music */
#mmini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 20px));display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;background:#1d1828f2;border:1px solid #3a2f4a;box-shadow:0 8px 30px #0008;z-index:4;cursor:pointer}
#mmini .cv{width:46px;height:46px;border-radius:10px}
#mmini .cv .ph{font-size:9px;padding:5px}#mmini .cv .ph span{display:none}
#mmini .tx{flex:1;min-width:0}#mmini .tx b,#mmini .tx div{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mmini .tx b{font-size:14px}#mmini .tx div{font-size:12px;color:var(--dim)}
#mmini .pbar{position:absolute;left:14px;right:14px;bottom:3px;height:2px;margin:0}
#mmini .ib{border:0;background:none}
#mplayer{position:fixed;inset:0;background:var(--bg);z-index:6;overflow:auto}
#mplayer>div{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
#mplayer .bg{position:fixed;inset:0;z-index:-1;opacity:.3;filter:blur(40px) saturate(1.4);background-size:cover;background-position:center}
#mpcover{touch-action:pan-y}
.mprow{display:flex;align-items:center;gap:10px;margin-top:18px}
.mpt{flex:1;min-width:0}.mpt b{display:block;font-size:20px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mpt div{color:var(--dim);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib.heart{border:0;background:none}.ib.heart svg{width:26px;height:26px}.ib.heart.on{color:#ff7aa8}
#mplayer .ctl button.on{color:var(--accent)}
#mplayer .ctl .rep1{position:relative}#mplayer .ctl .rep1:after{content:'1';position:absolute;top:9px;right:9px;font-size:10px;font-weight:800;background:var(--accent);color:#08251b;border-radius:99px;width:14px;height:14px;line-height:14px;text-align:center}
.mtabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 8px;scrollbar-width:none}.mtabs::-webkit-scrollbar{display:none}
.mtabs .chip{flex:none}
.mbar{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.li .th{width:44px;height:44px;border-radius:8px;flex:none}.li .th .ph{font-size:8px;padding:4px}.li .th .ph span{display:none}
.li .no{width:26px;text-align:right;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.li.cur .n div:first-child,.li.cur .no{color:var(--accent)}
.li .n div:first-child{color:var(--text)}
.li .n .s{font-size:12.5px;color:var(--dim)}
.li .av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.alhead{display:flex;gap:16px;align-items:flex-end;margin:6px 0 12px}
.alhead .cv{width:min(40vw,170px);border-radius:16px;box-shadow:0 10px 30px #0008}
.alhead b{display:block;font-size:19px;line-height:1.25}
.alhead .lnk{color:var(--blue);cursor:pointer}
.sec{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--dim2);margin:18px 0 6px;text-transform:uppercase}
.more{display:block;width:100%;margin-top:10px}
.mlist{display:flex;flex-direction:column;gap:8px}
.cdh{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border:1px solid var(--line);border-radius:16px;background:var(--pan2);margin-top:10px;cursor:pointer}
.cdh .cdcv{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;background:#1a2230;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.cdh .cdcv img{width:100%;height:100%;object-fit:cover}
.cdh b{font-size:15.5px;color:#f1dc6b}.cdh .n{flex:1;min-width:0}.cdh .s{font-size:12.5px;color:var(--dim)}
.cdh .chev{display:inline-block;font-size:22px;color:var(--dim);transition:transform .15s;width:18px;text-align:center}.cdh.on .chev{transform:rotate(90deg)}
.cdlist{padding:2px 0 4px 8px}
.bk .cdl{position:absolute;top:7px;right:7px;background:#0b0e13d9;color:#f1dc6b;font-size:11.5px;font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:99px;border:1px solid #f1dc6b55;pointer-events:none}
</style>
</head>
<body>
<a id="hubback" class="hubback" hidden href="../hub/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5fe0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg>The Nightvault</a>

<!-- library -->
<div id="lib">
  <div class="top"><h1 id="apptitle">Audiobooks</h1>
    <button class="ib" id="setbtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    <button class="btn primary sm" id="addbtn" style="height:42px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button></div>
  <div id="libbody"></div>
</div>
<!-- music (?mode=music) -->
<div id="mlib" hidden>
  <div class="top"><button class="ib" id="mvback" hidden aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><h1 id="mtitle">Music</h1>
    <button class="ib" id="msetbtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    <button class="btn primary sm" id="maddbtn" style="height:42px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button></div>
  <div id="mbody"></div>
</div>
<div id="mmini" hidden></div>
<div id="mplayer" hidden><div class="bg" id="mpbg"></div><div>
  <div class="top" style="padding:0">
    <button class="ib" id="mpclose" aria-label="Back to the library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div style="flex:1;text-align:center;font-size:12px;color:var(--dim2);font-weight:700;letter-spacing:.6px" id="mpfrom">NOW PLAYING</div>
    <button class="ib" id="mpmore" aria-label="More for this song"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="pcover" id="mpcover"></div>
  <div class="mprow"><div class="mpt"><b id="mptitle"></b><div id="mpartist"></div></div><button class="ib heart" id="mpfav" aria-label="Favourite"></button></div>
  <input type="range" class="seek" id="mseek" min="0" max="1000" value="0" aria-label="Position">
  <div class="times"><span id="mtl">0:00</span><span id="mtr">0:00</span></div>
  <div class="ctl">
    <button id="mshuf" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="skip" id="mprev" aria-label="Previous song"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="pp" id="mpp" aria-label="Play"></button>
    <button class="skip" id="mnext" aria-label="Next song"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button id="mrep" aria-label="Repeat"></button>
  </div>
  <div class="tools">
    <button id="mtqueue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h13M3 12h13M3 18h8M19 14v7M16 18l3 3 3-3"/></svg>Queue</button>
    <button id="mtalbum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>Album</button>
    <button id="mtlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h13M3 12h13M3 18h8M18 15v6M15 18h6"/></svg>Playlist</button>
    <button id="mtsleep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="msleeplbl">Sleep</span></button>
  </div>
</div></div>
<input type="file" id="mpick" multiple hidden accept="audio/*,.mp3,.m4a,.aac,.ogg,.oga,.opus,.flac,.wav,.webm,.jpg,.jpeg,.png">
<input type="file" id="mpickdir" webkitdirectory multiple hidden>
<input type="file" id="mcover" accept="image/*" hidden>

<!-- mini player -->
<div id="mini" hidden></div>

<!-- full player -->
<div id="player" hidden><div class="bg" id="pbg"></div><div>
  <div class="top" style="padding:0">
    <button class="ib" id="pclose" aria-label="Back to the shelf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div style="flex:1;text-align:center;font-size:12px;color:var(--dim2);font-weight:700;letter-spacing:.6px">NOW LISTENING</div>
    <button class="ib" id="pmore" aria-label="About this book"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>

    if(sr === serial){ let q = 0; for(const s of segs){ part.push(data.subarray(q, q + s)); q += s;
      if(s < 255){ let len = 0; for(const x of part) len += x.length; const pk = new Uint8Array(len); let o = 0; for(const x of part){ pk.set(x, o); o += x.length } packets.push(pk); part = []; if(packets.length >= 2) break } } }

    for(let i = b.length - 27; i >= 0; i--) if(b[i] === 0x4f && b[i + 1] === 0x67 && b[i + 2] === 0x67 && b[i + 3] === 0x53 && dv.getUint32(i + 14, true) === serial){

/* ---------- files in a folder on the phone (Android app, NvFiles plugin): read and played where they are, not copied ---------- */
let NvFiles = null; if(NATIVE) try{ NvFiles = Capacitor.registerPlugin('NvFiles') }catch(e){ NvFiles = null }

const linkUrl = (uri, name) => '/_nvfile_/' + b64url(uri) + '/' + encodeURIComponent(name);
/* looks like a File to the tag readers: slice(a, b).arrayBuffer() reads only those bytes */
class LinkFile{ constructor(o){ Object.assign(this, o); this.url = linkUrl(o.uri, o.name) }
  slice(a, z){ const me = this; return {arrayBuffer:async () => { if(z <= a) return new ArrayBuffer(0); return linkRead(me, a, z) }} }
  async blob(){ return (await fetch(this.url, {cache:'no-store'})).blob() } }

/* read bytes a..z of a file in a folder: through the /_nvfile_/ address, else straight from the plugin (base64) */
const LDIAG = {fetchOK:0, fetchBad:0, plugin:0, last:''};
async function linkRead(f, a, z){
  if(LDIAG.fetchBad < 3 || LDIAG.fetchOK) try{ const r = await fetch(f.url, {headers:{Range:`bytes=${a}-${z - 1}`}, cache:'no-store'});
      if(r.ok){ const b = await r.arrayBuffer(); if(b.byteLength === z - a || (r.status === 206 && b.byteLength > 0)){ LDIAG.fetchOK++; return b } LDIAG.last = `address gave ${b.byteLength} bytes (status ${r.status}) for ${z - a}` }
      else LDIAG.last = 'address answered ' + r.status }catch(e){ LDIAG.last = 'address failed: ' + (e.message || e) }
  LDIAG.fetchBad++; LE('read', 'address read failed, using the plugin', {file:f.name, a, z, why:LDIAG.last});
  const o = await NvFiles.read({uri:f.uri, offset:a, length:z - a}); LDIAG.plugin++;
  const bin = atob(o.data || ''), u8 = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8.buffer }

/* "Check the file": what works and what not, to send to the developer */

  $('#ckcopy').onclick = () => { try{ navigator.clipboard.writeText(txt); toast('Copied') }catch(e){} } }

/* length of anything else: ask the browser */
function probeDur(blob, type){ return new Promise(ok => { const a = new Audio(), u = blob.url || URL.createObjectURL(type ? new Blob([blob], {type}) : blob); let done = false;

/* quick = never ask the browser for the length (it can wait up to 12 s per file; music takes the length when it plays) */
async function fileInfo(f, quick){

  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist() }catch(e){}
  const total = D.reduce((a, d) => a + d.size, 0), linked = PENDING && PENDING.linked; let done = 0;
  try{ const e = await navigator.storage.estimate(); if(!linked && e && e.quota && e.quota - e.usage < total * 1.05){ toast(`Not enough space: ${mb(total)} needed, ${mb(e.quota - e.usage)} free`, 5000); return } }catch(e){}
  sheet(`<h3>${linked ? 'Adding…' : 'Copying into the app…'}</h3><div class="prog"><i id="cp"></i></div><div class="muted small" id="cpt"></div>`, true);
  let added = 0;
  for(const d of D){
    const id = uid(), parts = [], chapters = []; let t0 = 0;
    try{
      for(const it of d.parts){ const fid = uid(), e = ext(it.f.name);
        $('#cpt').textContent = `${d.title} · ${it.f.name}`;
        if(!linked) await dbPut('files', {id:fid, blob:it.f});
        done += it.f.size; $('#cp').style.width = (100 * done / total) + '%';
        const dur = it.info.dur || 0, ttl = it.info.tags.title && d.parts.length > 1 ? it.info.tags.title : cleanName(it.f.name);
        parts.push(linked ? {uri:it.f.uri, name:it.f.name, type:MIME[e] || it.f.type || 'audio/mpeg', size:it.f.size, dur, title:ttl}
          : {fid, name:it.f.name, type:MIME[e] || it.f.type || 'audio/mpeg', size:it.f.size, dur, title:ttl});
        if(it.info.chapters.length) for(const c of it.info.chapters){ if(c.t < dur || !dur) chapters.push({t:t0 + c.t, title:c.title || `Chapter ${chapters.length + 1}`}) }
        else if(d.parts.length > 1) chapters.push({t:t0, title:ttl});
        t0 += dur }
      let cover = d.parts.map(i => i.info.tags.cover).find(Boolean);
      if(!cover && PENDING && PENDING.pics.length){ const dir = d.parts[0].dir; const pics = PENDING.pics.filter(p => !dir || folderOf(p) === dir);
        cover = (pics.find(p => /cover|folder|front/i.test(p.name)) || pics[0]) || null }
      if(cover && cover.uri) cover = await cover.blob().catch(() => null);
      if(cover) await dbPut('covers', {id, blob:cover});
      const book = {id, kind:'audiobook', title:d.title, author:d.author, narrator:d.narrator, year:d.year, parts, chapters, dur:t0, size:d.size, added:Date.now(), hasCover:!!cover, linked:linked ? {tree:linked.tree, name:linked.name} : null};
      await dbPut('books', book); BOOKS.push(book); added++;
    }catch(err){ if(!linked) for(const p of parts) await dbDel('files', p.fid).catch(() => {}); closeSheet(); toast(`Could not copy "${d.title}": ${err && err.name === 'QuotaExceededError' ? 'the phone is full' : (err && err.message) || err}`, 6000); break }
  }
  PENDING = null; closeSheet(); if(added) toast(added === 1 ? 'Audiobook added' : `${added} audiobooks added`); drawLib();
}

async function linkFolder(f){
  try{ f = f || await NvFiles.pickFolder() }catch(e){ if(!/cancel|No folder/i.test(e.message || '')) toast(e.message || String(e)); return }
  const fl = lsGet('nvAudio.folders', []); if(!fl.some(x => x.tree === f.tree)){ fl.push({tree:f.tree, name:f.name}); lsSet('nvAudio.folders', fl) }
  sheet(`<h3>Looking in “${esc(f.name)}”…</h3><div class="prog busy"><i></i></div>`, true);
  let list; try{ list = (await NvFiles.list({tree:f.tree})).files || [] }catch(e){ LE('folder', 'list failed', e); closeSheet(); toast(e.message || String(e), 5000); return }
  L('folder', `“${f.name}”: ${list.length} files`, list.slice(0, 40).map(x => `${x.path} ${x.size} ${x.mime}`));
  const have = new Set(); for(const b of BOOKS) for(const p of b.parts) if(p.uri) have.add(p.uri);
  const root = f.name, files = list.filter(x => !have.has(x.uri)).map(x => new LinkFile({uri:x.uri, name:x.name, size:x.size, type:x.mime || MIME[ext(x.name)] || '', webkitRelativePath:x.path, rootLevel:x.path.split('/').length === 2}));
  if(!files.some(x => AUDIO_RE.test(x.name))){ closeSheet(); toast(list.length ? `No new audiobooks in “${root}”` : `“${root}” is empty`, 4000); return }
  review(files, {linked:{tree:f.tree, name:root}}) }
async function drawFolders(){
  const el = $('#fldrs'); if(!el) return; let fl = lsGet('nvAudio.folders', []);
  try{ const ok = new Set(((await NvFiles.folders()).folders || []).map(x => x.tree)); fl = fl.filter(x => ok.has(x.tree)); lsSet('nvAudio.folders', fl) }catch(e){}
  el.innerHTML = fl.length ? fl.map((f, i) => `<div class="li" style="cursor:default"><div class="n"><div style="color:var(--text)">${esc(f.name)}</div><div>${BOOKS.filter(b => b.linked && b.linked.tree === f.tree).length} books</div></div><button class="btn sm" data-scan="${i}">Look for new books</button><button class="x" data-forget="${i}" aria-label="Forget this folder">✕</button></div>`).join('') : 'No folders yet.';
  el.onclick = async e => { const s = e.target.closest('[data-scan]'), g = e.target.closest('[data-forget]');
    if(s){ closeSheet(); linkFolder(fl[+s.dataset.scan]) }
    if(g){ const f = fl[+g.dataset.forget], n = BOOKS.filter(b => b.linked && b.linked.tree === f.tree).length;
      if(n){ toast(`${n} book${n === 1 ? '' : 's'} still play from “${f.name}” - remove them first`, 4500); return }
      await NvFiles.forget({tree:f.tree}).catch(() => {}); lsSet('nvAudio.folders', fl.filter(x => x.tree !== f.tree)); drawFolders() } } }

/* ---------- chapters and positions ---------- */
function chaptersOf(b){ return b.chapters && b.chapters.length ? b.chapters : [{t:0, title:b.title}] }
function chapterIdx(b, t){ const c = chaptersOf(b); let i = 0; while(i + 1 < c.length && c[i + 1].t <= t + 0.25) i++; return i }
function chapterAt(b, t){ const c = chaptersOf(b), i = chapterIdx(b, t); return {i, title:b.chapters && b.chapters.length ? c[i].title : '', start:c[i].t, end:i + 1 < c.length ? c[i + 1].t : b.dur} }
function partStarts(b){ let t = 0; return b.parts.map(p => { const s = t; t += p.dur || 0; return s }) }
function partAt(b, t){ const s = partStarts(b); let i = 0; while(i + 1 < s.length && s[i + 1] <= t) i++; return {i, off:Math.max(0, t - s[i])} }

/* ---------- the player ---------- */
const au = $('#au');
let cur = null, curPart = -1, curUrl = null, pausedAt = 0, seeking = false;
try{ au.preservesPitch = true }catch(e){}
const gpos = () => !cur ? 0 : curPart < 0 ? (st(cur.id).pos || 0) : partStarts(cur)[curPart] + (au.currentTime || 0);
const rate = () => cur ? (st(cur.id).speed || S.speed || 1) : 1;

async function loadPart(i, off, play){
  const p = cur.parts[i]; if(!p) return;
  if(curPart !== i || !au.src){
    if(curUrl) URL.revokeObjectURL(curUrl); curUrl = null;
    L('player', 'open part ' + (i + 1) + ': ' + p.name, {linked:!!p.uri, type:p.type, size:p.size, dur:p.dur, at:off});
    if(p.uri){ au.src = linkUrl(p.uri, p.name) }                  // played straight from the folder on the phone
    else { const rec = await dbGet('files', p.fid);
      if(!rec || !rec.blob){ toast('This part of the book is missing - add the book again'); return }
      curUrl = URL.createObjectURL(rec.blob.type ? rec.blob : new Blob([rec.blob], {type:p.type})); au.src = curUrl }
    curPart = i;
    const t0 = Date.now(); const loaded = await new Promise(ok => { let t = 0; const done = v => { clearTimeout(t); au.removeEventListener('loadedmetadata', yes); au.removeEventListener('error', no); ok(v) }, yes = () => done(true), no = () => done(false);
      au.addEventListener('loadedmetadata', yes); au.addEventListener('error', no); t = setTimeout(() => done(false), p.uri ? 20000 : 30000) });
    L('player', loaded ? `ready in ${Date.now() - t0} ms, length ${au.duration}` : 'did not get ready', {error:au.error && {code:au.error.code, msg:au.error.message}, network:au.networkState, ready:au.readyState});
    if(!loaded && p.uri && !au.error){ curPart = -1; au.removeAttribute('src'); au.load();
      sheet(`<h3>The book does not start</h3><p class="muted small">The file “${esc(p.name)}” could not be opened from the folder. Tap <b>Check the file</b> and send a screenshot to Claude.</p><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="closeSheet()">Close</button><button class="btn primary" style="flex:1" id="ck1">Check the file</button></div>`);
      $('#ck1').onclick = () => checkFile(p); return }
    if(au.error && p.uri){ const r = await fetch(linkUrl(p.uri, p.name), {headers:{Range:'bytes=0-0'}}).catch(() => null);
      if(!r || !r.ok){ toast(`“${p.name}” is not in the folder any more - was it moved or deleted? Add the book again.`, 6000); curPart = -1; return } }
    if(au.error && p.uri){ curPart = -1;
      sheet(`<h3>The book does not play</h3><p class="muted small">The player could not use “${esc(p.name)}” (error ${au.error.code}). Tap <b>Check the file</b> and send a screenshot to Claude.</p><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="closeSheet()">Close</button><button class="btn primary" style="flex:1" id="ck2">Check the file</button></div>`);
      $('#ck2').onclick = () => checkFile(p); return }
    if(au.error){ toast(`This phone cannot play ${ext(p.name).toUpperCase()} files${p.type === 'audio/mp4' ? ' (try MP3)' : ''}`, 5000); return }
    if(isFinite(au.duration) && au.duration > 0 && Math.abs((p.dur || 0) - au.duration) > 1){ p.dur = au.duration; cur.dur = cur.parts.reduce((a, x) => a + (x.dur || 0), 0); dbPut('books', cur).catch(() => {}) } }
  try{ au.currentTime = off }catch(e){}
  au.playbackRate = rate(); try{ au.preservesPitch = true }catch(e){}
  if(play) await au.play().catch(e => toast('Tap play to start'));
}
async function openBook(id, play){
  const b = BOOKS.find(x => x.id === id); if(!b) return;
  if(!cur || cur.id !== b.id){
    if(cur){ au.pause(); saveState(cur.id, true) }
    cur = b; curPart = -1; au.removeAttribute('src');
    lsSet('nvAudio.last', b.id); L('book', 'open ' + b.title, {parts:b.parts.map(p => ({name:p.name, linked:!!p.uri, dur:p.dur, size:p.size})), chapters:(b.chapters || []).length, dur:b.dur});
    const s = st(b.id), {i, off} = partAt(b, s.finished ? 0 : s.pos || 0);
    if(s.finished){ s.finished = false; s.pos = 0 }
    await loadPart(i, off, false); artKey = null }
  showPlayer(true); drawPlayer(true);
  if(play) togglePlay(true);
}
async function seekTo(t, keepPlaying){
  if(!cur) return; t = Math.max(0, Math.min(t, Math.max(0, cur.dur - 0.5)));
  const play = keepPlaying === undefined ? !au.paused : keepPlaying, {i, off} = partAt(cur, t);
  if(i !== curPart) await loadPart(i, off, play); else { try{ au.currentTime = off }catch(e){} }
  st(cur.id).pos = t; saveState(cur.id); drawPlayer(); syncMedia();
}
async function togglePlay(force){
  if(!cur) return;
  const want = force === undefined ? au.paused : force;
  if(want){
    if(S.smart && pausedAt){ const away = (Date.now() - pausedAt) / 1000; const back = away > 3600 ? 30 : away > 600 ? 15 : away > 60 ? 5 : 0; if(back) await seekTo(gpos() - back, false) }
    if(curPart < 0){ const {i, off} = partAt(cur, st(cur.id).pos || 0); await loadPart(i, off, false) }
    au.playbackRate = rate();
    if(curPart < 0) return;
    L('player', 'play', {part:curPart, t:au.currentTime, ready:au.readyState, network:au.networkState});
    await au.play().catch(e => { LE('player', 'play() failed', e); if(e && e.name !== 'AbortError') toast('Could not start playing: ' + (e.message || e)) });
  } else au.pause();
}
function finishBook(){ const s = st(cur.id); s.finished = true; s.pos = cur.dur; saveState(cur.id, true); au.pause(); drawPlayer(); toast('Finished: ' + cur.title) }
for(const ev of ['loadstart', 'loadedmetadata', 'canplay', 'playing', 'waiting', 'stalled', 'suspend', 'pause', 'ended', 'error', 'abort', 'emptied']) au.addEventListener(ev, () => L('audio', ev, {t:Math.round(au.currentTime * 10) / 10, ready:au.readyState, network:au.networkState, err:au.error ? au.error.code + ' ' + au.error.message : undefined}));
au.addEventListener('ended', async () => { if(!cur) return; if(curPart + 1 < cur.parts.length) await loadPart(curPart + 1, 0, true); else finishBook() });
au.addEventListener('play', () => { pausedAt = 0; drawPP(); syncMedia(); sleepTick() });
au.addEventListener('pause', () => { pausedAt = Date.now(); if(cur){ st(cur.id).pos = gpos(); saveState(cur.id, true) } drawPP(); syncMedia() });
let lastSave = 0;
au.addEventListener('timeupdate', () => { if(!cur || curPart < 0) return; const s = st(cur.id); s.pos = gpos(); s.last = Date.now();
  if(Date.now() - lastSave > 5000){ lastSave = Date.now(); saveState(cur.id) }
  if(sleep && sleep.chapter != null && chapterIdx(cur, s.pos) > sleep.chapter){ sleep = null; au.pause(); drawSleep(); toast('Sleep timer: paused at the end of the chapter') }
  if(!seeking) drawPlayer() });
document.addEventListener('visibilitychange', () => { if(document.hidden && cur){ st(cur.id).pos = gpos(); saveState(cur.id, true) } });
addEventListener('pagehide', () => { if(cur){ st(cur.id).pos = gpos(); saveState(cur.id, true) } });

/* ---------- drawing the player ---------- */
const IC_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const IC_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
function drawPP(){ $('#pp').innerHTML = au.paused ? IC_PLAY : IC_PAUSE; $('#pp').setAttribute('aria-label', au.paused ? 'Play' : 'Pause'); drawMini() }
function showPlayer(on){ $('#player').hidden = !on; document.body.style.overflow = on ? 'hidden' : ''; if(!on) drawLib(); drawMini() }
async function drawPlayer(full){
  if(!cur) return; const b = cur, t = gpos() || st(b.id).pos || 0, c = chapterAt(b, t), r = rate();
  if(full){ const u = await coverUrl(b); $('#pcover').innerHTML = coverHTML(b, u); $('#pbg').style.backgroundImage = u ? `url("${u}")` : 'none';
    $('#ptitle').textContent = b.title; $('#pauthor').textContent = [b.author, b.narrator ? 'read by ' + b.narrator : ''].filter(Boolean).join(' · ');
    $('#backn').textContent = S.back; $('#fwdn').textContent = S.fwd; drawPP(); drawSleep() }
  const has = b.chapters && b.chapters.length;
  $('#pchap').style.visibility = has ? 'visible' : 'hidden';
  $('#pchapname').textContent = has ? `${c.i + 1}/${b.chapters.length} · ${c.title}` : '';
  const a = has ? c.start : 0, z = has ? c.end : b.dur, len = Math.max(0.1, z - a);
  if(!seeking) $('#seek').value = Math.round(1000 * (t - a) / len);
  $('#tleft').textContent = clock(t - a); $('#tright').textContent = '-' + clock((z - t) / r);
  const left = Math.max(0, b.dur - t);
  $('#booktime').textContent = b.dur ? `${Math.round(100 * t / b.dur)}% · ${hm(left / r)} left${r !== 1 ? ' at ' + speedTxt(r) : ''}` : '';
  $('#speedlbl').textContent = speedTxt(r);
  $('#prevch').style.opacity = has ? 1 : .35; $('#nextch').style.opacity = has ? 1 : .35;
  drawMini();
}
async function drawMini(){
  const m = $('#mini'); if(!cur || !$('#player').hidden || MODE !== 'audiobooks'){ m.hidden = true; return }
  const t = gpos() || st(cur.id).pos || 0, c = chapterAt(cur, t);
  m.hidden = false;
  if(m.dataset.id !== cur.id){ m.dataset.id = cur.id; m.innerHTML = `<span id="mcv">${coverHTML(cur, await coverUrl(cur))}</span><div class="tx"><b>${esc(cur.title)}</b><div id="msub"></div></div><button class="ib" id="mpp" aria-label="Play or pause" style="border-radius:50%;background:var(--accent);color:#08251b;border:0"></button><div class="pbar"><i id="mbar"></i></div>`;
    $('#mpp').onclick = e => { e.stopPropagation(); togglePlay() } }
  $('#msub').textContent = c.title || (cur.dur ? hm((cur.dur - t) / rate()) + ' left' : '');
  $('#mpp').innerHTML = au.paused ? IC_PLAY : IC_PAUSE;
  $('#mbar').style.width = (cur.dur ? 100 * t / cur.dur : 0) + '%';
}
$('#mini').onclick = () => { if(cur){ showPlayer(true); drawPlayer(true) } };
$('#pclose').onclick = () => showPlayer(false);
$('#pp').onclick = () => togglePlay();
$('#back').onclick = () => seekTo(gpos() - S.back);
$('#fwd').onclick = () => seekTo(gpos() + S.fwd);
$('#prevch').onclick = () => { if(!cur) return; const t = gpos(), c = chapterAt(cur, t); seekTo(t - c.start > 3 || c.i === 0 ? c.start : chaptersOf(cur)[c.i - 1].t) };
$('#nextch').onclick = () => { if(!cur) return; const c = chapterAt(cur, gpos()), ch = chaptersOf(cur); if(c.i + 1 < ch.length) seekTo(ch[c.i + 1].t) };
$('#pchap').onclick = () => openList('chapters');
$('#tlist').onclick = () => openList('chapters');
$('#seek').addEventListener('input', () => { seeking = true; const b = cur, has = b.chapters && b.chapters.length, c = chapterAt(b, gpos()), a = has ? c.start : 0, z = has ? c.end : b.dur; const t = a + (z - a) * $('#seek').value / 1000; $('#tleft').textContent = clock(t - a); $('#tright').textContent = '-' + clock((z - t) / rate()); $('#seek').dataset.t = t });
$('#seek').addEventListener('change', () => { seeking = false; if($('#seek').dataset.t) seekTo(+$('#seek').dataset.t) });

/* ---------- sheets ---------- */
function sheet(html, sticky){ $('#sheets').innerHTML = `<div class="scrim" id="scrim"><div class="sheet"><div class="grab"></div>${html}</div></div>`; $('#scrim').dataset.sticky = sticky ? '1' : '';
  $('#scrim').onclick = e => { if(e.target.id === 'scrim' && !$('#scrim').dataset.sticky) closeSheet() } }
function closeSheet(){ $('#sheets').innerHTML = '' }
const sheetOpen = () => !!$('#scrim');

function openList(tab){
  if(!cur) return; const b = cur, s = st(b.id), t = gpos(), ci = chapterIdx(b, t), r = rate();
  const ch = chaptersOf(b);
  const chHTML = (b.chapters && b.chapters.length) ? ch.map((c, i) => { const end = i + 1 < ch.length ? ch[i + 1].t : b.dur; return `<div class="li ${i === ci ? 'cur' : ''}" data-t="${c.t}"><div class="n"><div>${esc(c.title)}</div></div><span class="r">${clock(c.t)} · ${hm((end - c.t) / r)}</span></div>` }).join('') : '<p class="muted">This book has no chapters.</p>';
  const mk = s.marks.slice().sort((x, y) => x.t - y.t);
  const bmHTML = mk.length ? mk.map(m => `<div class="li" data-t="${m.t}"><div class="n"><div>${esc(m.note || chapterAt(b, m.t).title || 'Bookmark')}</div><div class="muted small">${clock(m.t)} · ${new Date(m.at).toLocaleDateString()}</div></div><button class="x" data-del="${m.at}" aria-label="Remove bookmark">✕</button></div>`).join('') : '<p class="muted small">No bookmarks yet. Tap <b>Bookmark</b> in the player to keep a spot.</p>';
  sheet(`<div class="tabs"><button class="chip ${tab === 'chapters' ? 'on' : ''}" data-tab="chapters">Chapters${b.chapters && b.chapters.length ? ' (' + b.chapters.length + ')' : ''}</button><button class="chip ${tab === 'marks' ? 'on' : ''}" data-tab="marks">Bookmarks${mk.length ? ' (' + mk.length + ')' : ''}</button></div><div id="lst">${tab === 'chapters' ? chHTML : bmHTML}</div>`);
  $('.sheet').onclick = e => { const tb = e.target.closest('[data-tab]'); if(tb){ openList(tb.dataset.tab); return }
    const d = e.target.closest('[data-del]'); if(d){ s.marks = s.marks.filter(m => String(m.at) !== d.dataset.del); saveState(b.id, true); openList('marks'); return }
    const li = e.target.closest('[data-t]'); if(li){ closeSheet(); seekTo(+li.dataset.t) } };
  const c = $('.li.cur'); if(c) c.scrollIntoView({block:'center'});
}
$('#tmark').onclick = () => { if(!cur) return; const t = gpos();
  sheet(`<h3>Bookmark at ${clock(t)}</h3><input type="text" id="bmnote" placeholder="A note (optional)" maxlength="120"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" onclick="closeSheet()">Cancel</button><button class="btn primary" style="flex:2" id="bmsave">Save bookmark</button></div>`);
  $('#bmsave').onclick = () => { st(cur.id).marks.push({t, note:$('#bmnote').value.trim(), at:Date.now()}); saveState(cur.id, true); closeSheet(); toast('Bookmark saved') } };

/* speed */
$('#tspeed').onclick = () => { if(!cur) return; const presets = [0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
  const draw = () => { const r = rate(); $('#spv').textContent = speedTxt(r); $('#spr').value = r; document.querySelectorAll('[data-sp]').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.sp - r) < 0.001)) };
  sheet(`<h3>Playback speed</h3><div class="speedv" id="spv"></div>
    <div style="display:flex;align-items:center;gap:10px;margin:8px 0"><button class="ib" id="spm" aria-label="Slower">−</button><input type="range" id="spr" min="0.5" max="3.5" step="0.05"><button class="ib" id="spp" aria-label="Faster">+</button></div>
    <div class="chips">${presets.map(p => `<button class="chip" data-sp="${p}">${speedTxt(p)}</button>`).join('')}</div>
    <div class="opt"><label for="spall">Use this speed for new books too</label><input type="checkbox" id="spall"></div>
    <p class="muted small" style="margin:6px 0 0">Every book remembers its own speed. Voices keep their normal pitch.</p>`);
  const setR = v => { v = Math.round(Math.max(0.5, Math.min(3.5, v)) * 100) / 100; st(cur.id).speed = v; if($('#spall').checked){ S.speed = v; saveS() } au.playbackRate = v; saveState(cur.id); draw(); drawPlayer(); syncMedia() };
  $('#spr').oninput = e => setR(+e.target.value); $('#spm').onclick = () => setR(rate() - 0.05); $('#spp').onclick = () => setR(rate() + 0.05);
  $('#spall').onchange = e => { if(e.target.checked){ S.speed = rate(); saveS() } };
  $('.sheet .chips').onclick = e => { const b = e.target.closest('[data-sp]'); if(b) setR(+b.dataset.sp) };
  draw() };

/* sleep timer: counts down while playing; the last 10 seconds fade out */
let sleep = null, sleepIv = 0;
function drawSleep(){ const b = $('#tsleep'); b.classList.toggle('on', !!sleep); $('#sleeplbl').textContent = !sleep ? 'Sleep' : sleep.chapter != null ? 'End of chapter' : clock(sleep.left) }
function sleepTick(){ clearInterval(sleepIv); if(!sleep || sleep.chapter != null) return;

/* read title, author, length, chapters and cover from the files again (e.g. after a fix) */
async function rereadBook(b){
  sheet('<h3>Reading the book info…</h3><div class="prog"><i id="rr"></i></div>', true);
  try{ const items = [];
    for(let i = 0; i < b.parts.length; i++){ const p = b.parts[i];
      const f = p.uri ? new LinkFile({uri:p.uri, name:p.name, size:p.size, type:p.type}) : await dbGet('files', p.fid).then(r => !r || !r.blob ? null : r.blob instanceof File ? r.blob : new File([r.blob], p.name, {type:p.type}));
      if(!f) throw new Error('part ' + (i + 1) + ' is missing');
      items.push({p, info:await fileInfo(f)}); $('#rr').style.width = (100 * (i + 1) / b.parts.length) + '%' }
    const t = items[0].info.tags; let t0 = 0; const chapters = [];
    for(const it of items){ const d = it.info.dur || it.p.dur || 0; it.p.dur = d;
      if(it.info.chapters.length) for(const c of it.info.chapters) chapters.push({t:t0 + c.t, title:c.title || `Chapter ${chapters.length + 1}`});
      else if(items.length > 1) chapters.push({t:t0, title:it.p.title}); t0 += d }
    b.chapters = chapters; b.dur = t0;
    if(t.album || t.title) b.title = (items.length > 1 ? t.album : t.album || t.title) || b.title;
    b.author = t.albumartist || t.artist || b.author; if(t.narrator || t.composer) b.narrator = t.narrator || t.composer;
    const cover = items.map(i => i.info.tags.cover).find(Boolean); if(cover){ await dbPut('covers', {id:b.id, blob:cover}); b.hasCover = true; if(COVERURL[b.id]){ URL.revokeObjectURL(COVERURL[b.id]); delete COVERURL[b.id] } }
    await dbPut('books', b); closeSheet(); $('#mini').dataset.id = ''; artKey = null; if(cur && cur.id === b.id){ curPart = -1; drawPlayer(true) } drawLib();
    toast(`${b.title}: ${hm(b.dur)}, ${b.chapters.length} chapters`, 4000)
  }catch(e){ closeSheet(); toast('Could not read the book: ' + (e.message || e), 5000) } }

/* =====================================================================================================================
   NIGHTVAULT MUSIC (?mode=music) – same file, same <audio>, own library. Plan: plans/music.md (nightvault-src).
   tracks : {id, key, title, artist, aa (album artist), album, al (album key), track, disc, year, genre, dur, name, type, size,
             uri + tree (in a phone folder, not copied) | fid (copied into 'files'), dir, added}
   mstats : {id: track key, fav, favAt, plays:[time], last}     ← kept per stable key, ready for the later phone–PC sync
   lists  : {id, name, items:[track key], created, updated}
   ===================================================================================================================== */
const MS = Object.assign({tab:'albums', alsort:'artist', sgsort:'title', q:''}, lsGet('nvMusic.settings', {}));
const saveMS = () => lsSet('nvMusic.settings', MS);
const PLAY_RE = /\.(mp3|m4a|mp4|aac|ogg|oga|opus|flac|wav|webm)$/i;
const NOPLAY_RE = /\.(wma|ape|wv|aif|aiff|aifc|dsf|dff|mpc|tta|alac)$/i;
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/^the\s+/, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const trKey = t => [norm(t.artist || t.aa), norm(t.album), t.disc || 0, t.track || 0, norm(t.title)].join('|');
const shuffled = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const IC_HEART = on => `<svg viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.6 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.6 0 5.8 3.6 4.5 7.1-1.8 4.8-9.3 9.4-9.3 9.4z"/></svg>`;
const IC_REP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>';
const IC_DOTS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

let TR = [], TRID = {}, KEYTR = {}, STATS = {}, LISTS = [], ALB = [], ALBK = {}, ARTS = [], ARTK = {}, ALCOV = new Set(), ALURL = {};
let MV = [{v:'home'}], CTX = [], CTXN = 300;

/* ---------- library ---------- */
async function musicLoad(){
  TR = await dbAll('tracks');
  if(lsGet('nvMusic.v', 1) < 2 && TR.length) await musicMigrate2(); STATS = {}; for(const s of await dbAll('mstats')) STATS[s.id] = s;
  LISTS = await dbAll('lists'); const ck = (await dbKeys('covers')).map(String); ALCOV = new Set(ck.filter(k => k.startsWith('al:')).map(k => k.slice(3))); CDCOV = new Set(ck.filter(k => k.startsWith('cd:')));
  musicIndex() }
/* v2: "Album (CD1)" and "Album (CD2)" become one album with discs; stats, playlists and covers move to the new keys */
async function musicMigrate2(){
  const keyMap = {}, alMap = {}, changed = [];
  for(const t of TR){ const k = t.key, al = t.al; fixAlbum(t); if(t.key !== k) keyMap[k] = t.key; if(t.al !== al){ if(!alMap[al]) alMap[al] = t.al } if(t.key !== k || t.al !== al || !t.adir) changed.push(t) }
  if(changed.length) await dbPutMany('tracks', changed);
  const stats = await dbAll('mstats'), moved = [], dropped = [];
  for(const s of stats){ const nk = keyMap[s.id]; if(!nk) continue; const o = stats.find(x => x.id === nk) || moved.find(x => x.id === nk);
    if(o){ o.plays = (o.plays || []).concat(s.plays || []); o.fav = o.fav || s.fav; o.last = Math.max(o.last || 0, s.last || 0); if(!moved.includes(o)) moved.push(o) } else moved.push(Object.assign({}, s, {id:nk})); dropped.push(s.id) }
  if(moved.length) await dbPutMany('mstats', moved); if(dropped.length) await dbDelMany('mstats', dropped);
  const lists = await dbAll('lists'); for(const l of lists) l.items = [...new Set(l.items.map(k => keyMap[k] || k))]; if(lists.length) await dbPutMany('lists', lists);
  const have = new Set((await dbKeys('covers')).map(String));
  for(const [o, n] of Object.entries(alMap)){ if(have.has('al:' + o) && !have.has('al:' + n)){ const c = await dbGet('covers', 'al:' + o); if(c){ await dbPut('covers', {id:'al:' + n, blob:c.blob}); have.add('al:' + n) } } if(have.has('al:' + o) && o !== n) await dbDel('covers', 'al:' + o).catch(() => {}) }
  lsSet('nvMusic.v', 2); L('music', `library updated: ${changed.length} songs, ${Object.keys(alMap).length} albums joined or renamed`) }
function musicIndex(){
  TRID = {}; KEYTR = {}; ALBK = {}; ARTK = {};
  for(const t of TR){ TRID[t.id] = t; if(!KEYTR[t.key]) KEYTR[t.key] = t;
    const a = ALBK[t.al] || (ALBK[t.al] = {key:t.al, title:t.album || 'Unknown album', tracks:[], artists:new Set(), aa:'', year:'', dur:0, added:0});
    a.tracks.push(t); a.artists.add(t.artist || t.aa); if(t.aaTag) a.aa = t.aa; if(t.year && !a.year) a.year = t.year; a.dur += t.dur || 0; a.added = Math.max(a.added, t.added || 0) }
  ALB = Object.values(ALBK);
  for(const a of ALB){ if(!a.aa) a.aa = a.artists.size === 1 ? [...a.artists][0] || 'Unknown artist' : 'Various artists';
    a.tracks.sort((x, y) => ((x.disc || 0) - (y.disc || 0)) || ((x.track || 0) - (y.track || 0)) || coll.compare(x.name, y.name));
    const k = norm(a.aa) || 'unknown'; const ar = ARTK[k] || (ARTK[k] = {key:k, name:a.aa, albums:[], n:0}); ar.albums.push(a); ar.n += a.tracks.length }
  ARTS = Object.values(ARTK).sort((x, y) => coll.compare(x.key, y.key)) }
const albumOf = t => ALBK[t.al];
const stat = key => STATS[key] || (STATS[key] = {id:key, fav:false, plays:[], last:0});
const isFav = t => !!(t && STATS[t.key] && STATS[t.key].fav);
async function toggleFav(t){ if(!t) return; const s = stat(t.key); s.fav = !s.fav; s.favAt = Date.now(); await dbPut('mstats', s).catch(() => {}); toast(s.fav ? 'Added to Favourites' : 'Removed from Favourites'); drawMP(); if(MV[MV.length - 1].v === 'list') drawM() }
function countPlay(t){ if(!t) return; const s = stat(t.key); s.plays.push(Date.now()); s.last = Date.now(); dbPut('mstats', s).catch(() => {}) }
const plays = t => (STATS[t.key] && STATS[t.key].plays.length) || 0;

/* album covers: one picture per album, loaded when it scrolls into view */
async function alUrl(al){ if(ALURL[al]) return ALURL[al]; if(!ALCOV.has(al)) return null;
  const c = await dbGet('covers', 'al:' + al).catch(() => null); return c && c.blob ? (ALURL[al] = URL.createObjectURL(c.blob)) : null }
function alCover(a, cls){ const h = hue(a.title + a.aa), u = ALURL[a.key];
  return `<div class="cv ${cls || ''}" ${!u && ALCOV.has(a.key) ? `data-alc="${esc(a.key)}"` : ''}>${u ? `<img src="${u}" alt="">` : `<div class="ph" style="--c1:hsl(${h} 45% 30%);--c2:hsl(${(h + 50) % 360} 50% 15%)">${esc(a.title)}<span>${esc(a.aa)}</span></div>`}</div>` }
const covIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => { for(const e of es) if(e.isIntersecting){ covIO.unobserve(e.target); fillCover(e.target) } }, {rootMargin:'400px'}) : null;
async function fillCover(el){ const u = await alUrl(el.dataset.alc); if(u){ el.innerHTML = `<img src="${u}" alt="">`; el.removeAttribute('data-alc') } }
function lazyCovers(root){ root.querySelectorAll('[data-alc]').forEach(el => covIO ? covIO.observe(el) : fillCover(el)) }

/* read the tags of every new song (4 at a time), save in batches; a re-scan of a folder also drops songs that are gone */
let SCAN = null;
async function musicScan(items, folder){

  if(folder) dbPut('kv', {id:'pics:' + folder.tree, at:Date.now(), pics:Object.fromEntries(Object.entries(pics).map(([d, ps]) => [d, ps.map(p => ({uri:p.uri, name:p.name, size:p.size}))]))}).catch(() => {});
  const have = new Set(TR.filter(t => t.uri).map(t => t.uri));
  const copied = new Set(TR.filter(t => t.fid).map(t => t.name + '|' + t.size)), fresh = folder ? audio.filter(x => !have.has(x.f.uri)) : audio.filter(x => !copied.has(x.f.name + '|' + x.f.size));

  if(!fresh.length){ if(folder) scanDone(folder); musicIndex(); const nc = await folderCovers(pics); closeSheet(); drawM();
    toast(audio.length || removed ? `No new songs${nc ? ` · ${plural(nc, 'cover')} from the folder` : ''}${removed ? ` · ${plural(removed, 'song')} that are gone were removed` : ''}${bad ? ` · ${bad} can't play on a phone` : ''}` : bad ? `${bad} songs found, but this phone can't play their format (WMA, APE …)` : 'No songs found there', 5000); return }
  if(!folder){ const total = fresh.reduce((a, x) => a + x.f.size, 0);
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist() }catch(e){}
    try{ const e = await navigator.storage.estimate(); if(e && e.quota && e.quota - e.usage < total * 1.05){ toast(`Not enough space: ${mb(total)} needed, ${mb(e.quota - e.usage)} free`, 5000); return } }catch(e){} }
  SCAN = {stop:false}; const me = SCAN; awake(true);
  sheet(`<h3>${folder ? 'Reading your songs…' : 'Copying songs into the app…'}</h3><div class="prog"><i id="msp"></i></div><div class="muted small" id="mst" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">0 of ${fresh.length} · starting…</div>

  $('#mstop').onclick = () => { me.stop = true; $('#mstop').disabled = true; $('#mstop').textContent = 'Stopping…' };
  let done = 0, batch = [], added = 0, failed = 0, i = 0; const now = Date.now();
  const flush = async () => { if(!batch.length) return; const b = batch; batch = []; await dbPutMany('tracks', b); TR.push(...b); added += b.length };
  const onHide = () => { L('scan', document.hidden ? `app went to the background at ${done} of ${fresh.length}` : `app back at ${done} of ${fresh.length}`); if(document.hidden) flush().catch(() => {}) }; document.addEventListener('visibilitychange', onHide);
  L('scan', `start: ${fresh.length} new songs (${audio.length} in the folder, ${bad} can't play)`, {folder:folder && folder.name, resume:!!lsGet('nvMusic.scan', null)});
  const work = async () => { while(i < fresh.length && !me.stop){ const x = fresh[i++];
      try{ const info = await fileInfo(x.f, true), t = makeTrack(x, info, folder, now);
        if(!folder){ t.fid = uid(); await dbPut('files', {id:t.fid, blob:x.f}) }
        if(info.tags.cover && !ALCOV.has(t.al)){ ALCOV.add(t.al); await dbPut('covers', {id:'al:' + t.al, blob:info.tags.cover}) }

      const p = $('#msp'), s = $('#mst'); if(p) p.style.width = (100 * done / fresh.length) + '%'; if(s) s.textContent = `${done} of ${fresh.length} · ${x.f.name}` } };
  await Promise.all([work(), work(), work(), work()]); await flush(); document.removeEventListener('visibilitychange', onHide);
  /* album covers from the folder: front / cover / folder.jpg (also in a Covers / Scans / Artwork subfolder) win over the picture in the

  musicIndex(); const nc = await folderCovers(pics);

  toast(`${plural(added, 'song')} added${nc ? ` · ${plural(nc, 'cover')} from the folders` : ''}${removed ? ` · ${removed} gone` : ''}${failed ? ` · ${failed} could not be read` : ''}${bad ? ` · ${bad} can't play on a phone (WMA, APE …)` : ''}${folder && folder.capped ? ' · folder has over 20,000 files: pick a smaller one' : ''}`, 6000) }

const ART_DIR = /^(covers?|scans?|artwork|art|images?|pictures?|pics?)$/i, COVER_BAD = /\b(back(?:cover)?|cd|disc|disk|inlay|tray|inside|booklet|label|matrix|spine|obi|small)(?![a-z])/i;

async function folderCovers(pics){
  const chosen = new Set(lsGet('nvMusic.chosen', [])), fc = new Set(lsGet('nvMusic.fcov', [])); let n = 0;

    const top = [a.tracks[0].adir || ''], cds = [...new Set(a.tracks.map(t => t.dir || ''))];
    let best = null, br = 0;
    for(const [dirs, bonus] of [[top, 1], [top.flatMap(subs), 3], [cds, 0], [cds.flatMap(subs), 2]]) for(const d of dirs) for(const p of pics[d] || []){ const r = coverRank(p.name); if(r && r * 2 + bonus > br){ br = r * 2 + bonus; best = p } }
    if(!best || (br < 4 && ALCOV.has(a.key))) continue;   // a plain picture next to the songs (not in a Covers folder): keep the one from the songs
    L('cover', `${a.title}: ${best.name} (score ${br})`);
    try{ const b = best.uri ? await best.blob() : best; await dbPut('covers', {id:'al:' + a.key, blob:b}); ALCOV.add(a.key); fc.add(a.key); n++;

/* "Change the cover picture": the pictures in this album's folders first (album folder, CD folders, Covers / Scans …), tap one */
async function coverPicker(a){
  const trees = [...new Set(a.tracks.map(t => t.tree).filter(Boolean))]; let all = {};

  const top = [...new Set(a.tracks.map(t => t.adir || ''))], cds = [...new Set(a.tracks.map(t => t.dir || ''))].filter(d => !top.includes(d));

/* covers online: MusicBrainz finds the album, the Cover Art Archive has the front picture (both free, no account) */
/* fetch from another website; inside the Android app fall back to Android's own connection (CapacitorHttp) if the web view blocks it */
async function webGet(url, kind){
  try{ const r = await fetch(url, kind === 'json' ? {headers:{Accept:'application/json'}} : {}); if(r.status === 404) throw Object.assign(new Error('not found'), {nf:true});
    if(!r.ok) throw new Error('answered ' + r.status); return kind === 'json' ? r.json() : r.blob() }
  catch(e){ const H = NATIVE && Capacitor.Plugins && Capacitor.Plugins.CapacitorHttp; if(e.nf || !H) throw e; LE('web', 'fetch failed, trying Android: ' + url, e);
    const r = await H.get({url, headers:kind === 'json' ? {Accept:'application/json'} : {}, responseType:kind === 'json' ? 'json' : 'blob'});
    if(r.status === 404) throw new Error('not found'); if(r.status >= 400) throw new Error('answered ' + r.status);
    if(kind === 'json') return typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
    const bin = atob(String(r.data).replace(/^data:[^,]*,/, '')), u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type:'image/jpeg'}) } }
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX', 'XXI', 'XXII', 'XXIII', 'XXIV', 'XXV', 'XXVI', 'XXVII', 'XXVIII', 'XXIX', 'XXX'];
const toRoman = s => s.replace(/\b0*(\d{1,2})\b/g, (m, n) => ROMAN[+n] || m);
const fromRoman = s => s.replace(/\b([IVX]{1,6})\b/g, (m, r) => { const i = ROMAN.indexOf(r.toUpperCase()); return i > 0 ? String(i) : m });
const titleKey = s => norm(fromRoman(String(s || '').toUpperCase() === String(s || '') ? s : s.replace(/\b[ivx]+\b/gi, x => x.toUpperCase()))).replace(/\b0+(\d)/g, '$1');
const NET_MSG = 'Could not reach the cover website (MusicBrainz). Some Wi-Fi networks, like at work, block it - try mobile data or your home Wi-Fi.';
/* MusicBrainz: the exact name first, then loose words, then with 06 ↔ VI; up to 15 different albums */
async function mbFind(a){ const ar = a.aa.replace(/["\\]/g, ''), various = /^various/i.test(ar) || /unknown/i.test(ar);
  const words = x => x.replace(/[^\p{L}\p{N}' ]+/gu, ' ').replace(/\s+/g, ' ').trim(), art = various ? '' : ` AND artist:(${words(ar)})`;
  const tries = [`release:"${a.title.replace(/["\\]/g, '')}"` + (various ? '' : ` AND artist:"${ar}"`), `release:(${words(a.title)})` + art, `release:(${words(toRoman(a.title))})` + art, `release:(${words(fromRoman(a.title))})` + art];
  const seen = new Set(), out = [], qs = [...new Set(tries)]; let fails = 0, lastErr = null;
  for(const q of qs){ if(out.length >= 8) break;
    try{ for(const x of (await webGet('https://musicbrainz.org/ws/2/release/?fmt=json&limit=12&query=' + encodeURIComponent(q), 'json')).releases || []) if(!seen.has(x.id)){ seen.add(x.id); out.push(x) } }catch(e){ fails++; lastErr = e; LE('cover', 'MusicBrainz: ' + q, e) }
    L('cover', `MusicBrainz “${q}”: ${out.length} so far`); await new Promise(r => setTimeout(r, 1000)) }
  if(!out.length && fails) throw Object.assign(new Error('blocked'), {net:true, cause:lastErr});
  const want = titleKey(a.title); return out.sort((x, y) => (titleKey(y.title) === want) - (titleKey(x.title) === want)).slice(0, 15) }
async function caaBlob(id){ return webGet(`https://coverartarchive.org/release/${id}/front-500`, 'blob') }
async function saveCover(a, blob){ await dbPut('covers', {id:'al:' + a.key, blob}); ALCOV.add(a.key); markChosen(a.key); if(ALURL[a.key]){ URL.revokeObjectURL(ALURL[a.key]); delete ALURL[a.key] } mArtKey = null }
async function coverOnline(a){

  let rel; try{ rel = await mbFind(a) }catch(e){ LE('cover', 'online search failed', e); closeSheet(); toast(NET_MSG, 7000); return }
  if(!rel.length){ closeSheet(); toast('Nothing found online for this album', 4000); return }
  sheet(`<h3>Pick the cover</h3><p class="muted small" style="margin:0 0 8px">From MusicBrainz / Cover Art Archive. Albums without a picture there are hidden.</p><div class="grid" id="cogrid">${rel.map(x => `<div class="bk" data-rel="${x.id}"><div class="cv"><img src="https://coverartarchive.org/release/${x.id}/front-250" alt="" loading="lazy" onerror="this.closest('.bk').remove()"></div><div class="t">${esc(x.title)}</div><div class="a">${esc(((x['artist-credit'] || [])[0] || {}).name || '')}${x.date ? ' · ' + esc(x.date.slice(0, 4)) : ''}${x.country ? ' · ' + esc(x.country) : ''}</div></div>`).join('')}</div>

    try{ await saveCover(a, await caaBlob(b.dataset.rel)); closeSheet(); drawM(); drawMP(true); syncMM(); toast('New cover saved') }catch(err){ LE('cover', 'download failed', err); toast('Could not get that picture: ' + (err.message || err), 5000) } } }
/* all albums without a cover: only when MusicBrainz has an album with exactly that name (and artist) */
async function coversOnlineAll(){

  const me = {stop:false}; let i = 0, got = 0;
  sheet(`<h3>Finding covers online…</h3><div class="prog"><i id="cop"></i></div><div class="muted small" id="cot" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">0 of ${todo.length}</div><p class="muted small">A few seconds per album (MusicBrainz asks to go slowly). Only albums with exactly the same name get a cover - pick the others by hand (album ⋯ → Find a cover online).</p><button class="btn" id="costop" style="width:100%">Stop</button>`, true);

/* a song record from the tags; missing tags come from the path: Artist / Album / [CD 1 /] 01 - Title.ext */
function makeTrack(x, info, folder, now){
  const t = info.tags, dirs = x.path.split('/'); dirs.pop(); const dir = dirs.join('/'); let disc = t.disc || 0;
  if(dirs.length && DISC_RE.test(dirs[dirs.length - 1])){ if(!disc) disc = parseInt(dirs[dirs.length - 1].replace(/\D+/g, '')) || 0; dirs.pop() }
  const adir = (folder ? folder.tree + '|' : '') + dirs.join('/');   // the album's folder (above CD1 / CD2)
  const base = cleanName(x.f.name), m = base.match(/^(\d{1,3})(?:[\s.\-_)]+)(.+)$/); let ftitle = m ? m[2] : base, fartist = '';
  const dash = ftitle.match(/^(.+?)\s+-\s+(.+)$/); if(dash && !t.title){ fartist = dash[1]; ftitle = dash[2] }
  const album = t.album || dirs[dirs.length - 1] || '', artist = t.artist || fartist || (dirs.length >= 2 ? dirs[dirs.length - 2] : '') || t.albumartist || '';

  else { const rec = await dbGet('files', t.fid).catch(() => null); if(tok !== mTok) return false;
    if(!rec || !rec.blob){ toast(`“${t.title}” is missing - add it again`); return mSkipBad(play) }
    mUrl = URL.createObjectURL(rec.blob.type ? rec.blob : new Blob([rec.blob], {type:t.type})); au.src = mUrl }

{ let sx = 0, sy = 0; const c = $('#mpcover'); c.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY }, {passive:true});

    ${NvFiles ? '<h3 style="margin:4px 0">Music folders on this phone</h3><div id="mfldrs" class="muted small">…</div><button class="btn" id="mfadd" style="width:100%;margin-top:8px">Add a folder</button>' : ''}
    ${window.NVLOG ? `<div class="opt" style="margin-top:8px"><label for="mdbg">Debug mode<div class="muted small">Writes down everything that happens, with a bug button to send the log to Claude.</div></label><input type="checkbox" id="mdbg" ${NVLOG.on ? 'checked' : ''}></div>` : ''}
    <button class="btn" id="mcovall" style="width:100%;margin-top:10px">Find missing covers online (${ALB.filter(a => !ALCOV.has(a.key)).length})</button>
    <p class="muted small" style="margin:12px 0 0">${plural(TR.length, 'song')} · ${plural(ALB.length, 'album')} · ${plural(ARTS.length, 'artist')}. Favourites, play counts and playlists are kept on this device (later also synced with the PC).</p>`);
  if($('#mdbg')) $('#mdbg').onchange = e => { e.target.checked ? NVLOG.enable() : NVLOG.disable() };
  $('#mcovall').onclick = () => coversOnlineAll();
  if(NvFiles){ $('#mfadd').onclick = () => { closeSheet(); musicFolder() }; drawMFolders() } };
async function drawMFolders(){ const el = $('#mfldrs'); if(!el) return; let fl = lsGet('nvMusic.folders', []);
  try{ const ok = new Set(((await NvFiles.folders()).folders || []).map(x => x.tree)); fl = fl.filter(x => ok.has(x.tree)); lsSet('nvMusic.folders', fl) }catch(e){}
  el.innerHTML = fl.length ? fl.map((f, i) => `<div class="li" style="cursor:default"><div class="n"><div>${esc(f.name)}</div><div class="s">${plural(TR.filter(t => t.tree === f.tree).length, 'song')}</div></div><button class="btn sm" data-scan="${i}">Look for changes</button><button class="x" data-forget="${i}" aria-label="Forget this folder">✕</button></div>`).join('') : 'No folders yet.';
  el.onclick = async e => { const s = e.target.closest('[data-scan]'), g = e.target.closest('[data-forget]');
    if(s){ closeSheet(); musicFolder(fl[+s.dataset.scan]) }
    if(g){ const f = fl[+g.dataset.forget], gone = TR.filter(t => t.tree === f.tree);
      sheet(`<h3>Forget “${esc(f.name)}”?</h3><p class="muted small">Its ${plural(gone.length, 'song')} leave the library. The files stay on the phone, and favourites and play counts are kept for when you add the folder again.</p><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="closeSheet()">Keep it</button><button class="btn primary" style="flex:1;background:#7a2a2f;border-color:#a3454b" id="mfg">Forget</button></div>`);
      $('#mfg').onclick = async () => { const ids = new Set(gone.map(t => t.id)); if(curT() && ids.has(curT().id)){ au.pause(); au.removeAttribute('src'); au.load(); mLoadedId = null }
        await dbDelMany('tracks', [...ids]); TR = TR.filter(t => !ids.has(t.id)); Q.list = Q.list.filter(id => !ids.has(id)); Q.orig = Q.orig.filter(id => !ids.has(id)); Q.pos = Math.min(Q.pos, Math.max(0, Q.list.length - 1)); saveQ();
        await NvFiles.forget({tree:f.tree}).catch(() => {}); lsSet('nvMusic.folders', lsGet('nvMusic.folders', []).filter(x => x.tree !== f.tree)); musicIndex(); MV = [{v:'home'}]; closeSheet(); drawM(); toast('Folder forgotten') } } } }

async function musicStart(){
  await musicLoad();
  const sc = lsGet('nvMusic.scan', null);
  if(sc && NvFiles && Date.now() - sc.at < 7 * 864e5) setTimeout(() => { L('scan', 'adding was interrupted - offering to continue', sc); const n = TR.filter(t => t.tree === sc.tree).length;
    sheet(`<h3>Adding music was interrupted</h3><p class="muted small">Adding the folder “${esc(sc.name)}” stopped before it was done - probably the phone went to sleep or the app was closed. ${n ? plural(n, 'song') + ' from it are already in your library.' : ''} Continue where it stopped? Songs that are already in are skipped.</p>
      <div style="display:flex;gap:8px"><button class="btn" style="flex:1" id="scno">Not now</button><button class="btn primary" style="flex:2" id="scgo">Continue</button></div>`, true);
    $('#scno').onclick = () => { scanDone(sc); closeSheet() }; $('#scgo').onclick = () => { closeSheet(); musicFolder({tree:sc.tree, name:sc.name}, true) } }, 300);
  Q.list = (Q.list || []).filter(id => TRID[id]); Q.orig = (Q.orig || []).filter(id => TRID[id]); if(Q.pos >= Q.list.length) Q.pos = 0;
  drawM() }

/* ---------- start ---------- */
(async () => {
  if(MODE === 'music'){ document.title = 'Nightvault Music'; $('#lib').hidden = true; $('#mlib').hidden = false;
    try{ await openDB() }catch(e){ $('#mbody').innerHTML = `<div class="empty"><p>The app's storage cannot be opened here (${esc(e && e.message || e)}). In a private window, music cannot be kept.</p></div>`; return }
    await musicStart(); return }
  try{ await openDB(); await loadLib() }catch(e){ $('#libbody').innerHTML = `<div class="empty"><p>The app's storage cannot be opened here (${esc(e && e.message || e)}). In a private window, audiobooks cannot be kept.</p></div>`; return }
  await drawLib();
  const lastId = lsGet('nvAudio.last', null); if(lastId && BOOKS.find(b => b.id === lastId) && !(STATE[lastId] || {}).finished){ const b = BOOKS.find(x => x.id === lastId); cur = b; curPart = -1; drawMini(); drawLib() }
})();
window.NVAUDIO = {get cur(){ return cur }, get books(){ return BOOKS }, state:st, gpos, seekTo, openBook, togglePlay, mp4Info, mp3Info, flacInfo, oggInfo, wavInfo, fileInfo, review, au,
  music:{get Q(){ return Q }, get tracks(){ return TR }, get albums(){ return ALB }, get artists(){ return ARTS }, get lists(){ return LISTS }, get stats(){ return STATS }, curT, playList, qAdd, mNext, mPrev, mPlay, mSeek, toggleShuffle, cycleRepeat, toggleFav, musicScan, makeTrack, drawM, mGo, musicBack}};
