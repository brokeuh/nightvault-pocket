<style>
:root,[data-theme="midnight"]{--bg:#0f1115;--side:#13161c;--card:#14171d;--line:#23283a;--line2:#2a303c;--text:#e7eaf0;--mut:#9aa3b2;--dim:#6d7686;--accent:#6ea8ff;--accentbg:#1b2740;--accentline:#2f4a7d;--green:#5fcf9a;--greenbg:#10261c;--amber:#e0a85a;--amberbg:#2c200f;--red:#ff7b72;--sub:#1a1e27;--ctl:#171a21;--ctlh:#1b1f28;--lineh:#3a4150;--pan:#242934;--modal:#14181f;--track:#232a38;--chipbg:#1c2230;--logbg:#0b0d11;--logfg:#c3cad6;--onacc:#0b1220;--pg:#8fe6bd;--pa:#f2c27a;--pb:#a8cbff;--pgr:#aab3c2;color-scheme:dark}

[data-theme="ocean"]{--bg:#0b1318;--side:#0f181e;--card:#101a21;--line:#1f3039;--line2:#27404b;--text:#e3eef2;--mut:#93aab4;--dim:#65808c;--accent:#4cc9d9;--accentbg:#0f2a32;--accentline:#1f5a68;--green:#5fcf9a;--greenbg:#10261c;--amber:#e0b25a;--amberbg:#2a2110;--red:#ff7f78;--sub:#15232b;--ctl:#121e26;--ctlh:#182730;--lineh:#36505c;--pan:#1f3039;--modal:#0f181e;--track:#1f323c;--chipbg:#12282f;--logbg:#080e12;--logfg:#bcd0d8;--onacc:#04161a;--pg:#8fe6bd;--pa:#f2c27a;--pb:#a6e8f0;--pgr:#a5bac3;color-scheme:dark}
[data-theme="graphite"]{--bg:#000000;--side:#0a0a0a;--card:#0d0d0d;--line:#1f1f1f;--line2:#2a2a2a;--text:#ececec;--mut:#9a9a9a;--dim:#6c6c6c;--accent:#e8e8e8;--accentbg:#1d1d1d;--accentline:#444444;--green:#5fcf9a;--greenbg:#10261c;--amber:#e0a85a;--amberbg:#2c200f;--red:#ff7b72;--sub:#151515;--ctl:#111111;--ctlh:#181818;--lineh:#3a3a3a;--pan:#1f1f1f;--modal:#0d0d0d;--track:#222222;--chipbg:#1a1a1a;--logbg:#050505;--logfg:#c8c8c8;--onacc:#111111;--pg:#8fe6bd;--pa:#f2c27a;--pb:#cfcfcf;--pgr:#aaaaaa;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:210px minmax(0,1fr);height:100vh}
#side{background:var(--side);border-right:1px solid var(--line);padding:16px 10px;overflow-y:auto}
.sideupdw{position:sticky;bottom:0;background:var(--side);padding:6px 0 4px;z-index:2;box-shadow:0 -8px 8px -6px rgba(0,0,0,.35)}
body.has-player .sideupdw{bottom:-76px}
#main{overflow-y:auto;padding:22px 28px 60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;padding:2px 10px 14px}
.logo i{color:var(--accent);font-size:20px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--mut);font-size:13.5px;cursor:pointer}
.nav i{font-size:17px}
.nav:hover{background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--text)}
.nav.on{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
.nav .n{margin-left:auto;font-size:11.5px;color:var(--dim)}
.sec{font-size:11px;color:var(--dim);padding:14px 10px 4px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;border-radius:6px}
.sec:hover{color:var(--text,#e8ecf3)}.sec.here{color:var(--accent)}.sec.here::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:auto}.sec .chev{font-size:12px;transition:transform .15s}.sec.shut .chev{transform:rotate(-90deg)}
.sec.dropbefore,.nav.dropbefore{box-shadow:0 -2px 0 var(--accent)}.sec.dropinto{outline:1px dashed var(--accent)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.photos .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line2);cursor:zoom-in}
.photos .ph.add{display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;border-style:dashed;font-size:20px}
.sgcard{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--sub)}.sgcard img{width:70px;height:70px;object-fit:cover;border-radius:8px}
.sgimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.sgimgs label{font-size:11px;color:var(--mut);display:block}.sgimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
h1{margin:0;font-size:22px;font-weight:600}
h2{margin:26px 0 10px;font-size:15px;font-weight:600}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sub{color:var(--dim);font-size:13px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--ctl);color:var(--text);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--lineh);background:var(--ctlh)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:600}
.btn.primary:hover{background:#86b8ff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
input[type=text],input[type=search],input[type=password],input:not([type]),select,textarea{background:var(--ctl);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accentline)}
select{width:auto;padding-right:26px}
textarea{resize:vertical;min-height:70px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bar .grow{flex:1;min-width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);font-size:12.5px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--lineh)}
.chip.on{background:var(--accentbg);border-color:var(--accentline);color:var(--pb)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.f-physical{background:var(--amber)}.f-digital{background:var(--accent)}.f-both{background:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:18px 14px}
.card{display:block}
.poster{aspect-ratio:2/3;border-radius:9px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid #ffffff10}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card:hover .poster{border-color:#ffffff30}
.ptitle{font-weight:600;font-size:15px;line-height:1.25;text-align:center;color:#ffffffd9;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;word-break:break-word}
.pic{position:absolute;top:8px;left:9px;font-size:16px;color:#ffffff66}
.newb{position:absolute;top:8px;left:8px;z-index:3;background:#ff2d55;color:#fff;font-size:12px;font-weight:900;letter-spacing:.04em;padding:3px 9px;border-radius:999px;box-shadow:0 0 0 2px #0b0e13,0 0 14px #ff2d55aa;animation:newp 1.8s ease-in-out infinite;pointer-events:none}
@keyframes newp{50%{box-shadow:0 0 0 2px #0b0e13,0 0 22px #ff2d55}}
.miss{position:absolute;top:8px;right:8px;background:#3a2412;color:#ffb877;font-size:11px;padding:2px 8px;border-radius:999px}
.fmt{position:absolute;bottom:9px;left:9px;display:flex;gap:4px;align-items:center;font-size:11px;color:#ffffffb0;background:#0008;padding:2px 8px 2px 6px;border-radius:999px}
.ct{margin-top:7px;font-weight:600;font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cs{font-size:12px;color:var(--dim);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.av{width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--onacc)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:44px 20px;text-align:center;color:var(--mut);margin-top:30px}
.empty .btn{margin:14px 5px 0}
.pdlg{position:fixed;inset:0;background:rgba(5,8,14,.7);z-index:99999;display:flex;align-items:center;justify-content:center}.pdlg .box{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:20px 22px;width:min(440px,92vw)}
.pdlg label{display:flex;gap:8px;align-items:center;margin:10px 0}.pdlg input[type=number]{width:70px}
.tdsteps{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}.tdsteps span{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line2);border-radius:999px;font-size:13px;color:var(--mut)}
.tdsteps span b{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--sub);align-items:center;justify-content:center;font-size:11px}
.tdsteps span.on{color:var(--text,#e8ecf3);border-color:var(--accent)}.tdsteps span.on b,.tdsteps span.done b{background:var(--accent);color:var(--onacc)}
.badge2{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);padding:1px 8px;border-radius:999px;min-width:64px;text-align:center}
.tdgrp{border:1px solid var(--pan);border-radius:9px;margin-bottom:8px;padding:6px 10px}.tdgrp summary{cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 0}
.tdfile{display:flex;gap:9px;padding:6px 0;border-top:1px solid var(--sub);font-size:12.5px;align-items:flex-start;word-break:break-all}.tdfile.skip,.tdfile.ok{opacity:.55}
.panel{background:var(--card);border:1px solid var(--pan);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.item-top{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.item-poster{width:190px;flex:none}
.item-info{flex:1;min-width:300px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 15px;color:var(--mut);cursor:pointer;font-size:13px}
.seg button.on{background:var(--greenbg);color:#8fe6bd}
.seg button.on.p{background:var(--amberbg);color:#f2c27a}
.seg button.on.d{background:var(--accentbg);color:var(--pb)}
.field{margin:14px 0}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.owners{display:flex;gap:6px;flex-wrap:wrap}
.own{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 5px;border-radius:999px;border:1px solid var(--line2);cursor:pointer;color:var(--mut);font-size:13px}
.own.on{border-color:var(--accentline);background:var(--accentbg);color:#cfe1ff}
.crumb{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;margin-bottom:14px;cursor:pointer;width:fit-content}
.crumb:hover{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
th.s{cursor:pointer}th.s:hover{color:var(--text)}
td{padding:8px 10px;border-bottom:1px solid var(--sub);color:var(--mut);vertical-align:middle}
td.t{color:var(--text)}
tr.mon td{background:#14171d;color:var(--dim);font-size:12px;letter-spacing:.04em;padding:10px;text-transform:uppercase}
tr.click{cursor:pointer}tr.click:hover td{background:#161a21}
.pill{font-size:11.5px;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.p-green{background:var(--greenbg);color:var(--pg)}.p-amber{background:var(--amberbg);color:var(--pa)}.p-blue{background:var(--accentbg);color:var(--pb)}.p-gray{background:var(--sub);color:var(--pgr)}
.miss-line{display:flex;gap:10px;padding:5px 0;color:#ffb877}
.miss-line b{font-weight:500;min-width:90px;color:#e0a46c}
.muted{color:var(--dim)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--sub)}
.row:last-child{border:0}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.cols2{grid-template-columns:1fr}}
#jobbar{position:fixed;right:18px;bottom:18px;background:#1a2030;border:1px solid var(--accentline);border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:12px;max-width:460px;z-index:30;box-shadow:0 8px 24px #0008}
#jobbar.on{display:flex}
#jobbar .tx{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.spin{width:14px;height:14px;border:2px solid var(--accentline);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center}
.t1{background:#1b2230;border:1px solid var(--accentline);padding:8px 16px;border-radius:10px;font-size:13px}
.t1.err{border-color:#7d3b37;background:#2a1716;color:#ffb3ad}
.mback{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.mbox{background:var(--modal);border:1px solid var(--line2);border-radius:14px;padding:22px;width:560px;max-width:100%;max-height:90vh;overflow-y:auto}
.mbox h3{margin:0 0 14px;font-size:17px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.cand{padding:9px 11px;border:1px solid var(--line2);border-radius:9px;margin-bottom:7px;cursor:pointer;display:flex;gap:10px;align-items:center}
.cand:hover{border-color:var(--accentline);background:#161b26}
.log{background:var(--logbg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12px/1.6 Consolas,monospace;color:var(--logfg);max-height:240px;overflow-y:auto;white-space:pre-wrap}
.swatch{width:34px;height:30px;padding:0;border:1px solid var(--line2);border-radius:8px;background:none}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#262c38;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
/* comic reader */
body.reading{overflow:hidden}
#reader{position:fixed;inset:0;background:#08090c;z-index:25;display:none;flex-direction:column}
#reader.on{display:flex}
.rbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#0e1015;border-bottom:1px solid var(--line);flex:none}
.rbar.bottom{border-top:1px solid var(--line);border-bottom:0}
#reader.nobars .rbar{display:none}
.rtitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#rview{flex:1;min-height:0;overflow:auto;position:relative}
#rview .pages{display:flex;justify-content:center;width:100%;min-height:100%}
#rview .pages.rtl{flex-direction:row-reverse}
#rview.f-h .pages{height:100%;align-items:center}
#rview.f-h img{max-height:100%;max-width:100%;object-fit:contain}
#rview.f-h.m-double img{max-width:50%}
#rview.f-w .pages{align-items:flex-start}
#rview.f-w img{width:100%;height:auto}
#rview.f-w.m-double img{width:50%}
#rview.f-o .pages{width:max-content;min-width:100%}
#rview.f-o img{max-width:none}
#rview img{display:block;user-select:none;-webkit-user-drag:none}
#rview.m-scroll .strip{max-width:920px;margin:0 auto}

function drawGrid(coll){
  if(!$('#count')) return;      // the page was left before this delayed redraw ran
  const all = filtered(coll), inLines = hasLines(coll) && !S.f.q.trim() ? all.filter(x => x.line).length : 0;
  const a = inLines ? all.filter(x => !x.line) : all, shown = a.slice(0, S.limit);
  $('#count').textContent = a.length.toLocaleString() + ' item' + (a.length===1?'':'s') + (inLines ? ` here \u00b7 ${inLines.toLocaleString()} in product lines` : '');
  if($('#lines')) drawLines(coll);
  if(!a.length){
    const none = !S.lib.length;
    $('#grid').innerHTML = ''; $('#more').innerHTML = '';
    $('#grid').insertAdjacentHTML('afterend', '');
    $('#grid').outerHTML = `<div class="empty" id="grid">${none?
      `<div style="font-size:16px;color:var(--text);margin-bottom:4px">Your vault is empty</div>Add folders to scan, or add things by hand - for example board games, retro games or books on your shelf.<br>
       <a class="btn primary" href="#/scan"><i class="ti ti-folder-search"></i>Scan folders</a><button class="btn" id="demoHome"><i class="ti ti-flask"></i>Load the demo collection</button>`:
      'Nothing matches these filters.<br><button class="btn" id="clrF"><i class="ti ti-x"></i>Clear filters</button>'}</div>`;
    if($('#demoHome')) $('#demoHome').onclick = loadDemo;
    if($('#clrF')) $('#clrF').onclick = () => {Object.assign(S.f, {q:'', format:'all', owner:'all', missing:false}); viewLibrary(coll)};
    return;
  }
  const g = $('#grid'); if(!g.classList.contains('grid')) g.outerHTML = '<div class="grid" id="grid"></div>';
  $('#grid').innerHTML = shown.map(posterHTML).join('');
  $('#more').innerHTML = a.length > shown.length ? `<button class="btn" id="bMore">Show more (${(a.length-shown.length).toLocaleString()} left)</button>` : '';

function drawCal(){
  const f = S.calF, q = f.q.trim().toLowerCase();
  let a = S.cal.entries.filter(e => (f.type==='all'||e.type===f.type) && (!f.mine||e.lib) && (!q || (e.title+' '+e.detail).toLowerCase().includes(q)));
  const keys = {date:e=>e.date+e.title, type:e=>e.type+e.date, title:e=>e.title.toLowerCase(), detail:e=>e.detail.toLowerCase(), mine:e=>(e.lib?'0':'1')+e.date};
  a.sort((x,y) => keys[f.sort](x).localeCompare(keys[f.sort](y))); if(f.rev) a.reverse();
  const up = S.cal.updated ? new Date(S.cal.updated*1000).toLocaleString() : null;
  $('#calsub').textContent = up ? `${a.length} of ${S.cal.entries.length} releases · updated ${up}` : 'Nothing downloaded yet';
  if(!S.cal.entries.length){
    $('#cal').innerHTML = `<div class="empty">${up?'No releases found in this window.':'Nothing downloaded yet.<br>Add your free API keys in Settings, then press "Refresh from internet".'}
      ${(S.cal.errors||[]).map(e=>`<div class="muted" style="margin-top:8px">${esc(e)}</div>`).join('')}</div>`; return;
  }
  let rows = '', last = '';
  a.forEach((e,i) => {
    if(f.sort==='date'){const m = e.date.slice(0,7);
      if(m!==last){last = m; const d = new Date(m+'-01T00:00:00'); rows += `<tr class="mon"><td colspan="6">${d.toLocaleString(undefined,{month:'long',year:'numeric'})}</td></tr>`}}
    const cls = {Movie:'p-amber',Series:'p-green',Comic:'p-blue',Cards:'p-violet'}[e.type]||'p-gray';
    rows += `<tr class="click" data-u="${esc(e.url)}"><td>${esc(e.date)}</td><td><span class="pill ${cls}">${esc(e.type)}</span></td><td class="t">${esc(e.title)}</td><td>${esc(e.detail)}</td><td>${e.lib?'<span class="pill p-blue">★ yours</span>':''}</td><td><button class="heart" data-w="${i}" title="Add to my wishlist"><i class="ti ti-heart"></i></button></td></tr>`;
  });
  const th = (k,l) => `<th class="s" data-s="${k}">${l}${f.sort===k?(f.rev?' ▲':' ▼'):''}</th>`;
  $('#cal').innerHTML = `<table><thead><tr>${th('date','Date')}${th('type','Type')}${th('title','Title')}${th('detail','Details')}${th('mine','In my library')}<th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">Nothing matches.</td></tr>'}</tbody></table>`;
  $$('#cal th.s').forEach(el => el.onclick = () => {if(f.sort===el.dataset.s)f.rev=!f.rev;else{f.sort=el.dataset.s;f.rev=false} drawCal()});
  $$('#cal tr.click').forEach(el => el.onclick = () => {if(el.dataset.u)window.open(el.dataset.u,'_blank','noopener')});
  $$('#cal [data-w]').forEach(b => b.onclick = async ev => {
    ev.stopPropagation(); const e = a[+b.dataset.w], cat = {Movie:'movie', Series:'series', Comic:'comic', Cards:'card'}[e.type] || 'movie';
    if(await wishAdd({cat, name:e.title, note:e.detail || '', url:e.url, date:e.date, source:'upcoming'})) b.style.color = '#ff7aa2';
  });
}

/* ---------------------------------------------------------------- scan page */
async function viewScan(){
  await loadState();
  $('#main').innerHTML = `<div class="head"><h1>Scan folders</h1><div class="sp"></div></div>
    <div class="panel"><h3>Locations</h3><div id="roots"></div>
      <div class="bar" style="margin-top:12px"><input class="grow" id="rp" type="text" placeholder="Paste a folder path, for example D:\\Comics">
        <button class="btn" id="radd"><i class="ti ti-plus"></i>Add folder</button><button class="btn" id="rdr"><i class="ti ti-device-desktop"></i>Add all drives</button></div>
      <p class="hint">Scanning only reads file names. Nothing is changed, moved or uploaded. Choose what a folder holds to put its files in a collection of your own - otherwise comics, books, videos and 3D models are sorted by file type, and comics inside a folder named <i>manga</i> go to Manga. Files on drives that are not connected stay in the catalog.</p></div>
    <div class="head"><button class="btn primary" id="scan"><i class="ti ti-player-play"></i>Scan now</button>
      ${S.state.online?`<button class="btn" id="chk"><i class="ti ti-world-search"></i>Check online</button><button class="btn" id="cov"><i class="ti ti-photo"></i>Get covers &amp; info</button>`:''}
      <span class="sub">${S.state.file_count.toLocaleString()} media files in the catalog</span></div>
    <div class="log" id="log"></div>`;
  const drawRoots = () => {
    const targets = S.state.collections.filter(c => c.scanned), ruleOf = p => (S.state.folder_rules.find(x => x.path === p) || {}).coll || '';
    $('#roots').innerHTML = S.state.roots.length ? S.state.roots.map(r=>`<div class="row"><i class="ti ti-folder"></i><div class="grow">${esc(r)}</div>
        <select class="rcoll" data-rc="${esc(r)}" title="Which collection do the files in this folder belong to?" style="max-width:230px"><option value="">Sort automatically by file type</option>${targets.map(c => `<option value="${esc(c.id)}" ${ruleOf(r) === c.id ? 'selected' : ''}>These are my ${esc(c.name)}${c.enabled ? '' : ' (hidden)'}</option>`).join('')}</select>
        <button class="btn sm ghost danger" data-rm="${esc(r)}"><i class="ti ti-trash"></i></button></div>`).join('')
      : '<div class="muted">No folders yet.</div>';
    $$('[data-rm]').forEach(b => b.onclick = async () => {if(!confirm('Remove this location and forget what was catalogued from it? Your files are not touched.'))return;
      await api('/api/roots/remove',{path:b.dataset.rm}); await loadState(); await loadLib(); drawRoots(); renderSide()});
    $$('[data-rc]').forEach(sel => sel.onchange = async () => {
      try{ await api('/api/roots/collection', {path:sel.dataset.rc, coll:sel.value}); await loadState(); await loadLib(); renderSide(); toast(sel.value ? 'Done - the files in that folder now show up in that collection' : 'Back to sorting by file type') }catch(e){ toast(e.message, true) } });
  };
  drawRoots(); drawLog();
  const add = async () => {try{await api('/api/roots',{path:$('#rp').value}); $('#rp').value=''; await loadState(); drawRoots()}catch(e){toast(e.message,true)}};
  $('#radd').onclick = add; $('#rp').onkeydown = e => {if(e.key==='Enter')add()};
  $('#rdr').onclick = async () => {const r = await api('/api/roots/drives',{}); await loadState(); drawRoots(); toast(r.added.length?'Added '+r.added.join(', '):'No drives found')};
  $('#scan').onclick = async () => {const r = await api('/api/scan',{}); if(!r.started)toast('Another task is running',true); else startPolling()};
  if($('#chk')) $('#chk').onclick = () => startOnline({});
  if($('#cov')) $('#cov').onclick = () => startCovers({});
}
function drawLog(){const el = $('#log'); if(el){el.textContent = (S.job.log||[]).join('\n') || 'Scan results and messages show up here.'; el.scrollTop = el.scrollHeight}}
async function startOnline(scope){
  if(!S.state.has_tmdb && !S.state.has_cv){toast('Add a free TMDB and/or Comic Vine key in Settings first',true); go('#/settings'); return}
  try{ const r = await api('/api/online/check', scope || {}); if(!r.started) toast('Another task is running',true); else startPolling() }
  catch(e){ toast(e.message, true) }
}
async function startCovers(scope){
  try{ const r = await api('/api/covers/fetch', scope || {}); if(!r.started) toast('Another task is running',true); else startPolling() }
  catch(e){ toast(e.message, true) }
}

function tpValueKid(it, k){       // a ready-made layer for exactly this number (made from OPPP), if the template has one
  const V = TP_VALUES[it.name]; if(!V || !TP.txt.on || !it.kids[k] || it.kids[k].name !== 'default') return null;
  const raw = String(TP.txt[V[1]] == null ? '' : TP.txt[V[1]]).trim(); if(raw === '') return null;

  let base = V[2];
  if(it.name === 'Cost Number'){ const miss = []; for(let n = 0; n <= 10; n++) if(!it.kids.some(x => x.name === V[0] + '=' + n)) miss.push(n); if(miss.length === 1) base = String(miss[0]) }      // the default layer shows this cost (4 on Character, 5 on Event/Stage)
  if(val === base) return it.kids[k];
  return it.kids.find(x => x.name === V[0] + '=' + val) || null;
}

function tpTextStyle(name, grp){       // what the chosen layer version means for the colour of our own text; null = the normal white look

  if(/white_outline$/.test(n)) return {fill:'#fff', stroke:'#111'};
  if(/red_outline$/.test(n)) return {fill:'#c00020', stroke:'#111'};
  if(/=black$/.test(n)) return {fill:'#111', stroke:null};
  if(/=white$/.test(n)) return {fill:'#fff', stroke:'#111'};
  if(/golden|tournament/.test(n)) return {fill:'#d2ac28', stroke:'#111'};
  if(/5_elders/.test(n)) return {fill:'#e02020', stroke:'#111'};
  if(/serialized/.test(n)) return {fill:'#e0c060', stroke:'#111'};

/* ---------------------------------------------------------------- tidy up */
const TD = {step:1, src:'', dest:'', plan:null, titles:{}, checked:new Set(), busy:false};
const TD_CAT = {movie:'Movies', series:'Series', comic:'Comics', book:'Books', model:'3D models', music:'Music'};
function tdSteps(){
  const names = ['Scan', 'Titles', 'Folders', 'Move'];
  return `<div class="tdsteps">${names.map((n,i) => `<span class="${TD.step===i+1?'on':''} ${TD.step>i+1?'done':''}"><b>${TD.step>i+1?'✓':i+1}</b>${n}</span>`).join('')}</div>`;
}
async function tdPlan(rescan){
  TD.busy = true; viewTidy();
  try{
    const r = await api('/api/tidy/plan', {src:TD.src, dest:TD.dest, titles:TD.titles, rescan:!!rescan});
    TD.plan = r; TD.dest = r.dest;
    if(rescan){ TD.checked = new Set(); r.groups.forEach(g => g.items.forEach(i => {if(i.status==='move') TD.checked.add(i.src)})) }
    else { const valid = new Set(); r.groups.forEach(g => g.items.forEach(i => {if(i.status==='move') valid.add(i.src)})); TD.checked = new Set([...TD.checked].filter(x => valid.has(x))) }
  }catch(e){ toast(e.message, true); TD.busy = false; viewTidy(); return false }
  TD.busy = false; return true;
}
async function viewTidy(){
  const jobRunning = S.job && S.job.running && S.job.kind === 'tidy';
  let h = `<div class="head"><h1>Tidy up</h1><span class="sub">Nothing changes until step 4, and every move can be undone.</span></div>${tdSteps()}`;
  if(TD.busy){ $('#main').innerHTML = h + '<div class="panel"><i class="ti ti-loader-2"></i> Looking at your files ... this only reads names, nothing is changed.</div>'; return }
  if(TD.step === 1){
    h += `<div class="panel"><h3>1 · Which folder is messy?</h3>
      <div class="bar"><input class="grow" id="tdsrc" type="text" placeholder="Paste a folder path, for example D:\\Downloads" value="${esc(TD.src)}"></div>
      <h3 style="margin-top:16px">Where should the tidy library go?</h3>
      <div class="bar"><input class="grow" id="tddest" type="text" placeholder="Leave empty to tidy inside the same folder" value="${esc(TD.dest)}"></div>
      <p class="hint">The scan only reads file names. Movies, series, comics, books, music and 3D models are recognised; everything else is left alone. Inside the target you get folders like <i>Movies / Title (Year)</i>, <i>Series / Show / Season 01</i>, <i>Comics / Series</i> and <i>Music / Album</i>. Subtitle and info files next to a video travel with it.</p>
      <div class="bar" style="margin-top:12px"><button class="btn primary" id="tdscan"><i class="ti ti-search"></i>Scan this folder</button></div></div>`;
  } else if(TD.step === 2 && TD.plan){
    const gs = TD.plan.groups.filter(g => g.moves || g.count);
    h += `<div class="panel"><h3>2 · Do the titles look right?</h3>
      <p class="hint">${TD.plan.files.toLocaleString()} files found in ${gs.length} titles${TD.plan.skipped ? ` (${TD.plan.skipped} tiny files like samples were ignored)` : ''}${TD.plan.truncated ? ' - only the first 30,000 files are shown, tidy again for the rest' : ''}. Fix any title that was guessed wrong - the folder gets that name.</p>
      ${gs.map(g => `<div class="row"><span class="badge2">${esc(TD_CAT[g.cat]||g.cat)}</span>
        <input class="grow tdtitle" data-gid="${esc(g.gid)}" type="text" value="${esc(g.title)}">
        <span class="muted" style="white-space:nowrap">${g.count} file${g.count===1?'':'s'}</span></div>`).join('') || '<div class="muted">No media files found in this folder.</div>'}
      <div class="bar" style="margin-top:14px"><button class="btn" id="tdback"><i class="ti ti-arrow-left"></i>Back</button>
        ${gs.length ? '<button class="btn primary" id="tdnext">Looks good - show the folders</button>' : ''}</div></div>`;
  } else if(TD.step === 3 && TD.plan){
    const p = TD.plan, all = p.groups.flatMap(g => g.items), mv = all.filter(i => TD.checked.has(i.src));
    const bytes = mv.reduce((a,i) => a + i.size, 0), rel = x => x.startsWith(p.dest) ? x.slice(p.dest.length).replace(/^[\\/]+/, '') : x;
    h += `<div class="panel"><h3>3 · Here is exactly what will happen</h3>
      <p class="hint">Target: <b>${esc(p.dest)}</b><br>Untick anything you want to leave where it is. Files whose name is already taken are never replaced - they stay put.</p>
      <div class="bar" style="margin-bottom:8px"><b id="tdsum">${mv.length} files · ${fmtSize(bytes)}</b><div class="sp"></div>
        <button class="btn sm ghost" id="tdall">Tick all</button><button class="btn sm ghost" id="tdnone">Untick all</button></div>
      ${p.groups.map(g => `<details class="tdgrp" ${p.groups.length<=6?'open':''}><summary><input type="checkbox" data-g="${esc(g.gid)}" ${g.moves && g.items.every(i => i.status!=='move' || TD.checked.has(i.src))?'checked':''} ${g.moves?'':'disabled'}>
          <b>${esc(TD_CAT[g.cat]||g.cat)} / ${esc(g.title)}</b> <span class="muted">${g.moves} to move${g.count-g.moves ? ` · ${g.count-g.moves} left alone` : ''}</span></summary>
        ${g.items.map(i => `<label class="tdfile ${i.status}"><input type="checkbox" data-f="${esc(i.src)}" ${i.status==='move'?'':'disabled'} ${TD.checked.has(i.src)?'checked':''}>
          <span class="tdpaths"><span class="muted">${esc(i.src)}</span><br>→ ${esc(rel(i.dest))}${i.extra ? ` <span class="muted">(+${i.extra} subtitle/info file${i.extra>1?'s':''})</span>` : ''}${i.note ? `<br><i class="muted">${esc(i.note)}</i>` : ''}</span></label>`).join('')}</details>`).join('')}
      <div class="bar" style="margin-top:14px"><button class="btn" id="tdback"><i class="ti ti-arrow-left"></i>Back</button>
        <button class="btn primary" id="tdgo" ${mv.length?'':'disabled'}><i class="ti ti-folders"></i>Create folders and move ${mv.length} files</button></div></div>`;
  } else {
    h += `<div class="panel"><h3>4 · ${jobRunning ? 'Moving your files ...' : 'Finished'}</h3><div class="log" id="log"></div>
      <div class="bar" style="margin-top:12px">${jobRunning ? '' : '<button class="btn" id="tdagain"><i class="ti ti-refresh"></i>Tidy another folder</button>'}</div></div>
      <div class="panel"><h3>Earlier tidy-ups</h3><div id="tdhist" class="muted">Loading ...</div></div>`;
  }
  $('#main').innerHTML = h;
  const ctl = id => $('#' + id);
  if(ctl('tdscan')) ctl('tdscan').onclick = async () => {
    TD.src = ctl('tdsrc').value.trim(); TD.dest = ctl('tddest').value.trim(); TD.titles = {};
    if(!TD.src){ toast('Paste the folder first', true); return }
    if(await tdPlan(true)) TD.step = 2; viewTidy() };
  $$('.tdtitle').forEach(inp => inp.onchange = () => {
    const g = TD.plan.groups.find(x => x.gid === inp.dataset.gid); if(!g) return;
    TD.titles[g.gid] = inp.value.trim() || g.auto; g.title = TD.titles[g.gid] });
  if(ctl('tdnext')) ctl('tdnext').onclick = async () => { if(await tdPlan(false)) TD.step = 3; viewTidy() };
  if(ctl('tdback')) ctl('tdback').onclick = () => { TD.step = TD.step - 1; viewTidy() };
  const sum = () => { const all = TD.plan.groups.flatMap(g => g.items), mv = all.filter(i => TD.checked.has(i.src));
    ctl('tdsum').textContent = `${mv.length} files · ${fmtSize(mv.reduce((a,i) => a + i.size, 0))}`;
    ctl('tdgo').disabled = !mv.length; ctl('tdgo').innerHTML = `<i class="ti ti-folders"></i>Create folders and move ${mv.length} files`; };
  $$('[data-f]').forEach(c => c.onchange = () => { c.checked ? TD.checked.add(c.dataset.f) : TD.checked.delete(c.dataset.f); sum() });
  $$('[data-g]').forEach(c => { c.onclick = e => e.stopPropagation(); c.onchange = () => {
    const g = TD.plan.groups.find(x => x.gid === c.dataset.g);

    $$('[data-f]', c.closest('details')).forEach(f => { if(!f.disabled) f.checked = c.checked }); sum() } });
  if(ctl('tdall')) ctl('tdall').onclick = () => { TD.plan.groups.forEach(g => g.items.forEach(i => {if(i.status==='move') TD.checked.add(i.src)})); viewTidy() };
  if(ctl('tdnone')) ctl('tdnone').onclick = () => { TD.checked = new Set(); viewTidy() };
  if(ctl('tdgo')) ctl('tdgo').onclick = async () => {
    if(!TD.checked.size) return;
    if(!confirm(`Move ${TD.checked.size} files now? Nothing is overwritten and you can undo it afterwards.`)) return;
    try{ const r = await api('/api/tidy/apply', {src:TD.src, dest:TD.dest, titles:TD.titles, selected:[...TD.checked]});
      if(!r.started){ toast('Another task is running', true); return }
      TD.step = 4; startPolling(); viewTidy() }catch(e){ toast(e.message, true) } };
  if(ctl('tdagain')) ctl('tdagain').onclick = () => { TD.step = 1; TD.plan = null; TD.titles = {}; TD.checked = new Set(); viewTidy() };
  if(TD.step === 4){ drawLog(); tdHistory() }
}
async function tdHistory(){

function drawJobbar(){
  const j = S.job; $('#jobbar').classList.toggle('on', !!j.running);
  $('#jobtx').textContent = j.text || 'Working ...'; drawLog();
}
async function pollJob(){
  try{
    const j = await api('/api/job'), was = S.job.running; S.job = j; drawJobbar();
    if(was && !j.running){ S.polling = false; await afterJob(j); return }
    if(j.running){ setTimeout(pollJob, 900); return }
  }catch(e){}
  S.polling = false;
}
function startPolling(){ if(!S.polling){S.polling = true; S.job.running = true; drawJobbar(); pollJob()} }
async function afterJob(j){
  await loadState(); await loadLib(); S.coverV = Date.now(); render();
  if(j.kind === 'wiki-import' && Object.keys(S.state.pending_pics || {}).length){ fetchPendingPics(null) }

}

/* ---------------------------------------------------------------- comic reader */
function fmtT(t){t = Math.max(0, Math.floor(t||0)); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), sec = t%60; return (h ? h+':'+String(m).padStart(2,'0') : m)+':'+String(sec).padStart(2,'0')}
function progressHTML(f){
  if(f.watchable){
    if(!f.watch) return '<span class="muted">Unwatched</span>';
    if(f.watch.finished) return '<span class="pill p-green">Watched</span>';
    const pct = Math.round(100*f.watch.pos/Math.max(1,f.watch.duration));
    return `<div class="prog" title="${fmtT(f.watch.pos)} of ${fmtT(f.watch.duration)}"><i style="width:${pct}%"></i></div><div class="muted" style="font-size:11.5px;margin-top:3px">${fmtT(f.watch.pos)} / ${fmtT(f.watch.duration)}</div>`;
  }
  if(f.bookable){
    if(!f.book) return '<span class="muted">Unread</span>';
    if(f.book.finished) return '<span class="pill p-green">Read</span>';
    const pc = Math.round(100*f.book.percent);
    return `<div class="prog"><i style="width:${pc}%"></i></div><div class="muted" style="font-size:11.5px;margin-top:3px">${pc}%</div>`;
  }
  if(!f.readable) return '';
  if(!f.read) return '<span class="muted">Unread</span>';
  if(f.read.finished) return '<span class="pill p-green">Read</span>';
  const pct = Math.round(100*f.read.page/Math.max(1,f.read.total));
  return `<div class="prog" title="Page ${f.read.page} of ${f.read.total}"><i style="width:${pct}%"></i></div><div class="muted" style="font-size:11.5px;margin-top:3px">Page ${f.read.page} / ${f.read.total}</div>`;
}
function continueHTML(d){
  const vids = d.files.map((f,i)=>({f,i,p:f.watch})).filter(x=>x.f.watchable);
  const comics = d.files.map((f,i)=>({f,i,p:f.read})).filter(x=>x.f.readable);
  const books = d.files.map((f,i)=>({f,i,p:f.book})).filter(x=>x.f.bookable);
  const rd = vids.length ? vids : (comics.length ? comics : books), kind = vids.length ? 'watch' : (comics.length ? 'read' : 'book');
  const models = d.files.map((f,i)=>({f,i})).filter(x=>x.f.model);
  const audio = d.files.filter(f => f.audio);
  if(!rd.length && audio.length) return `<div class="field" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="albumPlay"><i class="ti ti-player-play"></i>Play album</button><button class="btn" id="albumShuf"><i class="ti ti-arrows-shuffle"></i>Shuffle</button><button class="btn ghost" id="albumFolder" title="Show the folder"><i class="ti ti-folder-open"></i></button><span class="sub">${audio.length} track${audio.length === 1 ? '' : 's'}</span></div>`;
  if(!rd.length) return models.length ? `<div class="field"><button class="btn primary" id="modelBtn" data-i="${models[0].i}"><i class="ti ti-3d-cube-sphere"></i>3D preview</button></div>` : '';
  const done = rd.filter(x=>x.p && x.p.finished).length;
  const cur = rd.find(x=>x.p && !x.p.finished) || rd.find(x=>!x.p) || rd[0];
  const started = cur.p && !cur.p.finished;
  const label = kind==='watch' ? (started ? 'Continue watching' : (done===rd.length ? 'Watch again' : 'Start watching'))
                               : (started ? 'Continue reading' : (done===rd.length ? 'Read again' : 'Start reading'));
  return `<div class="field" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="contBtn" data-i="${cur.i}" data-k="${kind}"><i class="ti ti-${kind==='watch'?'player-play':'book-2'}"></i>${label}</button>
    <span class="sub">${kind==='watch'?'Watched':'Read'} ${done} of ${rd.length}</span></div>`;
}
const R = {on:false, path:'', gid:'', idx:0, files:[], pages:0, cur:0, saveT:null, settle:false, key:null,
  cfg:Object.assign({mode:'single', fit:'h', rtl:false}, (()=>{try{return JSON.parse(localStorage.getItem('vault.reader')||'{}')}catch(e){return {}}})())};
const pageUrl = i => '/api/read/page?path='+enc(R.path)+'&n='+i+'&t='+TOKEN;
function saveCfg(){try{localStorage.setItem('vault.reader', JSON.stringify(R.cfg))}catch(e){}}
function nextFileIdx(){for(let i=R.idx+1;i<R.files.length;i++) if(R.files[i].readable) return i; return -1}
function spread(){
  if(R.cfg.mode !== 'double') return [R.cur];
  const a = R.cur === 0 ? 0 : (R.cur % 2 === 1 ? R.cur : R.cur - 1);
  return a === 0 ? [0] : (a+1 < R.pages ? [a, a+1] : [a]);
}
async function viewReader(arg){
  const k = arg.lastIndexOf('/'), gid = arg.slice(0,k), idx = +arg.slice(k+1);
  if(R.on) { await saveProgress(true); detachReader() }
  document.body.classList.add('reading'); $('#reader').classList.add('on'); $('#rend').classList.remove('on');
  $('#rview').innerHTML = '<div class="empty" style="margin:40px">Opening ...</div>';
  try{
    const d = await api('/api/item?id='+enc(gid)+'&from_one='+(S.fromOne?1:0));
    const f = d.files[idx]; if(!f || !f.readable) throw new Error('This file cannot be opened in the reader');
    const info = await api('/api/read/open?path='+enc(f.path)+'&t='+TOKEN);
    Object.assign(R, {on:true, path:f.path, gid, idx, files:d.files, pages:info.pages, key:null,
      title: d.name + (f.label ? ' ' + f.label : '')});
    R.cur = (info.resume && !info.resume.finished) ? Math.min(info.pages-1, Math.max(0, info.resume.page-1)) : 0;
    R.wasFinished = !!(info.resume && info.resume.finished);
    $('#rtitle').textContent = R.title; $('#rnext').style.display = nextFileIdx() < 0 ? 'none' : '';
    R.cfg.rtl = rtlFor(d); $('#rmode').value = R.cfg.mode; $('#rfit').value = R.cfg.fit; updateDirBtn();
    $('#rslide').max = R.pages; $('#reader').classList.remove('nobars');
    document.addEventListener('keydown', onKey); document.addEventListener('wheel', onReaderWheel, {passive:false});
    drawPages();
  }catch(e){ detachReader(); document.body.classList.remove('reading'); $('#reader').classList.remove('on'); toast(e.message, true); go('#/item/'+enc(gid)) }
}
const rtlMap = () => {try{ return JSON.parse(localStorage.getItem('vault.rtl') || '{}') }catch(e){ return {} }};
const rtlFor = d => { const m = rtlMap(); return d.id in m ? m[d.id] : collKind(d.coll) === 'manga' };     // manga starts right to left; your choice per series is remembered
function detachReader(){ R.on = false; document.removeEventListener('keydown', onKey); document.removeEventListener('wheel', onReaderWheel); clearTimeout(R.saveT) }
function leaveReader(){
  if(!R.on && !$('#reader').classList.contains('on')) return;
  if(R.on) saveProgress(true);
  detachReader(); document.body.classList.remove('reading'); $('#reader').classList.remove('on');
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  $('#rview').innerHTML = '';
}
async function exitReader(){ await saveProgress(true); go('#/item/'+enc(R.gid)) }
function updateDirBtn(){ $('#rdir').innerHTML = R.cfg.rtl ? '<i class="ti ti-arrow-left"></i>Right to left' : '<i class="ti ti-arrow-right"></i>Left to right'; $('#rslide').dir = R.cfg.rtl ? 'rtl' : 'ltr' }
function drawPages(){
  const v = $('#rview'), c = R.cfg;
  v.className = `m-${c.mode} f-${c.mode==='scroll'?'w':c.fit}`; $('#rfit').disabled = c.mode === 'scroll';
  if(c.mode === 'scroll'){
    if(R.key !== 'scroll'){
      R.key = 'scroll';
      v.innerHTML = '<div class="strip">' + Array.from({length:R.pages}, (_,i)=>`<img data-i="${i}" loading="lazy" alt="Page ${i+1}" src="${pageUrl(i)}">`).join('') + '</div>';
      R.settle = true; setTimeout(()=>{R.settle = false}, 2500);
      v.querySelectorAll('img').forEach(im => im.onload = () => {im.classList.add('ok'); if(R.settle) align()});
      v.onscroll = onStripScroll; v.onclick = onViewClick; align();
    } else align();
  } else {
    R.key = 'pages'; v.onscroll = () => {R.lastScroll = performance.now()};
    const ids = spread(); R.cur = ids[0];
    v.innerHTML = `<div class="pages ${c.rtl && ids.length>1 ? 'rtl' : ''}">` + ids.map(i=>`<img alt="Page ${i+1}" src="${pageUrl(i)}" draggable="false">`).join('') + '</div>';
    v.scrollTop = 0; v.scrollLeft = 0; v.onclick = onViewClick;
    const last = ids[ids.length-1]; for(let k=1;k<=2;k++) if(last+k < R.pages){ const im = new Image(); im.src = pageUrl(last+k) }
  }
  updateUI();
}
function align(){ const im = $('#rview').querySelector(`img[data-i="${R.cur}"]`); if(im) im.scrollIntoView({block:'start'}) }
function onStripScroll(){
  if(R.raf || R.settle) return;
  R.raf = requestAnimationFrame(() => {
    R.raf = 0; const v = $('#rview'), top = v.getBoundingClientRect().top + 40, imgs = v.querySelectorAll('img'); let cur = 0;
    for(let i=0;i<imgs.length;i++){ if(imgs[i].getBoundingClientRect().bottom > top){ cur = i; break } }
    if(cur !== R.cur){ R.cur = cur; updateUI(); queueSave() }
  });
}
function updateUI(){
  const ids = R.cfg.mode === 'scroll' ? [R.cur] : spread();
  $('#rcount').textContent = (ids.length > 1 ? `${ids[0]+1}-${ids[1]+1}` : `${R.cur+1}`) + ' / ' + R.pages;
  $('#rslide').value = R.cur + 1;
}
function goTo(n, save=true){
  n = Math.max(0, Math.min(R.pages-1, n));
  if(R.cfg.mode === 'scroll'){ R.cur = n; R.settle = false; align(); updateUI() }
  else { R.cur = n; drawPages() }
  if(save) queueSave();
}
function step(dir){
  if(R.cfg.mode === 'scroll'){ return goTo(R.cur + dir) }
  const ids = spread();
  if(dir > 0){
    if(ids[ids.length-1] >= R.pages-1){ showEnd(); return }
    goTo(ids[ids.length-1] + 1);
  } else {
    if(R.cur <= 0) return;
    goTo(R.cfg.mode === 'double' ? Math.max(0, R.cur - 2) : R.cur - 1);
  }
}
function showEnd(){
  const n = nextFileIdx(); $('#rendnext').style.display = n < 0 ? 'none' : '';
  $('#rendsub').textContent = n < 0 ? 'That was the last file in this series.' : 'Continue with the next one?';
  $('#rend').classList.add('on'); saveProgress(true);
}
function goNextIssue(){ const n = nextFileIdx(); if(n >= 0) go('#/read/'+enc(R.gid)+'/'+n) }
function onViewClick(e){
  const x = e.clientX / window.innerWidth;
  if(R.cfg.mode !== 'scroll' && x < 0.3) return step(R.cfg.rtl ? 1 : -1);
  if(R.cfg.mode !== 'scroll' && x > 0.7) return step(R.cfg.rtl ? -1 : 1);
  $('#reader').classList.toggle('nobars');
}
function onKey(e){
  if(!R.on || ['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName) && e.key !== 'Escape') return;
  const dlg = document.querySelector('.pdlg'); if(dlg){ if(e.key === 'Escape') dlg.remove(); return }
  if(e.key === 'p' || e.key === 'P'){ $('#rprint').click(); return }
  const scroll = R.cfg.mode === 'scroll', k = e.key;
  if(k === 'Escape'){ if($('#rend').classList.contains('on')) $('#rend').classList.remove('on'); else if(!document.fullscreenElement) exitReader(); return }
  if(k === 'f' || k === 'F'){ toggleFull(); return }
  if(k === 'n' || k === 'N'){ goNextIssue(); return }
  if(k === 'Home'){ e.preventDefault(); goTo(0); return }
  if(k === 'End'){ e.preventDefault(); goTo(R.pages-1); return }
  if(scroll) return;
  if(k === 'ArrowRight'){ e.preventDefault(); step(R.cfg.rtl ? -1 : 1) }
  else if(k === 'ArrowLeft'){ e.preventDefault(); step(R.cfg.rtl ? 1 : -1) }
  else if(k === ' ' || k === 'PageDown'){ e.preventDefault(); step(e.shiftKey ? -1 : 1) }
  else if(k === 'PageUp'){ e.preventDefault(); step(-1) }
}
let rwAcc = 0, rwLock = 0;
function onReaderWheel(e){          // scroll down = next page, scroll up = previous page (tall pages scroll first)
  if(!R.on || R.cfg.mode === 'scroll' || e.ctrlKey || $('#rend').classList.contains('on')) return;
  const v = $('#rview'), down = e.deltaY > 0, canScroll = v.scrollHeight > v.clientHeight + 4, now = performance.now();
  if(canScroll){
    const atBottom = v.scrollTop + v.clientHeight >= v.scrollHeight - 2, atTop = v.scrollTop <= 1;
    if((down && !atBottom) || (!down && !atTop)){ rwAcc = 0; return }
    if(now - (R.lastScroll || 0) < 220){ e.preventDefault(); return }          // still gliding to the edge - do not flip yet
  }
  e.preventDefault();
  if(now < rwLock) return;
  rwAcc += e.deltaY; if(Math.abs(rwAcc) < 30) return;
  const dir = rwAcc > 0 ? 1 : -1; rwAcc = 0; rwLock = now + 380;
  step(dir);
  if(canScroll) requestAnimationFrame(() => { const w = $('#rview'); w.scrollTop = dir < 0 ? w.scrollHeight : 0 });
}
function toggleFull(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}) }
function queueSave(){ clearTimeout(R.saveT); R.saveT = setTimeout(() => saveProgress(false), 700) }
async function saveProgress(final){
  if(!R.on) return; clearTimeout(R.saveT);
  if(R.wasFinished && R.cur < 2) return;   // just looked at a finished issue - keep it marked as read
  const ids = R.cfg.mode === 'scroll' ? [R.cur] : spread(), last = ids[ids.length-1];
  try{
    await fetch('/api/read/progress', {method:'POST', keepalive:true, headers:{'X-Vault-Token':TOKEN,'Content-Type':'application/json'},
      body: JSON.stringify({path:R.path, page:last+1, total:R.pages, finished:last+1 >= R.pages})});
    const f = R.files[R.idx]; if(f) f.read = {page:last+1, total:R.pages, finished:last+1 >= R.pages};
  }catch(e){}
}
$('#rback').onclick = exitReader;
$('#rfull').onclick = toggleFull;
$('#rcover').onclick = async () => { try{ await api('/api/cover/page', {id:R.gid, path:R.path, n:R.cur}); S.coverV = Date.now(); toast('Page ' + (R.cur + 1) + ' is now the cover') }catch(e){ toast(e.message, true) } };
$('#rprint').onclick = () => printDialog({path:R.path, title:R.title, pages:R.pages, current:R.cur + 1});
/* printing: the pages are drawn big on the server and handed to the browser's own print window (pick paper, or Save as PDF there) */
async function printPages(path, from, to, title){
  const fr = document.createElement('iframe'); fr.className = 'nvprint'; fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(fr);
  const doc = fr.contentDocument; doc.open();
  let h = `<!doctype html><title>${esc(title)}</title><style>@page{margin:0}html,body{margin:0;background:#fff}img{display:block;width:100%;height:100vh;object-fit:contain;break-after:page}img:last-child{break-after:auto}</style>`;
  for(let i = from; i <= to; i++) h += `<img src="${location.origin}/api/read/page?path=${enc(path)}&n=${i-1}&w=1800&t=${TOKEN}">`;
  doc.write(h); doc.close();
  await Promise.all([...doc.images].map(im => im.complete ? 0 : new Promise(r => {im.onload = im.onerror = r})));
  fr.contentWindow.focus(); fr.contentWindow.print(); window.focus(); if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); setTimeout(() => fr.remove(), 120000);
}

function showCue(t){

function parseVTT(text){

    out.push({s:tm(m[1],m[2],m[3],m[4]), e:tm(m[5],m[6],m[7],m[8]), text:lines.slice(i+1).join('\n')});

const bf = $('#bframe');

async function viewBook(arg){

function onBookKey(e){

async function startCamera(deviceId){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $('#camnote').innerHTML = 'The browser blocks the camera on this address.<br>Open Nightvault at <b>http://127.0.0.1:8765</b> on this PC.'; return }
  try{
    if(SC.stream) SC.stream.getTracks().forEach(t => t.stop());
    const saved = deviceId || localStorage.getItem('vault.cam') || '';
    SC.stream = await navigator.mediaDevices.getUserMedia({video: Object.assign({width:{ideal:1280}, height:{ideal:720}}, saved ? {deviceId:{ideal:saved}} : {}), audio:false});
    const v = $('#cv'); v.srcObject = SC.stream; await v.play(); $('#camnote').style.display = 'none';
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const cur = SC.stream.getVideoTracks()[0].getSettings().deviceId;
    $('#ccam').innerHTML = devs.map((d,i) => `<option value="${esc(d.deviceId)}" ${d.deviceId === cur ? 'selected' : ''}>${esc(d.label || 'Camera ' + (i+1))}</option>`).join('');
    $('#ccam').onchange = e => {localStorage.setItem('vault.cam', e.target.value); startCamera(e.target.value)};
    clearInterval(SC.timer); SC.timer = setInterval(scanTick, 150);
    setSt('Hold a card in the frame');
  }catch(e){
    const msg = e.name === 'NotAllowedError' ? 'Camera access was blocked. Click the camera icon in the address bar and allow it, then reload.'
              : e.name === 'NotFoundError' ? 'No camera found. Connect your phone-as-webcam app first.' : ('Camera problem: ' + e.message);
    $('#camnote').textContent = msg; $('#camnote').style.display = 'flex';
  }
}
function setSt(t){ const el = $('#scst'); if(el) el.textContent = t }
function guideRect(){
  const v = $('#cv'); if(!v || !v.videoWidth) return null;
  const vw = v.videoWidth, vh = v.videoHeight; let h = vh * 0.88, w = h * 63 / 88;
  if(w > vw * 0.92){ w = vw * 0.92; h = w * 88 / 63 }
  return {x:(vw-w)/2, y:(vh-h)/2, w, h, vw, vh};
}
function drawGuide(state){
  const c = $('#cg'); if(!c) return; const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, g = guideRect();
  c.width = r.width * dpr; c.height = r.height * dpr; const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); if(!g) return;
  const sc = Math.min(r.width / g.vw, r.height / g.vh) * dpr, ox = (c.width - g.vw * sc) / 2, oy = (c.height - g.vh * sc) / 2;
  const x = ox + g.x * sc, y = oy + g.y * sc, w = g.w * sc, h = g.h * sc;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.rect(0, 0, c.width, c.height); ctx.roundRect(x, y, w, h, 18 * dpr); ctx.fill('evenodd');
  ctx.lineWidth = 3 * dpr; ctx.strokeStyle = state === 'ok' ? '#5fcf9a' : state === 'busy' ? '#6ea8ff' : '#ffffffcc';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 18 * dpr); ctx.stroke();
}
const _sm = document.createElement('canvas'); _sm.width = 24; _sm.height = 34; const _smc = _sm.getContext('2d', {willReadFrequently:true});
function scanTick(){
  const v = $('#cv'), g = guideRect(); if(!g || v.readyState < 2){ return }
  _smc.drawImage(v, g.x, g.y, g.w, g.h, 0, 0, 24, 34);
  const d = _smc.getImageData(0, 0, 24, 34).data, n = 24 * 34, gray = new Float32Array(n); let mean = 0;
  for(let i = 0; i < n; i++){ gray[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2]; mean += gray[i] } mean /= n;
  let vs = 0; for(let i = 0; i < n; i++) vs += (gray[i] - mean) ** 2; const contrast = Math.sqrt(vs / n);
  let diff = 99; if(SC.prev){ diff = 0; for(let i = 0; i < n; i++) diff += Math.abs(gray[i] - SC.prev[i]); diff /= n } SC.prev = gray;
  const still = diff < 3.5 && contrast > 16;
  if(diff > 12) SC.armed = true;                 // movement = a new card is being put in place
  SC.stable = still ? SC.stable + 1 : 0;
  drawGuide(SC.busy ? 'busy' : (still && SC.armed ? 'ok' : 'idle'));
  if(SC.auto && SC.armed && !SC.busy && SC.stable >= 6){ SC.armed = false; scanNow() }
}
function grabCard(){
  const v = $('#cv'), g = guideRect(), c = document.createElement('canvas'); c.width = 504; c.height = 704;
  c.getContext('2d').drawImage(v, g.x, g.y, g.w, g.h, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
}
async function identifyBlob(blob){
  const url = '/api/cards/identify?sets=' + enc(SC.sets) + '&prefer=' + enc(SC.prefer.join(','));
  const r = await fetch(url, {method:'POST', headers:{'X-Vault-Token':TOKEN, 'Content-Type':'image/jpeg'}, body:blob});
  const j = await r.json(); if(!r.ok) throw new Error(j.error || 'Could not read the card'); return j;
}
function mergeResults(rs){
  const all = new Map();
  rs.forEach(r => r.matches.forEach(m => {if(!all.has(m.id)) all.set(m.id, Object.assign({}, m))}));
  all.forEach(o => {let sum = 0; rs.forEach(r => {const f = r.matches.find(m => m.id === o.id); sum += f ? f.score : 1.5}); o.score = +(sum / rs.length).toFixed(3)});
  const list = [...all.values()].sort((a, b) => a.score - b.score), lead = list[0].score;
  const pref = x => {const k = SC.prefer.indexOf(x.set); return k < 0 ? 99 : k};
  const grp = list.filter(x => x.score <= lead + 0.05).sort((a, b) => pref(a) - pref(b) || a.score - b.score), rest = list.filter(x => x.score > lead + 0.05);
  return {matches:[...grp, ...rest].slice(0, 8), confidence: lead <= 0.65 ? 'high' : lead <= 1.0 ? 'medium' : 'low',
          ambiguous: new Set(grp.map(x => x.set)).size > 1, best: +lead.toFixed(2), ms: rs.reduce((a, r) => a + (r.ms || 0), 0)};
}
async function scanNow(){
  if(SC.busy || !SC.stream || !guideRect()) return;
  SC.busy = true; setSt('Scanning ...');
  try{
    const rs = [];
    for(let i = 0; i < SC.frames; i++){ rs.push(await identifyBlob(await grabCard())); if(i < SC.frames - 1) await sleep(120) }
    SC.result = mergeResults(rs); SC.sel = 0; renderResult();
    const r = SC.result; setSt(r.confidence === 'low' ? 'Not sure - try again or search by name' : 'Found it');
    if(SC.autoAdd && r.confidence === 'high' && !r.ambiguous) addCurrent();
  }catch(e){ setSt(e.message); toast(e.message, true) }
  finally{ SC.busy = false }
}
function renderResult(){
  const el = $('#cres'); if(!el) return; const r = SC.result, m = r && r.matches[SC.sel];
  const price = m ? (SC.foil ? m.eur_foil : m.eur) : null;
  el.innerHTML = `<div class="panel">
    ${m ? `<div class="cres-top"><div class="cardbig"><img src="${cardImg(m.id)}" alt=""></div><div style="min-width:0;flex:1">
      <div style="font-size:18px;font-weight:600">${esc(m.name)}</div>
      <div class="sub" style="margin:2px 0 8px">${esc(m.set.toUpperCase())} #${esc(m.number)}${m.set_name ? ' · ' + esc(m.set_name) : ''}${m.rarity ? ' · ' + esc(m.rarity) : ''}</div>
      <div style="margin-bottom:8px"><span class="conf ${r.confidence}">${{high:'Sure', medium:'Probably', low:'Not sure', manual:'Picked by name'}[r.confidence]}</span>
        ${r.ambiguous ? '<span class="conf medium" title="Several sets share this artwork - check the set symbol">check the set</span>' : ''}</div>
      <div style="font-size:15px;margin-bottom:10px">${SC.foil ? 'Foil ' : ''}${fmtEur(price)} <span class="muted" style="font-size:12px">Cardmarket</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="cadd"><i class="ti ti-plus"></i>Add (Enter)</button>
        <button class="btn ${SC.foil ? 'on' : ''}" id="cfoil" style="${SC.foil ? 'border-color:var(--accentline);color:#a8cbff' : ''}"><i class="ti ti-sparkles"></i>Foil (F)</button></div>

      <div class="cands">${r.matches.map((x, i) => `<div class="cand-t ${i === SC.sel ? 'on' : ''}" data-i="${i}" title="${esc(x.name)} · ${esc(x.set.toUpperCase())} #${esc(x.number)}"><img loading="lazy" src="${cardImg(x.id)}" alt=""><span>${esc(x.set.toUpperCase())} ${esc(x.number)}</span></div>`).join('')}</div>`
    : `<div class="muted" style="padding:30px 10px;text-align:center">Hold a card in the frame.<br>The result shows up here.</div>`}
    <div class="bar" style="margin:14px 0 0"><input class="grow" id="cq" type="search" placeholder="Wrong or not found? Search by name"><button class="btn" id="cqgo">Search</button></div>
    <div id="csess"></div></div>`;
  if($('#cadd')) $('#cadd').onclick = addCurrent;
  if($('#cfoil')) $('#cfoil').onclick = () => {SC.foil = !SC.foil; renderResult()};
  $$('#cres .cand-t').forEach(t => t.onclick = () => {SC.sel = +t.dataset.i; renderResult()});
  const go = async () => {

      if(!list.length){ toast('No card with that name in your indexed images', true); return }
      SC.result = {matches:list.slice(0, 8), confidence:'manual', ambiguous:false, best:0, ms:0}; SC.sel = 0; renderResult();
    }catch(e){toast(e.message, true)} };
  $('#cqgo').onclick = go; $('#cq').onkeydown = e => {if(e.key === 'Enter') go()};
  renderSession();
}
async function addCurrent(){
  const m = SC.result && SC.result.matches[SC.sel]; if(!m) return;
  try{
    const r = await api('/api/cards/add', {id:m.id, foil:SC.foil, delta:1});
    const key = m.id + (SC.foil ? '*' : ''); let e = SC.session.find(x => x.key === key);
    if(!e){ e = {key, id:m.id, foil:SC.foil, name:m.name, set:m.set, number:m.number, price:SC.foil ? m.eur_foil : m.eur, added:0}; SC.session.unshift(e) }
    e.added++; e.owned = r.qty; SC.last = e;
    SC.prefer = [m.set, ...SC.prefer.filter(x => x !== m.set)].slice(0, 4);
    toast(`Added ${m.name} (${m.set.toUpperCase()}) - you own ${r.qty}`); SC.armed = false; renderSession(); setSt('Added - next card');
  }catch(e){toast(e.message, true)}
}
async function undoLast(){
  const e = SC.last; if(!e || !e.added) return;
  try{ const r = await api('/api/cards/add', {id:e.id, foil:e.foil, delta:-1}); e.added--; e.owned = r.qty; if(!e.added) SC.session = SC.session.filter(x => x !== e); SC.last = null; renderSession(); toast('Undone') }
  catch(err){toast(err.message, true)}
}
function renderSession(){
  const el = $('#csess'); if(!el) return; const n = SC.session.reduce((a, e) => a + e.added, 0), val = SC.session.reduce((a, e) => a + e.added * (e.price || 0), 0);

    SC.session.map((e, i) => `<div class="srow"><img src="${cardImg(e.id)}" alt=""><div class="grow">${esc(e.name)} <span class="muted">${esc(e.set.toUpperCase())} #${esc(e.number)}${e.foil ? ' · foil' : ''}</span></div>
      <div class="qb"><button data-s="${i}" data-d="-1">−</button><b>${e.added}</b><button data-s="${i}" data-d="1">+</button></div></div>`).join('') : '';
  $$('#csess [data-s]').forEach(b => b.onclick = async () => {
    const e = SC.session[+b.dataset.s], d = +b.dataset.d;
    try{ const r = await api('/api/cards/add', {id:e.id, foil:e.foil, delta:d}); e.added += d; e.owned = r.qty; if(e.added <= 0) SC.session = SC.session.filter(x => x !== e); renderSession() }catch(err){toast(err.message, true)}

function onScanKey(ev){
  if(['INPUT', 'SELECT', 'TEXTAREA'].includes(ev.target.tagName)) return;
  const k = ev.key;
  if(k === ' '){ ev.preventDefault(); SC.armed = false; scanNow() }
  else if(k === 'Enter'){ ev.preventDefault(); addCurrent() }
  else if(k === 'f' || k === 'F'){ SC.foil = !SC.foil; renderResult() }
  else if(k === 'u' || k === 'U') undoLast();
  else if(/^[1-8]$/.test(k) && SC.result && SC.result.matches[+k - 1]){ SC.sel = +k - 1; renderResult() }
}

/* ---------------------------------------------------------------- import from Nightvault Pocket (phone scanner) */
function importFromPhone(after){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    let data; try{ data = JSON.parse(await f.text()) }catch(e){ toast('That file is not a Nightvault Pocket export.', true); return }
    try{
      const r = await api('/api/cards/import', data);
      const lines = [`<b>${r.added.toLocaleString()}</b> card${r.added === 1 ? '' : 's'} added from ${r.entries.toLocaleString()} entr${r.entries === 1 ? 'y' : 'ies'}.`];
      if(r.removed) lines.push(`<b>${r.removed.toLocaleString()}</b> card${r.removed === 1 ? '' : 's'} taken off, because ${r.removed === 1 ? 'it was' : 'they were'} removed or lowered on the phone.`);
      if(r.already) lines.push(`${r.already.toLocaleString()} entr${r.already === 1 ? 'y was' : 'ies were'} unchanged since the last import.`);
      if(r.shared) lines.push(`Decks, wishlist and prices: ${r.shared.toLocaleString()} change${r.shared === 1 ? '' : 's'} taken over.`);
      if(r.not_downloaded) lines.push(`${r.not_downloaded.toLocaleString()} card${r.not_downloaded === 1 ? ' is' : 's are'} counted for a game whose card images are not downloaded yet. Download that game under Download cards to see them.`);
      if(r.skipped) lines.push(`${r.skipped} entr${r.skipped === 1 ? 'y' : 'ies'} had no set or number and ${r.skipped === 1 ? 'was' : 'were'} skipped.`);
      modal(`<h3>Imported from phone</h3>${lines.map(l => `<p style="margin:0 0 8px">${l}</p>`).join('')}
        ${r.unmatched.length ? `<p class="hint" style="margin:12px 0 4px">Not found in your downloaded images (counted anyway, check the set and number):</p>
          <div style="max-height:220px;overflow:auto;font-size:13px">${r.unmatched.map(u => `<div class="srow">${esc(u)}</div>`).join('')}</div>` : ''}
        <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" id="pix">Done</button></div>`);
      $('#pix').onclick = () => { closeModal(); after && after() };
    }catch(e){ toast(e.message, true) }
  };
  inp.click();
}

function sendToPhone(){
  location.href = '/api/cards/export-phone';

async function readCardText(g){

    <div id="ocrstat" class="muted" style="margin:10px 0">Counting the cards ...</div><div class="bar2" style="--gc:var(--accent)"><i id="ocrbar" style="width:0%"></i></div>
    <pre id="ocrlast" style="white-space:pre-wrap;font-size:12px;max-height:160px;overflow:auto;background:var(--sub);padding:8px;border-radius:8px;margin:10px 0 0;display:none"></pre>
    <div class="btns" style="justify-content:flex-end;margin-top:14px"><a class="btn" id="ocrexp" href="/api/cardhub/textexport?game=${enc(g.id)}" download="${esc(g.id)}.json"><i class="ti ti-download"></i>Save for Pocket</a>
      <button class="btn" id="ocrx">Close</button><button class="btn primary" id="ocrgo"><i class="ti ti-player-play"></i>Start</button></div>`);

  const stat = t => { if($('#ocrstat')) $('#ocrstat').textContent = t };
  try{ const r = await api('/api/cardhub/notext?game=' + enc(g.id)); todo = r.cards; done0 = r.done; stat(`${done0.toLocaleString()} cards have text · ${todo.length.toLocaleString()} still to read`) }catch(e){ stat(e.message) }

  $('#ocrgo').onclick = async () => {
    if(OCR.run){ OCR.stop = true; $('#ocrgo').innerHTML = '<i class="ti ti-player-play"></i>Start'; return }
    if(!todo.length){ toast('Every card with a picture already has text'); return }
    OCR.run = true; OCR.stop = false; $('#ocrgo').innerHTML = '<i class="ti ti-player-pause"></i>Stop';
    try{
      await ocrScript(); stat('Starting the text reader (first time: downloads about 10 MB) ...');
      const worker = await Tesseract.createWorker('eng'), part = $('#ocrpart').value, t0 = Date.now(); let n = 0, saved = 0, batch = [];

      while(todo.length && !OCR.stop){
        const c = todo.shift();

          const im = new Image(); im.src = `/cardfile?game=${enc(g.id)}&set=${enc(c.set)}&n=${enc(c.number)}&t=${TOKEN}`; await im.decode();

          const y0 = part === 'box' ? Math.round(H * 0.5) : 0, y1 = Math.round(H * 0.95);
          cv.width = Math.round(W * k); cv.height = Math.round((y1 - y0) * k); cv.getContext('2d').drawImage(im, 0, y0, W, y1 - y0, 0, 0, cv.width, cv.height);
          const {data} = await worker.recognize(cv, {}, {text:true, blocks:true});
          const lines = (data.blocks || []).flatMap(b => (b.paragraphs || []).flatMap(p => p.lines || []));
          const text = ocrClean(lines.length ? lines : String(data.text || '').split('\n').map(t => ({text:t, confidence:data.confidence})));

        }catch(e){}
        n++; if(batch.length >= 10) await flush();
        const per = (Date.now() - t0) / n / 1000, left = todo.length;
        stat(`${(done0 + saved + batch.length).toLocaleString()} cards have text · ${left.toLocaleString()} to go · ${per.toFixed(1)} s per card · about ${Math.ceil(left * per / 60)} min left`);
        if($('#ocrbar')) $('#ocrbar').style.width = Math.round(100 * n / (n + left)) + '%';
      }
      await flush(); await worker.terminate();
      stat(OCR.stop ? `Stopped - ${saved} cards got text. Press Start to continue.` : `Done - ${saved} cards got text. Press “Save for Pocket” for the phone.`);
    }catch(e){ stat(e.message) }
    OCR.run = false; if($('#ocrgo')) $('#ocrgo').innerHTML = '<i class="ti ti-player-play"></i>Start';
  };
}

  if(g === 'mtg'){ if(/secret lair/i.test(n) || c === 'SLD') return 'Secret Lair'; if(st.type === 'box') return 'Boxed sets & collections'; return MTG_GROUP[st.type] || (st.type ? 'Other' : 'Main sets') }

    if(/d$/i.test(st.code) || (k >= 200 && k < 400)) return 'Virtual sets (Players Committee)';

function rulesHTML(text){

  for(const raw of String(text).split('\n')){

    if(l.startsWith('- ')){ if(!list){ h += '<ul>'; list = true } h += `<li>${esc(l.slice(2))}</li>`; continue }

    if(l.startsWith('## ')) h += `<h4>${esc(l.slice(3))}</h4>`; else if(l) h += `<p>${esc(l)}</p>`;

}

const DRULES0 = {mtg:{min:60, side:15, copies:4}, pokemon:{min:60, max:60, copies:4}, ygo:{min:40, max:60, side:15, copies:3}, lorcana:{min:60, copies:4},

  if(m.game === 'ygo') return /monster/i.test(it) ? 'Monster' : /spell/i.test(it) ? 'Spell' : /trap/i.test(it) ? 'Trap' : 'Other';

  const c = String((m.info || {}).cost || ''); if(m.game === 'mtg' && c){ let n = 0; for(const s of c.split('//')[0].match(/\{[^}]+\}/g) || []){ const v = s.slice(1, -1); n += /^\d+$/.test(v) ? +v : /^[XYZ]$/.test(v) ? 0 : 1 } return n }

async function dSave(d){ try{ const r = await api('/api/decks/save', {deck:d}); d.at = r.at }catch(e){ toast(e.message, true) } }

    <div class="dstats"><div><b>${main}${dCount(d, true) ? ` <small>+${dCount(d, true)}</small>` : ''}</b><span>Cards${r.min ? ` (min ${r.min})` : ''}</span></div><div><b>${eur(dValue(d)) || '–'}</b><span>Value</span></div>

const PAPERS = {a4:[210, 297, 'A4'], letter:[215.9, 279.4, 'Letter'], legal:[215.9, 355.6, 'Legal'], a3:[297, 420, 'A3']};

  cfg:Object.assign({paper:'a4', cw:63, ch:88, scale:100, bleed:0, fill:'extend', gap:0, margin:8, guides:'ticks', dpi:300, backs:false, dfc:true, prefer:'owned'},

const pxStore = e => { const c = e.sel >= 0 ? e.cands[e.sel] : null; return {name:e.name, qty:e.qty, pick: c ? (c.kind === 'custom' ? {kind:'custom', id:c.id} : {kind:'official', set:c.set, number:c.number}) : null} };
const normNum = n => String(n).replace(/^0+(?=\d)/, '').toLowerCase();

function parseDeck(text){
  const map = new Map(); let skip = false;
  for(const raw of String(text).split(/\r?\n/)){
    let l = raw.trim(); if(!l || /^(\/\/|#)/.test(l)) continue;
    const sec = /^(deck|main|mainboard|sideboard|commander|companion|maybeboard|maybe|considering|tokens?)\s*:?\s*(\(\d+\))?$/i.exec(l);
    if(sec){ skip = /maybe|considering/i.test(sec[1]); continue }
    if(skip) continue;
    l = l.replace(/^(SB|MB|CMDR|COMPANION):\s*/i, '').replace(/\*[A-Za-z]+\*/g, '').replace(/\^[^^]*\^/g, '').replace(/\s+#\S+/g, '').trim();
    const m = /^(?:(\d+)\s*[xX]?\s+)?(.+?)$/.exec(l); if(!m) continue;
    const qty = m[1] ? +m[1] : 1; let rest = m[2].trim(), set = '', number = '';
    const sm = /^(.*?)\s*\(([A-Za-z0-9]{2,6})\)\s*([A-Za-z0-9★-]+)?\s*$/.exec(rest); if(sm){ rest = sm[1].trim(); set = sm[2].toLowerCase(); number = sm[3] || '' }
    if(!rest) continue;
    const key = rest.toLowerCase() + '|' + set + '|' + number, e = map.get(key); if(e) e.qty += qty; else map.set(key, {name:rest, qty, set, number});
  }
  return [...map.values()];
}
function pxPick(cands, want){
  if(!cands.length) return -1;
  if(want.pick){
    const i = cands.findIndex(c => want.pick.kind === 'custom' ? (c.kind === 'custom' && c.id === want.pick.id) : (c.kind === 'official' && c.set === want.pick.set && normNum(c.number) === normNum(want.pick.number)));
    if(i >= 0) return i;
  }
  if(want.set){
    let i = cands.findIndex(c => c.kind === 'official' && c.set === want.set && (!want.number || normNum(c.number) === normNum(want.number)));
    if(i < 0) i = cands.findIndex(c => c.kind === 'official' && c.set === want.set);
    if(i >= 0) return i;
  }
  const off = cands.map((c, i) => [c, i]).filter(([c]) => c.kind === 'official'), pool = off.length ? off : cands.map((c, i) => [c, i]), rel = c => c.released || '';
  const pref = PX.cfg.prefer;
  if(pref === 'owned'){ const ow = pool.filter(([c]) => c.qty > 0).sort((a, b) => b[0].qty - a[0].qty || rel(b[0]).localeCompare(rel(a[0]))); if(ow.length) return ow[0][1] }
  if(pref === 'old') return [...pool].sort((a, b) => rel(a[0]).localeCompare(rel(b[0])))[0][1];
  if(pref === 'cheap'){ const pr = pool.filter(([c]) => c.price != null).sort((a, b) => a[0].price - b[0].price); if(pr.length) return pr[0][1] }
  return [...pool].sort((a, b) => rel(b[0]).localeCompare(rel(a[0])))[0][1];
}
async function pxResolve(list){

  const r = await api('/api/proxy/resolve', {game:PX.game, entries:list.map(e => ({name:e.name}))});
  return list.map((e, i) => { const cands = r.results[i].cands; return {name:e.name, qty:e.qty, cands, sel:pxPick(cands, e)} });
}
function pxVisual(c){

  if(c.image) return `<img loading="lazy" src="/cardfile?game=${enc(PX.game)}&set=${enc(c.set)}&n=${enc(c.number)}&t=${TOKEN}" alt="">`;

const pxCur = e => e.sel >= 0 ? e.cands[e.sel] : null;
function pxLayout(){
  const c = PX.cfg, [pw, ph] = PAPERS[c.paper], cw = c.cw * c.scale / 100, ch = c.ch * c.scale / 100, b = +c.bleed, gap = +c.gap, m = +c.margin;
  const cellW = cw + 2 * b, cellH = ch + 2 * b;
  const cols = Math.max(1, Math.floor((pw - 2 * m + gap + 1e-6) / (cellW + gap))), rows = Math.max(1, Math.floor((ph - 2 * m + gap + 1e-6) / (cellH + gap)));
  const gw = cols * cellW + (cols - 1) * gap, gh = rows * cellH + (rows - 1) * gap;
  return {pw, ph, cw, ch, b, gap, m, cols, rows, per:cols * rows, cellW, cellH, gw, gh, ox:(pw - gw) / 2, oy:(ph - gh) / 2, fits:gw <= pw + 0.01 && gh <= ph + 0.01};
}
function pxPrints(){          // every card that goes on the sheet, in order; double-faced cards add their back face
  const out = [];
  PX.entries.forEach((e, i) => { const c = pxCur(e); if(!c) return;
    for(let k = 0; k < e.qty; k++){ out.push({e:i, c, face:'front', key:pxKey(c, 'front')}); if(PX.cfg.dfc && c.kind === 'official' && c.back) out.push({e:i, c, face:'back', key:pxKey(c, 'back')}) } });
  return out;
}
const pxKey = (c, face) => c.kind === 'custom' ? 'c' + c.id : `o:${c.set}:${c.number}:${face}`;
function pxCardSrc(c, face, wpx, hpx){
  if(c.kind === 'custom') return `/proxyimg?id=${c.id}&t=${TOKEN}`;
  if(c.image) return `/cardfile?game=${enc(PX.game)}&set=${enc(c.set)}&n=${enc(c.number)}&t=${TOKEN}${face === 'back' ? '&face=back' : ''}`;
  const svg = fakeCardSVG(Object.assign({}, c), PX.gameObj).replace('<svg ', `<svg width="${wpx}" height="${hpx}" `);

const pxLoad = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('A card picture could not be loaded')); im.src = src });
async function pxRender(img, L, dpi, fill){
  const px = mm => Math.round(mm / 25.4 * dpi), W = px(L.cellW), H = px(L.cellH), b = px(L.b), tw = px(L.cw), th = px(L.ch);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high';
  if(L.b > 0){ if(fill === 'extend') g.drawImage(img, 0, 0, W, H); else { g.fillStyle = fill === 'white' ? '#fff' : '#000'; g.fillRect(0, 0, W, H) } }
  g.drawImage(img, b, b, tw, th);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.93));
  return {data:new Uint8Array(await blob.arrayBuffer()), w:W, h:H};
}
const ptMM = mm => (mm * 72 / 25.4).toFixed(2);
function pxPageOps(L, n, imgIdx, mirrored){
  let ops = '';
  const usedCols = Math.min(L.cols, n), usedRows = Math.ceil(n / L.cols), mx = x => mirrored ? L.pw - x : x;
  for(let i = 0; i < n; i++){
    const col = i % L.cols, row = Math.floor(i / L.cols), x0 = L.ox + col * (L.cellW + L.gap), y0 = L.ph - (L.oy + row * (L.cellH + L.gap)) - L.cellH, x = mirrored ? L.pw - x0 - L.cellW : x0;
    ops += `q ${ptMM(L.cellW)} 0 0 ${ptMM(L.cellH)} ${ptMM(x)} ${ptMM(y0)} cm /Im${imgIdx[i]} Do Q\n`;
  }
  const line = (x1, y1, x2, y2) => `${ptMM(mx(x1))} ${ptMM(y1)} m ${ptMM(mx(x2))} ${ptMM(y2)} l S\n`;
  const top = L.ph - L.oy, bottom = L.ph - (L.oy + usedRows * L.cellH + (usedRows - 1) * L.gap), left = L.ox, right = L.ox + usedCols * L.cellW + (usedCols - 1) * L.gap;
  const t = Math.min(4, L.m - 2);
  if((PX.cfg.guides === 'ticks' || PX.cfg.guides === 'both') && t >= 1.5){
    ops += '0 G 0.3 w\n';
    for(let c = 0; c < usedCols; c++) for(const x of [left + c * (L.cellW + L.gap) + L.b, left + c * (L.cellW + L.gap) + L.b + L.cw]){ ops += line(x, top + 1.5, x, top + 1.5 + t) + line(x, bottom - 1.5, x, bottom - 1.5 - t) }
    for(let r = 0; r < usedRows; r++){ const yt = L.ph - (L.oy + r * (L.cellH + L.gap) + L.b); for(const y of [yt, yt - L.ch]){ ops += line(left - 1.5, y, left - 1.5 - t, y) + line(right + 1.5, y, right + 1.5 + t, y) } }
  }
  if((PX.cfg.guides === 'lines' || PX.cfg.guides === 'both') && L.gap > 0){
    ops += '0.45 G 0.25 w\n';
    for(let c = 0; c < usedCols - 1; c++){ const x = left + c * (L.cellW + L.gap) + L.cellW + L.gap / 2; ops += line(x, top, x, bottom) }
    for(let r = 0; r < usedRows - 1; r++){ const y = L.ph - (L.oy + r * (L.cellH + L.gap) + L.cellH + L.gap / 2); ops += line(left, y, right, y) }
  }
  return ops;
}
function pdfBuild(pages, imgs, pwMM, phMM){
  const te = new TextEncoder(), parts = [], offsets = []; let pos = 0;
  const push = u => { parts.push(u); pos += u.length }, pushS = s => push(te.encode(s)), start = n => { offsets[n] = pos; pushS(`${n} 0 obj\n`) };
  pushS('%PDF-1.4\n');
  const first = 3, firstPage = first + imgs.length;
  start(1); pushS('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  start(2); pushS(`<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_, k) => `${firstPage + 2 * k + 1} 0 R`).join(' ')}] >>\nendobj\n`);
  imgs.forEach((im, i) => { start(first + i); pushS(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`); push(im.data); pushS('\nendstream\nendobj\n') });
  pages.forEach((pg, k) => {
    const c = firstPage + 2 * k, content = te.encode(pg.ops);
    start(c); pushS(`<< /Length ${content.length} >>\nstream\n`); push(content); pushS('\nendstream\nendobj\n');
    start(c + 1); pushS(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptMM(pwMM)} ${ptMM(phMM)}] /Contents ${c} 0 R /Resources << /XObject << ${pg.used.map(i => `/Im${i} ${first + i} 0 R`).join(' ')} >> >> >>\nendobj\n`);
  });
  const total = firstPage + 2 * pages.length, xref = pos;
  pushS(`xref\n0 ${total}\n0000000000 65535 f \n`); for(let n = 1; n < total; n++) pushS(String(offsets[n]).padStart(10, '0') + ' 00000 n \n');
  pushS(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type:'application/pdf'});
}
async function pxMakePdf(){
  if(PX.busy) return; const prints = pxPrints(); if(!prints.length){ toast('The deck is empty - import a deck list first', true); return }
  const L = pxLayout(), st = $('#pxstatus'); PX.busy = true; $('#pxpdf').disabled = true;
  try{
    const imgs = [], index = new Map(), order = [];
    const uniq = [...new Map(prints.map(p => [p.key, p])).values()], need = uniq.length + (PX.cfg.backs ? 1 : 0);
    let done = 0;
    for(const p of uniq){
      st.textContent = `Preparing card pictures ${++done} / ${need} ...`;
      const wpx = Math.round(L.cw / 25.4 * PX.cfg.dpi), hpx = Math.round(L.ch / 25.4 * PX.cfg.dpi), src = pxCardSrc(p.c, p.face, wpx, hpx);
      const im = await pxLoad(src); if(src.startsWith('blob:')) URL.revokeObjectURL(src);
      index.set(p.key, imgs.length); imgs.push(await pxRender(im, L, PX.cfg.dpi, PX.cfg.fill)); await new Promise(r => setTimeout(r, 0));
    }
    let backIdx = -1;
    if(PX.cfg.backs){
      st.textContent = `Preparing card pictures ${++done} / ${need} ...`;
      let im; if(PX.backFile){ const u = URL.createObjectURL(PX.backFile); im = await pxLoad(u); URL.revokeObjectURL(u) }
      else { const cv = document.createElement('canvas'); cv.width = 504; cv.height = 704; const g = cv.getContext('2d'); g.fillStyle = '#1c2230'; g.fillRect(0, 0, 504, 704);
        g.strokeStyle = '#c9a24a'; g.lineWidth = 6; g.strokeRect(24, 24, 456, 656); g.lineWidth = 2; for(let y = 60; y < 680; y += 44) for(let x = 60; x < 480; x += 44){ g.beginPath(); g.moveTo(x, y - 18); g.lineTo(x + 18, y); g.lineTo(x, y + 18); g.lineTo(x - 18, y); g.closePath(); g.stroke() }
        im = await pxLoad(cv.toDataURL('image/png')) }
      backIdx = imgs.length; imgs.push(await pxRender(im, L, PX.cfg.dpi, PX.cfg.fill));
    }
    st.textContent = 'Building the PDF ...';
    const pages = [];
    for(let s = 0; s < prints.length; s += L.per){
      const slice = prints.slice(s, s + L.per), idx = slice.map(p => index.get(p.key));
      pages.push({ops:pxPageOps(L, slice.length, idx, false), used:[...new Set(idx)]});
      if(PX.cfg.backs){ const bi = slice.map(() => backIdx); pages.push({ops:pxPageOps(L, slice.length, bi, true), used:[backIdx]}) }
    }
    const blob = pdfBuild(pages, imgs, L.pw, L.ph), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = ($('#pxname').value.trim() || 'proxies').replace(/[^\w\- ]+/g, '') + '.pdf'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 20000);
    st.textContent = `Done - ${prints.length} cards on ${pages.length} page${pages.length === 1 ? '' : 's'} (${(blob.size / 1048576).toFixed(1)} MB).`;
  }catch(e){ st.textContent = ''; toast(e.message, true) }
  finally{ PX.busy = false; $('#pxpdf').disabled = false }
}
