const THEMES = [['midnight', 'Midnight'], ['light', 'Light'], ['graphite', 'Graphite'], ['forest', 'Forest'], ['ember', 'Ember'], ['violet', 'Violet'], ['ocean', 'Ocean']];
const lsGet = k => {try{ return localStorage.getItem(k) }catch(e){ return null }}, lsSet = (k, v) => {try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) }catch(e){}};
function applyTheme(){
  let t = lsGet('vault.theme') || 'midnight';
  if(t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'midnight';
  if(!THEMES.some(x => x[0] === t)) t = 'midnight';
  const root = document.documentElement; root.setAttribute('data-theme', t);
  const a = lsGet('vault.accent'), st = root.style;
  if(a){
    const n = parseInt(a.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    st.setProperty('--accent', a); st.setProperty('--onacc', lum > 0.6 ? '#10131a' : '#ffffff');
    st.setProperty('--accentbg', `color-mix(in srgb, ${a} 16%, var(--bg))`); st.setProperty('--accentline', `color-mix(in srgb, ${a} 40%, var(--bg))`);
  } else ['--accent', '--onacc', '--accentbg', '--accentline'].forEach(k => st.removeProperty(k));
}

function showWizard(again){
  const st = S.state, groups = {};
  st.collections.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
  const sel = new Set(again ? st.collections.filter(c => c.enabled).map(c => c.id) : []);
  let games = [], gsel = new Set(), step = 1;
  const el = document.createElement('div'); el.className = 'wiz'; document.body.appendChild(el);
  const close = () => el.remove();
  const tile = (id, icon, label, on, attr) => `<div class="tile ${on ? 'on' : ''}" ${attr}="${esc(id)}"><i class="ti ti-${esc(icon)}"></i><span>${esc(label)}</span><i class="ti ti-circle-check tick"></i></div>`;
  const finish = async () => {
    try{
      await api('/api/track', {collections:[...sel], card_games:[...gsel]});
      await loadState(); await loadLib(); close();
      const scanned = st.collections.some(c => sel.has(c.id) && c.scanned);
      go(scanned && !again ? '#/scan' : '#/library'); render();
    }catch(e){ toast(e.message, true) }
  };
  const draw = () => {
    const needGames = sel.has('card'), total = needGames ? 2 : 1;
    el.innerHTML = `<div class="box"><div class="steps">${[1, 2].slice(0, total).map(i => `<b class="${i <= step ? 'on' : ''}"></b>`).join('')}</div>` + (step === 1 ? `

      <div class="lead">${again ? 'Pick what shows up in the sidebar. Anything you switch off keeps its data.' : 'Pick what you collect - only those collections show up. You can change this any time in Settings.'}</div>

      ${Object.keys(groups).map(g => `<div class="grp">${esc(g)}</div><div class="tiles">${groups[g].map(c => tile(c.id, c.icon, c.name, sel.has(c.id), 'data-wc')).join('')}</div>`).join('')}

function render(){

  if(view !== 'cardscan') stopScanner();
  if(view !== 'model') leaveModel();
  if(view === 'model'){ leaveReader(); leavePlayer(); leaveBook(); renderSide(); viewModel(arg); return }
  if(view === 'read'){ leavePlayer(); leaveBook(); renderSide(); viewReader(arg); return }
  if(view === 'watch'){ leaveReader(); leaveBook(); renderSide(); viewPlayer(arg); return }
  if(view === 'book'){ leaveReader(); leavePlayer(); renderSide(); viewBook(arg); return }
  leaveReader(); leavePlayer(); leaveBook();
  renderSide();
  ({library:viewLibrary, item:viewItem, upcoming:viewUpcoming, scan:viewScan, tidy:viewTidy, template:viewTemplate, settings:viewSettings, cards:viewCards, cardscan:viewCardScan, wishlist:viewWishlist, cardgame:viewCardGame, carddl:viewCardDownloads, addgame:viewAddGame, line:viewLine, cardset:viewCardSet, cardview:viewCardView, proxy:viewProxy, decks:viewDecks}[view] || viewLibrary)(arg);
  $('#main').scrollTop = 0;
}

  if(r.error){ if(manual){ updMsg('Could not reach the update list', r.error + ' (this program is build ' + (r.build||'?') + ')'); setTimeout(() => { const b = document.querySelector('.mbox .btn.primary'); if(b) b.insertAdjacentHTML('beforebegin', '<button class="btn" onclick="closeModal();updMenu()" style="margin-right:8px">Update from a zip file</button>') }, 0) } return }
  try{ localStorage.setItem('nvUpdChecked', Date.now()) }catch(e){}
  if(!r.available){ if(manual) updMsg('Nightvault is up to date', 'Build ' + (r.build||'') + ', published version ' + (r.version||'')); return }
  if($('#updbar')) $('#updbar').remove();
  document.body.insertAdjacentHTML('beforeend', `<div id="updbar" style="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9000;background:var(--panel,#151a22);border:1px solid var(--accent,#7aa2f7);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4)">
    <i class="ti ti-cloud-download" style="font-size:20px;color:var(--accent,#7aa2f7)"></i><div><b>A new version of Nightvault is available</b><div class="muted" style="font-size:12.5px">${r.files.length} file${r.files.length === 1 ? '' : 's'} to update. The old ones are kept in update_backup.</div></div>
    <button class="btn primary" id="updgo">Update now</button><button class="btn ghost" id="updx" title="Not now"><i class="ti ti-x"></i></button></div>`);
  $('#updx').onclick = () => $('#updbar').remove();
  $('#updgo').onclick = async () => { $('#updgo').disabled = true; $('#updgo').textContent = 'Updating ...';
    try{ const u = await api('/api/update/apply', {}); $('#updbar').innerHTML = '<b>Updated. Restarting ...</b>'; await api('/api/update/restart', {}).catch(() => {});
      const back = async () => { try{ await fetch('/api/state'); location.reload() }catch(e){ setTimeout(back, 1000) } }; setTimeout(back, 2500)
    }catch(e){ $('#updgo').disabled = false; $('#updgo').textContent = 'Update now'; toast(e.message, true) } };
}
(async function init(){
  try{
    await loadState(); await loadLib();
    if(S.state.setup && S.state.setup.running) watchSetup();
    if(S.state.build !== UI_BUILD) document.body.insertAdjacentHTML('beforeend', `<div id="buildbar"><b>Nightvault needs a restart.</b> The page is newer than the program that is running (page ${esc(UI_BUILD)}, program ${esc(S.state.build || 'an older version')}). Close the black Nightvault window, start <code>python vault.py</code> again and reload this page - some screens will not work until then.<button class="x" onclick="this.parentNode.remove()" title="Hide">×</button></div>`);
    const j = await api('/api/job'); S.job = j; drawJobbar(); if(j.running) startPolling();
    render();
    if(S.state.onboarded === false) showWizard(false);
    setTimeout(() => checkUpdate(false), 3000);
  }catch(e){ $('#main').innerHTML = `<div class="empty">Could not start: ${esc(e.message)}</div>` }
})();
(() => { const sp = document.getElementById('splash'); if(!sp) return; if(document.documentElement.classList.contains('nosplash')){ sp.remove(); return }
  const out = () => { if(!sp.isConnected || sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(() => sp.remove(), 450) };
  sp.onclick = out; setTimeout(out, matchMedia('(prefers-reduced-motion: reduce)').matches ? 400 : 1300) })();
</script>
</body>
