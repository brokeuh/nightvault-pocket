# Keeps the app list of The Nightvault (hub/apps.json) up to date: after a change to an app, its version and download size change.
name: Update app list

on:
  push:
    paths: ["test/**", "tools/**", "admin/**", "audio/**", "books/**", "games/**", "boardgames/**", "cinema/**", "print3d/**", "hub/index.html", "hub/core.js", "hub/nvlog.js", "hub/nvpc.js", "hub/nvgroups.js", "hub/nvbackup.js", "hub/apps.src.json", "hub/build_catalog.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-catalog

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: python3 hub/build_catalog.py
      - name: Save
        run: |
          git config user.name "card-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/apps.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Update app list"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
