# Builds the Android test app of Nightvault Pocket: the test version of the web app inside a small Android shell
# (Capacitor) that adds Google's on-device text reader for the scanner. The APK is attached to the release "android-test":
#   https://github.com/brokeuh/nightvault-pocket/releases/download/android-test/nightvault-pocket.apk
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["native/**", "test/index.html", "hub/**", "tools/**", "admin/**", "audio/**", "books/**", "games/**", "calendar/**", "boardgames/**", "cinema/**", "print3d/**", "collectables/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android shell
        working-directory: native
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm install --no-audit --no-fund
          # the app is laid out like the website: The Nightvault (hub/) is the first screen, Pocket test is test/, plus Convert and Control.
          # Everything stays on the same address inside the app, so the collection saved by earlier versions is kept.
          # always a fresh app list (the 'Update app list' job may not have finished when this build starts)
          python3 ../hub/build_catalog.py
          mkdir -p www/test www/hub www/tools
          cp ../test/index.html www/test/index.html
          cp ../hub/index.html ../hub/core.js ../hub/nvlog.js ../hub/nvpc.js ../hub/nvgroups.js ../hub/nvbackup.js ../hub/nvsetup.js ../hub/nvtheme.js ../hub/nvmenu.js ../hub/nvnew.js ../hub/nvsplash.js ../hub/nvvoice.js ../hub/apps.json ../hub/manifest.webmanifest www/hub/
          cp -r ../tools/convert www/tools/convert
          cp -r ../admin www/admin
          cp -r ../audio www/audio
          cp -r ../books www/books
          cp -r ../games www/games
          cp -r ../calendar www/calendar
          cp -r ../boardgames www/boardgames
          cp -r ../cinema www/cinema
          cp -r ../print3d www/print3d
          cp -r ../collectables www/collectables
          cp ../favicon.svg ../favicon-32.png ../apple-touch-icon.png ../icon-*.png www/
          printf '<!doctype html><meta charset="utf-8"><title>Nightvault</title><style>html{background:#0b0e13}</style><script>location.replace("hub/index.html")</script>' > www/index.html
          # the Capacitor helper first, so the pages see the Android app's plugins (text reader, share, files, back button)
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          sed -i 's#<head>#<head><script src="/capacitor.js"></script>#' www/test/index.html www/hub/index.html www/audio/index.html www/books/index.html www/games/index.html www/boardgames/index.html www/cinema/index.html www/print3d/index.html www/collectables/index.html
          grep -c 'capacitor.js' www/test/index.html www/hub/index.html www/audio/index.html www/books/index.html www/games/index.html www/boardgames/index.html www/cinema/index.html www/print3d/index.html www/collectables/index.html
          echo "WEB_BUILD=$(grep -o "const BUILD = '[0-9]\{12\}'" www/test/index.html | grep -o '[0-9]\{12\}')" >> "$GITHUB_ENV"
          npx cap add android
          bash patch.sh
          npx cap sync android

      - name: Build
        working-directory: native/android
        run: |
          mkdir -p ~/.android
          cp ../debug.keystore ~/.android/debug.keystore     # the same signature every build, so a new APK installs over the old one
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q 2>&1 | tee /tmp/gradle.log; test ${PIPESTATUS[0]} -eq 0
          cp app/build/outputs/apk/debug/app-debug.apk ../../nightvault-pocket.apk
          # the signature must be the same every time, or phones refuse to update
          keytool -printcert -jarfile ../../nightvault-pocket.apk | grep -q "EE:43:1E:19:C4:EC:7E:D8:C7:C3:75:E0:AE:DA:43:87:1C:65:91:68:D8:67:E3:BB:9D:06:C9:E8:49:9F:DD:A4" || { echo "APK is not signed with the Nightvault key"; keytool -printcert -jarfile ../../nightvault-pocket.apk | grep SHA256; exit 1; }
          ls -la ../../nightvault-pocket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nightvault-pocket-apk
          path: nightvault-pocket.apk

      - name: Put it on the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Test build ${{ github.run_number }} ($(date -u +%Y-%m-%d), web ${WEB_BUILD}) - Nightvault Pocket with Google's text reader for the scanner. Open this page on your phone and tap nightvault-pocket.apk to install."
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "Android test app" --notes "$NOTES" --target main
          gh release edit android-test --notes "$NOTES"
          gh release upload android-test nightvault-pocket.apk --clobber

      - name: Keep the error messages (chats cannot read the Actions log)
        if: failure()
        run: |
          mkdir -p data/probe; { echo "Android build ${{ github.run_number }} failed ($(date -u))"; grep -E "error:|e: |FAILURE|What went wrong|\.java:[0-9]+|\.kt:[0-9]+" /tmp/gradle.log | head -80; echo ---; tail -60 /tmp/gradle.log; } > data/probe/android-build-failed.txt 2>&1 || true
          git config user.name "card-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe/android-build-failed.txt; git commit -m "Android build failed: error messages" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
