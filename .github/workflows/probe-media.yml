# Debug helper (owner's chats): downloads one media file and writes how it is built inside to tools/probe/<name>.txt
# (atoms/boxes and where they sit, streams, chapters). Run by hand, or change tools/probe/request.txt (first line = URL or "librivox: <title words>").
name: Look inside a media file

on:
  workflow_dispatch:
    inputs:
      url: {description: "File URL, or librivox: title words", required: true}
  push:
    paths: ["tools/probe/request.txt"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Download and look inside
        env:
          REQ: ${{ github.event.inputs.url }}
        run: |
          set -e
          [ -z "$REQ" ] && REQ=$(head -1 tools/probe/request.txt)
          URL="$REQ"
          if [[ "$REQ" == librivox:* ]]; then
            Q=$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))" "${REQ#librivox:}")
            ID=$(curl -sL "https://archive.org/advancedsearch.php?q=collection%3Alibrivoxaudio+AND+title%3A($Q)&fl%5B%5D=identifier&rows=1&output=json" | python3 -c "import json,sys;print(json.load(sys.stdin)['response']['docs'][0]['identifier'])")
            echo "identifier: $ID"
            F=$(curl -sL "https://archive.org/metadata/$ID/files" | python3 -c "import json,sys;fs=[f['name'] for f in json.load(sys.stdin)['result'] if f['name'].lower().endswith('.m4b')];print(fs[0])")
            URL="https://archive.org/download/$ID/$F"
          fi
          echo "url: $URL"
          curl -sL -o media.bin "$URL"
          NAME=$(basename "${URL%%\?*}")
          OUT="tools/probe/${NAME}.txt"
          python3 - media.bin "$URL" > "$OUT" <<'PY'
          import struct, sys
          p, url = sys.argv[1], sys.argv[2]
          f = open(p, 'rb'); f.seek(0, 2); size = f.tell()
          print('url', url); print('size', size)
          def boxes(off, end, depth, maxdepth):
              while off + 8 <= end:
                  f.seek(off); h = f.read(16); sz, t = struct.unpack('>I4s', h[:8]); hl = 8
                  if sz == 1: sz = struct.unpack('>Q', h[8:16])[0]; hl = 16
                  elif sz == 0: sz = end - off
                  t = t.decode('latin1')
                  print('  ' * depth + f'{t} at {off} size {sz}')
                  if sz < hl: print('  bad size'); return
                  if depth < maxdepth and t in ('moov', 'trak', 'mdia', 'minf', 'stbl', 'udta', 'edts', 'dinf'):
                      boxes(off + hl, off + sz, depth + 1, maxdepth)
                  if t in ('stco', 'co64', 'stsz', 'stts', 'stsc'):
                      f.seek(off + hl + 4); n = struct.unpack('>I', f.read(4))[0]; print('  ' * depth + f'  entries {n}')
                  off += sz
          boxes(0, size, 0, 6)
          PY
          echo "--- ffprobe" >> "$OUT"
          ffprobe -v error -show_format -show_streams -show_chapters -of compact "media.bin" >> "$OUT" 2>&1 || true
          ls -la tools/probe; head -40 "$OUT"
      - name: Save
        run: |
          git config user.name "card-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe/*.txt; git commit -m "Media probe" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
