# Nightvault Boardgames: fetches the owner's BoardGameGeek collection, game details and plays once a day
# into data/boardgames/collection.json (script: .github/scripts/bgg_collection.py).
# Needs two repository secrets: BGG_USERNAME (the BGG user name) and BGG_TOKEN (the application token from boardgamegeek.com/applications).
name: Update board games (BoardGameGeek)

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgg

jobs:
  bgg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ask BoardGameGeek
        env:
          BGG_USERNAME: ${{ secrets.BGG_USERNAME }}
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python3 .github/scripts/bgg_collection.py
      - name: Save
        if: always()
        run: |
          git config user.name "card-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boardgames
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Update board games"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
