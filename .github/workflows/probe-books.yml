# Looks at what the Grand Comics Database and Wikipedia answer for a few Flemish / Dutch series (for building Bookcase).
# Run by hand; prints the answers in the job log. Changes nothing.
name: Bookcase - look at GCD and Wikipedia

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask
        run: |
          set +e
          mkdir -p /tmp/raw
          python3 - <<'PY' > /tmp/out.txt 2>&1
          import json, urllib.request, urllib.parse, time
          UA = {"User-Agent": "NightvaultBookcase/1.0 (personal app; github.com/brokeuh)"}
          def get(u, f=None):
              time.sleep(3.2)
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30); b = r.read().decode(); h = dict(r.headers)
              except Exception as e:
                  print("ERR", u, e); return ""
              print("OK", u, {k: v for k, v in h.items() if k.lower().startswith(("access", "x-rate", "retry"))})
              if f: open("/tmp/raw/" + f, "w").write(b)
              return b
          get("https://www.comics.org/api/series/name/kiekeboe/?format=json", "gcd_kiekeboe.json")
          get("https://www.comics.org/api/series/26417/?format=json", "gcd_sw26417.json")
          for i in ["https://www.comics.org/api/issue/1294988/?format=json"]: pass
          s = json.loads(open("/tmp/raw/gcd_sw26417.json").read() or "{}")
          for n, u in enumerate((s.get("active_issues") or [])[:2] + (s.get("active_issues") or [])[200:201]):
              get(u, f"gcd_issue{n}.json")
          W = "https://nl.wikipedia.org/w/api.php?"
          for t in ["Lijst van albums van Jommeke", "Lijst van verhalen van Suske en Wiske", "Lijst van albums van De Kiekeboes", "Lijst van albums van Nero", "Lijst van albums van De Rode Ridder", "Lijst van albums van Urbanus"]:
              get(W + urllib.parse.urlencode({"action": "parse", "page": t, "prop": "wikitext", "format": "json", "redirects": 1}), "wiki_" + t.split(" van ")[-1].replace(" ", "_") + ".json")
          for q in ["Kiekeboe", "Nero", "Rode Ridder", "Urbanus", "Bessy", "Lucky Luke"]:
              get(W + urllib.parse.urlencode({"action": "query", "list": "search", "srsearch": "intitle:lijst " + q, "srlimit": 8, "format": "json"}), "wsearch_" + q.replace(" ", "_") + ".json")
          PY
      - name: Save the answers on the branch probe-books (not main)
        run: |
          cd /tmp && rm -rf p && mkdir p && cd p && git init -q && cp /tmp/out.txt answers.txt && cp -r /tmp/raw raw
          git config user.name card-bot; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -q -m "GCD / Wikipedia answers"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-books
