<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>The Nightvault</title>
<link rel="icon" href="../favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e13;--pan:#151a22;--line:#232b36;--text:#e9edf2;--dim:#9aa7b5;--dim2:#8fa0b2;--accent:#5fe0b0;--accentd:#2a8f6a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'DM Sans',system-ui,sans-serif}
body{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px))}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 4px}
.logo{width:42px;height:42px;border-radius:13px;background:#1b2150;display:flex;align-items:center;justify-content:center;flex:none}
.word{font-family:'Unbounded',sans-serif;font-weight:700;font-size:18px;letter-spacing:.5px}
.sub{font-size:12px;color:var(--dim2)}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--pan);display:flex;align-items:center;justify-content:center;padding:0;color:#c4cdd8;cursor:pointer}
.cont{margin:14px 0 4px;padding:13px 16px;border-radius:16px;background:linear-gradient(135deg,#1a2a55,#13342c);border:1px solid #2a3b62;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.cont small{display:block;font-size:11px;color:#a9c4ff;font-weight:700;letter-spacing:.6px}
.cont b{display:block;font-size:14.5px;margin-top:2px}
.head{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 8px}
.head span{font-size:13px;font-weight:700;color:var(--dim2);letter-spacing:.6px}
.head button{background:none;border:0;color:var(--accent);font:inherit;font-size:13.5px;cursor:pointer;padding:6px 0}
.apps{display:flex;flex-direction:column;gap:12px}
.app{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--pan);border:1px solid var(--line);text-decoration:none;color:var(--text);transition:transform .12s,border-color .12s}
a.app:active{transform:scale(.985)}a.app:hover{border-color:#33404f}
.app .ic{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:none}
.app .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.app small{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--dim2)}
.app b{font-size:17px}
.app .d{font-size:13px;color:var(--dim);line-height:1.35}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:99px;align-self:flex-start;margin-top:4px;background:#26303b;color:#c4cdd8}
.app.soon{opacity:.6}
.app.off{opacity:.45}
.ctl{display:flex;gap:6px;flex:none}
.ctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#10141b;color:#c4cdd8;font-size:16px;cursor:pointer}
.more{padding:16px;border-radius:22px;border:1px dashed #2f3a48;color:var(--dim2);font-size:13px;display:flex;align-items:center;gap:12px}
.foot{margin-top:22px;font-size:12px;color:#6f7d8c;text-align:center}
.menu{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.menu>div{background:#121720;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));width:min(560px,100%)}
.menu label{display:flex;align-items:center;gap:12px;padding:12px 2px;font-size:14.5px;border-bottom:1px solid var(--line)}
.menu input{width:20px;height:20px;accent-color:var(--accentd)}
.menu .btn{margin-top:14px;width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--pan);color:var(--text);font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5fe0b0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="7" width="8" height="12" rx="1.5"></rect><path d="M6 9l-2 9 5 1.5M18 9l2 9-5 1.5"></path><path d="M6 4l3 1.5 3-1 3 1.5 3-1" stroke="#c9d2ff"></path></svg></div>
  <div style="flex:1;min-width:0"><div class="word">THE NIGHTVAULT</div><div class="sub">Your apps · test version</div></div>
  <button class="ib" id="menu" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
</div>
<div id="cont"></div>
<div class="head"><span>APPS</span><button id="arrange">Arrange</button></div>
<div class="apps" id="apps"></div>
<div class="foot">The Nightvault is a test. Each app works on its own too - nothing changes in them.</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON = {
  binder:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5fe0b0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="11" height="15" rx="2"></rect><path d="M9 21h9a2 2 0 0 0 2-2V8"></path></svg>',
  convert:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6fd3ea" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="10" height="13" rx="1.5"></rect><path d="M16 9h4v11H9v-3"></path><path d="M13 13l3 3"></path></svg>',
  go:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f1dc6b" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M4 12h5M15 12h5"></path><circle cx="12" cy="12" r="3"></circle></svg>',
  control:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#c4cdd8" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path><circle cx="9" cy="6" r="2"></circle><circle cx="15" cy="12" r="2"></circle><circle cx="7" cy="18" r="2"></circle></svg>'};
const APPS = [
  {id:'binder', name:'Binder', desc:'Scan cards, binders, decks, prices - the app you use now', url:'../test/?nv=hub', bg:'#173a30'},
  {id:'convert', name:'Convert', desc:'Many pictures to WebP and AVIF at once', url:'../tools/convert/?nv=hub', bg:'#13323a'},
  {id:'go', name:'GO', desc:'Keep or transfer advice for Pokémon GO', soon:'COMING LATER', bg:'#2e2a12'},
  {id:'control', name:'Control', desc:'Data jobs and your data sets', url:'../admin/?nv=hub', bg:'#222a33', owner:true, tag:'ONLY FOR YOU'}];
const get = (k, d) => { try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) }catch(e){ return d } };
const set = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} };
const isOwner = () => { try{ return !!localStorage.getItem('nvControlToken') }catch(e){ return false } };
let arranging = false;
function order(){ const o = get('nvHub.order', []); return APPS.slice().sort((a, b) => ((o.indexOf(a.id) + 1) || 99) - ((o.indexOf(b.id) + 1) || 99)) }
function visible(a){ const h = get('nvHub.hidden', []); if(h.includes(a.id)) return false; if(a.owner) return get('nvHub.owner', null) ?? isOwner(); return true }
function draw(){
  const list = order().filter(a => arranging || visible(a));
  $('#apps').innerHTML = list.map((a, i) => {
    const inner = `<div class="ic" style="background:${a.bg}">${ICON[a.id] || ''}</div><div class="tx"><small>NIGHTVAULT</small><b>${esc(a.name)}</b><span class="d">${esc(a.desc)}</span>${a.soon ? `<span class="tag" style="background:#3b3515;color:#f1dc6b">${a.soon}</span>` : a.tag ? `<span class="tag">${a.tag}</span>` : ''}</div>`;
    if(arranging) return `<div class="app ${visible(a) ? '' : 'off'}">${inner}<div class="ctl"><button data-up="${a.id}" aria-label="Move ${esc(a.name)} up" ${i ? '' : 'disabled'}>↑</button><button data-eye="${a.id}" aria-label="${visible(a) ? 'Hide' : 'Show'} ${esc(a.name)}">${visible(a) ? '✓' : '–'}</button></div></div>`;
    return a.url ? `<a class="app" href="${a.url}" data-open="${a.id}">${inner}</a>` : `<div class="app soon">${inner}</div>` }).join('')
    + (arranging ? '' : '<div class="more"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6c7a8a" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>More Nightvault apps will show up here</div>');
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => set('nvHub.last', {id:el.dataset.open, at:Date.now()}));
  document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const ids = order().map(a => a.id), i = ids.indexOf(b.dataset.up); if(i > 0){ [ids[i - 1], ids[i]] = [ids[i], ids[i - 1]]; set('nvHub.order', ids); draw() } });
  document.querySelectorAll('[data-eye]').forEach(b => b.onclick = () => { const id = b.dataset.eye, a = APPS.find(x => x.id === id), h = get('nvHub.hidden', []);
    if(a.owner){ const now = visible(a); set('nvHub.owner', !now); set('nvHub.hidden', h.filter(x => x !== id)) } else set('nvHub.hidden', h.includes(id) ? h.filter(x => x !== id) : h.concat(id)); draw() });
  $('#arrange').textContent = arranging ? 'Done' : 'Arrange' }
function cont(){                                 // where you were in Nightvault Binder (the test app remembers it for 2 hours)
  const n = get('nightvault.pocket.test.nav', null);
  if(!n || Date.now() - (n.at || 0) > 2 * 3600e3 || !n.view || n.view === 'home'){ $('#cont').innerHTML = ''; return }
  const where = n.view === 'binder' ? (n.set ? n.set.name : 'Binder') : ({scan:'Scan', cards:'My cards', decks:'Decks', settings:'Settings', review:'Cards to check'})[n.view] || 'Binder';
  $('#cont').innerHTML = `<a class="cont" href="../test/?nv=hub"><div style="flex:1;min-width:0"><small>CONTINUE WHERE YOU WERE</small><b>Nightvault Binder · ${esc(where)}</b></div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e9edf2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>` }
$('#arrange').onclick = () => { arranging = !arranging; draw() };
$('#menu').onclick = () => { const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = `<div><b style="font-size:16px">The Nightvault</b><label><input type="checkbox" id="mown" ${visible(APPS.find(a => a.owner)) ? 'checked' : ''}> Show “Control” (only for the owner)</label><label><input type="checkbox" id="mreset"> Put the apps back in the first order</label><button class="btn" id="mdone">Done</button></div>`;
  document.body.appendChild(m);
  m.onclick = e => { if(e.target === m) m.remove() };
  m.querySelector('#mdone').onclick = () => { set('nvHub.owner', m.querySelector('#mown').checked); if(m.querySelector('#mreset').checked){ set('nvHub.order', []); set('nvHub.hidden', []) } m.remove(); draw() } };
window.addEventListener('pageshow', () => { cont(); draw() });
cont(); draw();
</script>
</body>
</html>
