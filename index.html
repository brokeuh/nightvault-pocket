<style>
/* Nightvault themes (same tokens as the desktop app) */
:root,[data-theme="midnight"]{--bg:#0f1115;--side:#13161c;--card:#14171d;--line:#23283a;--line2:#2a303c;--text:#e7eaf0;--mut:#9aa3b2;--dim:#6d7686;--accent:#6ea8ff;--accentbg:#1b2740;--accentline:#2f4a7d;--green:#5fcf9a;--greenbg:#10261c;--amber:#e0a85a;--amberbg:#2c200f;--red:#ff7b72;--sub:#1a1e27;--ctl:#171a21;--ctlh:#1b1f28;--lineh:#3a4150;--pan:#242934;--modal:#14181f;--track:#232a38;--chipbg:#1c2230;--logbg:#0b0d11;--logfg:#c3cad6;--onacc:#0b1220;--pg:#8fe6bd;--pa:#f2c27a;--pb:#a8cbff;--pgr:#aab3c2;color-scheme:dark}
[data-theme="light"]{--bg:#f4f5f8;--side:#ffffff;--card:#ffffff;--line:#e3e6ec;--line2:#d5d9e2;--text:#1b1f2a;--mut:#5a6475;--dim:#838c9c;--accent:#2f6fe0;--accentbg:#e3edff;--accentline:#a9c3f2;--green:#1f9d6a;--greenbg:#def5ea;--amber:#b9770e;--amberbg:#fbefd9;--red:#d63b32;--sub:#eceef3;--ctl:#ffffff;--ctlh:#f0f2f6;--lineh:#b8bfcc;--pan:#e3e6ec;--modal:#ffffff;--track:#e1e5ec;--chipbg:#e8eefb;--logbg:#f0f2f6;--logfg:#333b4a;--onacc:#ffffff;--pg:#17714c;--pa:#8a5a0b;--pb:#1f4fa8;--pgr:#4a5363;color-scheme:light}
[data-theme="forest"]{--bg:#0e1411;--side:#121a16;--card:#131b17;--line:#223029;--line2:#2a3a32;--text:#e5eee8;--mut:#94a89c;--dim:#67796e;--accent:#5fcf9a;--accentbg:#14281f;--accentline:#2c5c45;--green:#7ad9a8;--greenbg:#12281e;--amber:#e0b45a;--amberbg:#2a2210;--red:#ff8a7a;--sub:#18221d;--ctl:#151e19;--ctlh:#1a251f;--lineh:#3a4d42;--pan:#223029;--modal:#121a16;--track:#22302a;--chipbg:#172620;--logbg:#0a0f0c;--logfg:#c3d1c8;--onacc:#08140d;--pg:#8fe6bd;--pa:#f2c27a;--pb:#a8e6c8;--pgr:#aabbb0;color-scheme:dark}
[data-theme="ember"]{--bg:#15110e;--side:#1a1511;--card:#1b1612;--line:#322922;--line2:#3b3028;--text:#f0e8e0;--mut:#aa9c8f;--dim:#7d6f63;--accent:#f0944a;--accentbg:#2e1d10;--accentline:#6b4220;--green:#6fd09c;--greenbg:#12261b;--amber:#f0b35a;--amberbg:#2f2210;--red:#ff7b6a;--sub:#221b16;--ctl:#1d1814;--ctlh:#251e19;--lineh:#4a3d33;--pan:#322922;--modal:#1a1511;--track:#30271f;--chipbg:#2a2018;--logbg:#0f0b09;--logfg:#d6c9bc;--onacc:#1a0e05;--pg:#8fe6bd;--pa:#f6c98a;--pb:#ffd2a1;--pgr:#b8a99a;color-scheme:dark}
[data-theme="violet"]{--bg:#110f17;--side:#151320;--card:#161421;--line:#2a2640;--line2:#332e4c;--text:#ece9f6;--mut:#a29cb8;--dim:#756f8c;--accent:#a98bff;--accentbg:#231c3f;--accentline:#4c3f87;--green:#6fd6a6;--greenbg:#112620;--amber:#e6b062;--amberbg:#2b2110;--red:#ff7f8f;--sub:#1c1930;--ctl:#181627;--ctlh:#1f1c30;--lineh:#433d63;--pan:#2a2640;--modal:#151320;--track:#28243e;--chipbg:#221e3a;--logbg:#0c0a12;--logfg:#cbc6dc;--onacc:#120a28;--pg:#8fe6bd;--pa:#f2c27a;--pb:#cdbcff;--pgr:#b0aac4;color-scheme:dark}
[data-theme="ocean"]{--bg:#0b1318;--side:#0f181e;--card:#101a21;--line:#1f3039;--line2:#27404b;--text:#e3eef2;--mut:#93aab4;--dim:#65808c;--accent:#4cc9d9;--accentbg:#0f2a32;--accentline:#1f5a68;--green:#5fcf9a;--greenbg:#10261c;--amber:#e0b25a;--amberbg:#2a2110;--red:#ff7f78;--sub:#15232b;--ctl:#121e26;--ctlh:#182730;--lineh:#36505c;--pan:#1f3039;--modal:#0f181e;--track:#1f323c;--chipbg:#12282f;--logbg:#080e12;--logfg:#bcd0d8;--onacc:#04161a;--pg:#8fe6bd;--pa:#f2c27a;--pb:#a6e8f0;--pgr:#a5bac3;color-scheme:dark}
[data-theme="graphite"]{--bg:#000000;--side:#0a0a0a;--card:#0d0d0d;--line:#1f1f1f;--line2:#2a2a2a;--text:#ececec;--mut:#9a9a9a;--dim:#6c6c6c;--accent:#e8e8e8;--accentbg:#1d1d1d;--accentline:#444444;--green:#5fcf9a;--greenbg:#10261c;--amber:#e0a85a;--amberbg:#2c200f;--red:#ff7b72;--sub:#151515;--ctl:#111111;--ctlh:#181818;--lineh:#3a3a3a;--pan:#1f1f1f;--modal:#0d0d0d;--track:#222222;--chipbg:#1a1a1a;--logbg:#050505;--logfg:#c8c8c8;--onacc:#111111;--pg:#8fe6bd;--pa:#f2c27a;--pb:#cfcfcf;--pgr:#aaaaaa;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accentline);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--side);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.logo i{color:var(--accent);font-size:20px}
.logo small{font-weight:400;color:var(--dim);font-size:13px}
#scst{margin-left:auto;font-size:12px;color:var(--dim);text-align:right;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px}

h1{margin:0;font-size:20px;font-weight:600}
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--dim);font-size:13px}
.sp{flex:1}
.muted{color:var(--dim)}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--ctl);color:var(--text);font-size:13.5px;white-space:nowrap}
.btn:active{border-color:var(--lineh);background:var(--ctlh)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:600}
.btn.on{border-color:var(--accentline);color:var(--pb);background:var(--accentbg)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45}
.btn i{font-size:17px}
input[type=text],input[type=search],select{background:var(--ctl);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;outline:none;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--accentline)}
select{width:auto}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bar .grow{flex:1 1 150px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);font-size:12.5px;background:none}
.chip.on{background:var(--accentbg);border-color:var(--accentline);color:var(--pb)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.panel{background:var(--card);border:1px solid var(--pan);border-radius:12px;padding:14px 14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:30px 18px;text-align:center;color:var(--mut)}

/* camera */
.camwrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:3/4;max-height:56vh;width:100%;margin-inline:auto;border:1px solid var(--line)}
.camwrap video,.camwrap canvas,.camwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.camnote{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut)}
.camnote i.big{font-size:40px;color:var(--dim)}
.camtools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.camtools button{width:40px;height:40px;border-radius:50%;border:0;background:#000a;color:#fff;display:grid;place-items:center;font-size:19px}
.camtools button.on{background:var(--amber);color:#000}
.shoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0 4px}
.shoot .btn{justify-self:start}
.shoot .btn:last-child{justify-self:end}
.shutter{width:68px;height:68px;border-radius:50%;border:3px solid var(--accent);background:none;padding:5px}
.shutter b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--accent);color:var(--onacc);font-size:24px}
.shutter.busy b{background:var(--accentbg);color:var(--pb)}
.ctl{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ctl label{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--mut)}
.ctl input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}

/* result */
.cres-top{display:flex;gap:14px;align-items:flex-start}
.cardbig{width:118px;flex:none;border-radius:8px;overflow:hidden;border:1px solid var(--line2);background:#111;aspect-ratio:63/88}
.cardbig img{width:100%;height:100%;object-fit:cover;display:block}
.cname{font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.conf{padding:2px 9px;border-radius:999px;font-size:11.5px;display:inline-block;margin:0 4px 4px 0}
.conf.high{background:var(--greenbg);color:var(--pg)}.conf.medium{background:var(--amberbg);color:var(--pa)}.conf.low{background:color-mix(in srgb,var(--red) 18%,var(--bg));color:var(--red)}.conf.manual{background:var(--accentbg);color:var(--pb)}
.cands{display:flex;gap:8px;overflow-x:auto;margin:12px -14px 0;padding:0 14px 4px}
.cand-t{flex:none;width:64px;border:2px solid transparent;border-radius:7px;overflow:hidden;position:relative;aspect-ratio:63/88;background:#111;padding:0}
.cand-t.on{border-color:var(--accent)}
.cand-t img{width:100%;height:100%;object-fit:cover;display:block}
.cand-t span{position:absolute;bottom:0;left:0;right:0;background:#000b;color:#fff;font-size:10px;text-align:center;padding:1px 0;white-space:nowrap;overflow:hidden}
.srow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--sub);font-size:13px}
.srow img,.srow .ph{width:34px;aspect-ratio:63/88;object-fit:cover;border-radius:3px;background:var(--sub);flex:none}
.srow .grow{flex:1;min-width:0}
.srow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qb{display:inline-flex;align-items:center;gap:6px;flex:none}
.qb button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--ctl);color:var(--text)}
.qb b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.price{font-variant-numeric:tabular-nums}
.gtag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);display:inline-flex;align-items:center;gap:5px}
h4{margin:16px 0 4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:flex;align-items:center;gap:8px}

/* settings */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thtile{border:2px solid var(--line2);border-radius:12px;padding:0;overflow:hidden;background:none;text-align:left;color:var(--text)}
.thtile.on{border-color:var(--accent)}
.thtile .pv{height:46px;background:var(--bg);display:flex;gap:5px;padding:7px;align-items:flex-end}
.thtile .pv i{display:block;border-radius:4px;flex:1}
.thtile .nm{padding:5px 8px;font-size:12px;background:var(--card);color:var(--text);border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sub)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.steps{margin:6px 0 0;padding-left:20px;color:var(--mut);font-size:13px}
.steps li{margin:3px 0}

/* tabs */
#tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--side);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{border:0;background:none;padding:9px 0 8px;color:var(--dim);font-size:11.5px;display:grid;justify-items:center;gap:2px}
#tabs button i{font-size:22px}
#tabs button.on{color:var(--text)}
#tabs button.on i{color:var(--accent)}
#tabs .n{font-size:10.5px;color:var(--accent);margin-left:3px}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.t1{background:#1b2230;color:#e7eaf0;border:1px solid var(--accentline);padding:8px 16px;border-radius:10px;font-size:13px;text-align:center}
.t1.err{border-color:#7d3b37;background:#2a1716;color:#ffb3ad}
.mback{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:40}
.mbox{background:var(--modal);border:1px solid var(--line2);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.mbox h3{margin:0 0 10px;font-size:17px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"><div class="logo"><i class="ti ti-moon-stars"></i>Nightvault <small>Pocket</small></div><div id="scst"></div></header>
  <main id="main"></main>
  <nav id="tabs">
    <button data-v="scan" class="on"><i class="ti ti-camera"></i>Scan cards</button>
    <button data-v="cards"><i class="ti ti-stack"></i><span>My cards<span class="n" id="tabn"></span></span></button>
    <button data-v="settings"><i class="ti ti-settings"></i>Settings</button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal"></div>

<script>
"use strict";
/* ================================================================ games
   Ids, colours, set codes and numbers follow Nightvault, so an export imports straight into its card hub.
   name/num = where the card name and the collector number sit on the card, as fractions [x0, y0, x1, y1]. */
const GAMES = {
  mtg:      {label:'Magic',              full:'Magic: The Gathering',  color:'#b8863b', name:[0.06,0.038,0.76,0.105], num:[0.03,0.925,0.62,0.985], src:'Scryfall · Cardmarket €'},
  pokemon:  {label:'Pokémon',            full:'Pokémon TCG',           color:'#e8b53b', name:[0.14,0.025,0.72,0.10],  num:[0.02,0.885,0.62,0.975], src:'Pokémon TCG API · Cardmarket €'},
  ygo:      {label:'Yu-Gi-Oh!',          full:'Yu-Gi-Oh!',             color:'#7c4dbd', name:[0.06,0.035,0.84,0.115], num:[0.52,0.715,0.95,0.775], src:'YGOPRODeck · Cardmarket €'},
  lorcana:  {label:'Lorcana',            full:'Disney Lorcana',        color:'#5a6bd6', name:[0.07,0.555,0.93,0.665], num:[0.02,0.93,0.75,0.99],   src:'Lorcast · TCGplayer $'},
  swu:      {label:'Star Wars: Unlimited',full:'Star Wars: Unlimited', color:'#4aa3c8', name:[0.10,0.575,0.90,0.665], num:[0.02,0.925,0.98,0.99],  src:'SWU-DB · TCGplayer $'},
  onepiece: {label:'One Piece',          full:'One Piece Card Game',   color:'#c8453b', name:[0.10,0.80,0.90,0.875], num:[0.55,0.925,0.98,0.985], src:'OPTCG API · TCGplayer $', heavy:true},
  swccg:    {label:'Star Wars CCG',      full:'Star Wars CCG (Decipher, 1995-2001)', color:'#a08a52', name:[0.12,0.03,0.88,0.10], num:[0.02,0.92,0.98,0.99], src:'SWCCG Players Committee', heavy:true},
  riftbound:{label:'Riftbound',          full:'Riftbound',             color:'#d6595a', name:[0.10,0.565,0.90,0.655], num:[0.02,0.925,0.98,0.99],  src:'Riftcodex · riftbound.gg pictures'},
  other:    {label:'Other game',         full:'Any other game (added by hand)', color:'#8a8f9c', name:[0.05,0.025,0.95,0.12], num:[0.02,0.88,0.98,0.99], src:''},
};
/* clues on the front of a card that give away the game (read from the whole card) */
const CLUES = {
  mtg:      [/wizards of the coast/i, /\b(creature|instant|sorcery|enchantment|artifact|planeswalker)\b/i, /\blegendary\b/i, /[•·] ?EN\b/, /\b(tap|untap)\b/i],
  pokemon:  [/\bHP ?\d{2,3}\b/i, /weakness/i, /resistance/i, /retreat/i, /pok[eé]mon/i, /nintendo|game ?freak|creatures/i],
  ygo:      [/ATK ?\//i, /DEF ?\//i, /konami/i, /\b[A-Z0-9]{3,4}-(EN|DE|FR|IT|SP|PT)\d{3}\b/, /\[(spell|trap) card/i, /effect ?\]/i],
  lorcana:  [/disney/i, /ravensburger/i, /(storyborn|dreamborn|floodborn)/i, /\blore\b/i, /\bquest\b/i],
  swu:      [/\b(ground|space) ?unit\b/i, /\bunlimited\b/i, /fantasy flight/i, /\b(leader|base) ?unit\b/i],
  riftbound:[/riot games/i, /\bchampion\b/i, /\bmight\b/i, /\brunes?\b/i, /\briftbound\b/i],
  onepiece: [/\b(OP|ST|EB|PRB) ?\d{2} ?- ?\d{3}\b/, /\bcounter\b/i, /\bdon!*\b/i, /bandai/i, /\bpirates?\b/i, /\bstraw hat\b/i],
  swccg:    [/decipher/i, /\bdeploy\b/i, /\bforfeit\b/i, /\bdestiny\b/i, /\b(dark|light) side\b/i],
};
const lookGames = () => Object.keys(FIND).filter(g => !GAMES[g].heavy);   // the big card lists only load when that game is picked or detected
const AUTO = {label:'All games', name:[0.05,0.025,0.84,0.12], num:[0.02,0.88,0.98,0.99]};
const THEMES = [['midnight','Midnight'],['light','Light'],['graphite','Graphite'],['forest','Forest'],['ember','Ember'],['violet','Violet'],['ocean','Ocean']];
const NOISE = /\b(basic|stage ?[12]?|evolves|from|hp|lv\.?|trainer|item|supporter|energy|unit|leader|base|event|upgrade)\b/gi;
const PHONE_FORMAT = 'nightvault-phone-cards';

/* ================================================================ storage */
const KEY = 'nightvault.pocket.v1';
const store = (() => { try{ return JSON.parse(localStorage.getItem(KEY) || '{}') }catch(e){ return {} } })();
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(store)) }catch(e){ toast('This browser does not let the page save. Export your cards before closing it.', true) } }

async function getJSON(url){ const r = await fetch(url, {headers:{Accept:'application/json'}}); if(!r.ok) throw Object.assign(new Error('HTTP ' + r.status), {status:r.status}); return r.json() }
function applyTheme(){ const t = THEMES.some(x => x[0] === O.theme) ? O.theme : 'midnight'; document.documentElement.setAttribute('data-theme', t);
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--side').trim(); const m = $('meta[name=theme-color]'); if(m && bg) m.content = bg }
function lev(a, b){ a = a.toLowerCase(); b = b.toLowerCase(); if(a === b) return 0; const d = Array.from({length:b.length + 1}, (_, i) => i);
  for(let i = 1; i <= a.length; i++){ let p = d[0]; d[0] = i; for(let j = 1; j <= b.length; j++){ const t = d[j]; d[j] = Math.min(d[j] + 1, d[j-1] + 1, p + (a[i-1] === b[j-1] ? 0 : 1)); p = t } } return d[b.length] }
const sim = (a, b) => { const base = s => s.split(' - ')[0].trim(); a = base(a); b = base(b); const m = Math.max(a.length, b.length) || 1; return 1 - lev(a, b) / m };

/* ================================================================ card lookups (each returns printings in Nightvault's set/number form) */
async function findMTG(q){
  let card;
  try{ card = await getJSON('https://api.scryfall.com/cards/named?fuzzy=' + enc(q)) }
  catch(e){ const ac = await getJSON('https://api.scryfall.com/cards/autocomplete?q=' + enc(q)).catch(() => ({data:[]})); if(!ac.data || !ac.data.length) return [];
            card = await getJSON('https://api.scryfall.com/cards/named?exact=' + enc(ac.data[0])) }
  let prints = [card]; try{ prints = (await getJSON(card.prints_search_uri + '&unique=prints')).data.slice(0, 60) }catch(e){}
  return prints.map(c => ({game:'mtg', set:c.set.toLowerCase(), number:normNum(c.collector_number), showSet:c.set.toUpperCase(), showNum:c.collector_number,
    name:c.name, setName:c.set_name, rarity:c.rarity, released:c.released_at || '',
    image:(c.image_uris || (c.card_faces && c.card_faces[0].image_uris) || {}).normal || '',
    price:num(c.prices.eur) ?? num(c.prices.usd), priceFoil:num(c.prices.eur_foil) ?? num(c.prices.usd_foil),
    currency:(c.prices.eur != null || c.prices.eur_foil != null) ? 'EUR' : 'USD', psrc:(c.prices.eur != null) ? 'Cardmarket' : 'TCGplayer'}));
}
async function findPokemon(q){
  const base = 'https://api.pokemontcg.io/v2/cards?pageSize=40&orderBy=-set.releaseDate&select=id,name,set,number,images,rarity,cardmarket,tcgplayer&q=';
  let r = await getJSON(base + enc(`name:"${q}"`)).catch(() => ({data:[], down:true}));
  if(r.down) return findTCGdex(q);
  if(!r.data || !r.data.length){ const w = q.split(' ')[0].replace(/[^\p{L}\-']/gu, ''); if(w.length >= 3) r = await getJSON(base + enc(`name:${w}*`)).catch(() => ({data:[]})) }
  if(!r.data || !r.data.length) return findTCGdex(q);
  return (r.data || []).map(c => { const cm = (c.cardmarket || {}).prices || {}, tp = (c.tcgplayer || {}).prices || {}, tpv = Object.values(tp)[0] || {};
    const eur = cm.averageSellPrice ?? cm.trendPrice;
    return {game:'pokemon', set:c.set.id.toLowerCase(), number:normNum(c.number), showSet:(c.set.ptcgoCode || c.set.id).toUpperCase(), showNum:c.number + (c.set.printedTotal ? '/' + c.set.printedTotal : ''),
      name:c.name, setName:c.set.name, rarity:c.rarity || '', released:(c.set.releaseDate || '').replace(/\//g, '-'), image:(c.images || {}).small || '',
      price:eur ?? tpv.market ?? null, priceFoil:cm.reverseHoloTrend ?? (tp.holofoil || tp.reverseHolofoil || {}).market ?? null,
      currency:eur != null ? 'EUR' : 'USD', psrc:eur != null ? 'Cardmarket' : 'TCGplayer'} });
}
async function findYGO(q){
  let r = await getJSON('https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=' + enc(q)).catch(() => ({data:[]}));
  const out = [];
  for(const c of (r.data || []).slice(0, 8)){
    const price = num((c.card_prices || [])[0]?.cardmarket_price), img = (c.card_images || [])[0]?.image_url_small || '';
    const sets = c.card_sets && c.card_sets.length ? c.card_sets : [{set_code:'', set_name:'', set_rarity:''}];
    const seen = new Set();
    for(const s of sets){ const [code, n] = String(s.set_code || '').split(/-(.*)/s); if(seen.has(s.set_code)) continue; seen.add(s.set_code);
      out.push({game:'ygo', set:(code || '').toLowerCase(), number:normNum(n || ''), showSet:code || '?', showNum:n || '', name:c.name, setName:s.set_name, rarity:s.set_rarity || '', released:'',
        image:img, price, priceFoil:null, currency:'EUR', psrc:'Cardmarket'}) }
  }
  return out.slice(0, 60);
}
async function findLorcana(q){

  return (r.results || []).slice(0, 40).map(c => { const im = (c.image_uris || {}).digital || c.image_uris || {}, p = c.prices || {};
    return {game:'lorcana', set:pad(String(c.set.code).toLowerCase(), 2), number:normNum(c.collector_number), showSet:String(c.set.code), showNum:c.collector_number,
      name:c.name + (c.version ? ' - ' + c.version : ''), setName:c.set.name, rarity:c.rarity || '', released:c.released_at || '',
      image:im.small || im.normal || '', price:num(p.usd), priceFoil:num(p.usd_foil), currency:'USD', psrc:'TCGplayer'} });
}
async function findSWU(q){
  const r = await getJSON('https://api.swu-db.com/cards/search?q=' + enc(q));
  return (r.data || []).slice(0, 40).map(c => ({game:'swu', set:String(c.Set).toLowerCase(), number:normNum(c.Number), showSet:String(c.Set).toUpperCase(), showNum:c.Number,
    name:c.Name + (c.Subtitle ? ' - ' + c.Subtitle : ''), setName:String(c.Set).toUpperCase() + (c.VariantType && c.VariantType !== 'Normal' ? ' · ' + c.VariantType : ''),
    rarity:c.Rarity || '', released:'', image:c.FrontArt || '', price:num(c.MarketPrice), priceFoil:num(c.FoilPrice), currency:'USD', psrc:'TCGplayer'}));
}
async function findRiftbound(q){
  const r = await getJSON('https://api.riftcodex.com/cards/name?fuzzy=' + enc(q) + '&size=40');
  return (r.items || []).map(c => { const sid = String((c.set || {}).set_id || '').toUpperCase(), cn = String(c.collector_number ?? '');
    const n = c.riftbound_id || `${sid}-${cn.padStart(3, '0')}`;
    // Riot's own picture server refuses other sites, so pictures come from riftbound.gg (DotGG); promos fall back to the main-set art
    const dg = k => `https://static.dotgg.gg/riftbound/cards/${k}.webp`;
    const alt = [dg(`OGN-${cn.padStart(3, '0')}`), dg(`SFD-${cn.padStart(3, '0')}`), (c.media || {}).image_url || ''].filter(Boolean);
    return {game:'riftbound', set:sid.toLowerCase(), number:normNum(n), showSet:sid, showNum:cn, name:c.name, setName:(c.set || {}).label || sid,
      rarity:(c.classification || {}).rarity || '', released:'', image:dg(`${sid}-${cn.padStart(3, '0')}`), alt,
      price:null, priceFoil:null, currency:'USD', psrc:'',
      link:c.tcgplayer_id ? `https://www.tcgplayer.com/product/${c.tcgplayer_id}` : `https://www.tcgplayer.com/search/riftbound-league-of-legends-trading-card-game/product?q=${enc(c.name)}`, linkLabel:'Price on TCGplayer'} });
}
async function findTCGdex(q){                                       // second Pokémon source (also older sets)
  const list = await getJSON('https://api.tcgdex.net/v2/en/cards?name=' + enc(q)), top = (list || []).slice(0, 12);
  const det = await Promise.all(top.map(c => getJSON('https://api.tcgdex.net/v2/en/cards/' + c.id).catch(() => null)));
  return top.map((c, i) => { const d = det[i] || {}, st = d.set || {}, cm = (d.pricing || {}).cardmarket || {}, eur = cm.avg ?? cm.trend ?? null, sid = String(st.id || c.id.split('-')[0]);
    return {game:'pokemon', set:sid.toLowerCase(), number:normNum(c.localId), showSet:sid.toUpperCase(), showNum:c.localId + (st.cardCount ? '/' + st.cardCount.official : ''),
      name:c.name, setName:st.name || '', rarity:d.rarity || '', released:'', image:c.image ? c.image + '/low.webp' : '', price:eur, priceFoil:cm['avg-holo'] ?? null,
      currency:'EUR', psrc:eur != null ? 'Cardmarket' : ''} });
}
let OPDB = null;                                                     // One Piece: the whole list (about 4,000 cards) is read once per visit
function opdb(){ if(!OPDB) OPDB = Promise.all(['allSetCards', 'allSTCards'].map(p => getJSON(`https://optcgapi.com/api/${p}/`).catch(() => []))).then(a => a.flat()); return OPDB }
const opBase = n => String(n || '').replace(/\s*\((\d{3}|parallel|alternate art|sp|manga|[A-Z]{2,3}\d{2}-\d{3})\)/gi, '').trim();
async function findOnePiece(q, tokens){
  const all = await opdb(); if(!all.length){ OPDB = null; throw new Error('One Piece list unavailable') }
  const hits = [];
  for(const c of all){ const [st, n] = String(c.card_set_id || '').split('-'), nm = opBase(c.card_name), sm = sim(q, nm);
    const idHit = !!tokens && tokens.has(String(st).toUpperCase()) && tokens.has(String(n));
    if(sm >= 0.6 || idHit) hits.push([idHit ? 2 : sm, c, st, n, nm]) }
  hits.sort((a, b) => b[0] - a[0]);
  return hits.slice(0, 30).map(([sc, c, st, n, nm]) => { const v = String(c.card_image_id || '').split('_')[1];
    return {game:'onepiece', set:String(st).toLowerCase(), number:normNum(n) + (v ? '-' + v : ''), showSet:st, showNum:n + (v ? ' ' + v.toUpperCase() : ''),
      name:nm + (/parallel/i.test(c.card_name) ? ' (Parallel)' : ''), setName:c.set_name || '', rarity:c.rarity || '', released:'', image:c.card_image || '',
      price:num(c.market_price), priceFoil:null, currency:'USD', psrc:'TCGplayer', idHit:sc === 2} });
}
let SWDB = null;                                                     // Star Wars CCG: the Players Committee card list, read once per visit
function swdb(){ if(!SWDB) SWDB = Promise.all(['Light', 'Dark'].map(x => getJSON(`https://cdn.jsdelivr.net/gh/swccgpc/swccg-card-json@main/${x}.json`).then(j => j.cards || []))).then(a => a.flat()).catch(e => { SWDB = null; throw e }); return SWDB }
async function findSWCCG(q){
  const all = await swdb(), hits = [];
  for(const c of all){ const nm = String((c.front || {}).title || '').replace(/[•<>]/g, '').trim(), sm = sim(q, nm); if(sm >= 0.6) hits.push([sm, c, nm]) }
  hits.sort((a, b) => b[0] - a[0]);
  return hits.slice(0, 30).map(([sm, c, nm]) => { const img = (c.front || {}).imageUrl || '';
    const label = ((img.split('/cards/')[1] || '').split('/')[0] || '').replace(/-(Light|Dark)$/, '').replace(/([a-z])([A-Z])/g, '$1 $2');
    return {game:'swccg', set:String(c.set || '').toLowerCase(), number:String(c.gempId || c.id), showSet:label || 'Set ' + c.set, showNum:String(c.gempId || c.id),
      name:nm, setName:(c.side ? c.side + ' side' : ''), rarity:c.rarity || '', released:'', image:img, price:null, priceFoil:null, currency:'USD', psrc:''} });
}

async function startCamera(deviceId){
  SC.still = null;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $('#camnote').innerHTML = '<i class="ti ti-lock big"></i><div>The browser only allows the camera on a secure (https) page.<br>Use <b>Photo</b> below, or open this page from an https address.</div>'; return }
  try{
    stopCamera(true);
    const saved = deviceId || O.cam || '';
    SC.stream = await navigator.mediaDevices.getUserMedia({audio:false, video: saved ? {deviceId:{ideal:saved}, width:{ideal:1920}, height:{ideal:1440}}
                                                                          : {facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1440}}});
    const v = $('#cv'); v.srcObject = SC.stream; await v.play().catch(() => {});
    $('#camnote').hidden = true; $('#cstill').hidden = true; v.hidden = false; $('#ctools').hidden = false;
    const track = SC.stream.getVideoTracks()[0], caps = track.getCapabilities ? track.getCapabilities() : {};
    $('#ctorch').hidden = !caps.torch; SC.torch = false; $('#ctorch').classList.remove('on');
    if(caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(() => {});
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const cur = track.getSettings().deviceId, sel = $('#ccam');
    if(devs.length > 1){ sel.hidden = false; sel.innerHTML = devs.map((d, i) => `<option value="${esc(d.deviceId)}" ${d.deviceId === cur ? 'selected' : ''}>${esc(d.label || 'Camera ' + (i + 1))}</option>`).join('');
      sel.onchange = e => { O.cam = e.target.value; persist(); startCamera(e.target.value) } }
    clearInterval(SC.timer); SC.hist = []; SC.ref = null; SC.timer = setInterval(scanTick, 150); SC.armed = true;
    setSt('Hold a card in the frame');
  }catch(e){
    const msg = e.name === 'NotAllowedError' ? 'Camera access was blocked. Allow the camera for this page in the browser settings, then try again.'
              : e.name === 'NotFoundError' ? 'No camera found on this device.' : 'Camera problem: ' + e.message;
    $('#camnote').hidden = false; $('#camnote').innerHTML = `<i class="ti ti-camera-off big"></i><div>${esc(msg)}</div><button class="btn primary" id="cstart">Try again</button>`;
    $('#cstart').onclick = () => startCamera();
  }
}
function stopCamera(keepUi){

  if(keepUi || VIEW !== 'scan' || !$('#cv')) return;

  if(!SC.still){ $('#cstill').hidden = true; $('#camnote').hidden = false; drawGuide(null) }

}
async function toggleTorch(){

  SC.torch = !SC.torch;
  try{ await t.applyConstraints({advanced:[{torch:SC.torch}]}) }catch(e){ SC.torch = false }
  $('#ctorch').classList.toggle('on', SC.torch);
}

/* the frame: the largest card-shaped box in the middle of the source, like the desktop scanner */
function srcSize(){ if(SC.still) return {w:SC.still.width, h:SC.still.height}; const v = $('#cv'); return v && v.videoWidth ? {w:v.videoWidth, h:v.videoHeight} : null }
function guideRect(){
  const s = srcSize(); if(!s) return null; const fill = SC.still ? 0.96 : 0.86;
  let h = s.h * fill, w = h * 63 / 88; if(w > s.w * (SC.still ? 0.96 : 0.9)){ w = s.w * (SC.still ? 0.96 : 0.9); h = w * 88 / 63 }
  return {x:(s.w - w) / 2, y:(s.h - h) / 2, w, h, vw:s.w, vh:s.h};
}

  const sc = Math.min(c.width / g.vw, c.height / g.vh), ox = (c.width - g.vw * sc) / 2, oy = (c.height - g.vh * sc) / 2;
  const x = ox + g.x * sc, y = oy + g.y * sc, w = g.w * sc, h = g.h * sc, rad = 14 * dpr;

const _sm = document.createElement('canvas'); _sm.width = 24; _sm.height = 34; const _smc = _sm.getContext('2d', {willReadFrequently:true});
/* auto-scan for a hand-held phone: compare with the picture from ~0.6 s ago (so slow movement still counts as movement),

function scanTick(){
  const v = $('#cv'), g = guideRect(); if(!v || !g || v.readyState < 2) return;

  for(let i = 0; i < n; i++) gray[i] = (gray[i] - mean) / (contrast + 1e-3);
  const dist = (a, b) => { if(!a) return 9; let s = 0; for(let i = 0; i < n; i++) s += Math.abs(a[i] - b[i]); return s / n };

async function ocr(){

function grab(){

function crop(card, b, invert = true){
  const sx = b[0] * card.width, sy = b[1] * card.height, sw = (b[2] - b[0]) * card.width, sh = (b[3] - b[1]) * card.height;
  const k = Math.min(3, Math.max(1, 1000 / sw)), c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(card, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const im = x.getImageData(0, 0, c.width, c.height), p = im.data; let lo = 255, hi = 0;
  for(let i = 0; i < p.length; i += 4){ const y = .299 * p[i] + .587 * p[i+1] + .114 * p[i+2]; p[i] = y; if(y < lo) lo = y; if(y > hi) hi = y }

}

    .replace(/^[^\p{L}]+|[^\p{L}!]+$/gu, '')).filter(l => (l.match(/\p{L}/gu) || []).length >= 3);
  lines.sort((a, b) => b.replace(/[^\p{L}]/gu, '').length - a.replace(/[^\p{L}]/gu, '').length);

/* card backs you taught: a small colour picture of each back */
function backVec(card){
  const c = document.createElement('canvas'); c.width = 12; c.height = 16; const x = c.getContext('2d'); x.drawImage(card, 0, 0, 12, 16);
  const d = x.getImageData(0, 0, 12, 16).data, v = []; for(let i = 0; i < d.length; i += 4) v.push(d[i], d[i+1], d[i+2]);
  const m = v.reduce((a, b) => a + b, 0) / v.length; let q = 0; for(let i = 0; i < v.length; i++){ v[i] -= m; q += v[i] * v[i] } q = Math.sqrt(q) || 1;

async function scanNow(auto){

async function search(q, games, tokens){

  list.forEach(m => { m.sim = m.idHit ? 1 : sim(q, m.name);

    const g = $('#hg').value, name = $('#hn').value.trim(), set = $('#hs').value.trim(), n = $('#hnum').value.trim(), gn = $('#hgn').value.trim(), price = num($('#hp').value), foil = $('#hf').checked;
    if(!name){ toast('Enter the card name', true); return }
    if(g === 'other' && !gn){ toast('Enter the name of the game', true); return }
    if(g === 'other'){ O.lastOther = gn; persist() }
    const m = {game:g, gameName:g === 'other' ? gn : '', set:(set || 'x').toLowerCase(), number:normNum(n || name.toLowerCase().replace(/[^a-z0-9]+/g, '-')), showSet:(set || '-').toUpperCase(), showNum:n || '-',
      name, setName:'', rarity:'', image:'', price, priceFoil:foil ? price : null, currency:'EUR', psrc:''};
    addCard(m, foil, 1); closeModal(); toast(`Added ${name}`); if(VIEW === 'cards') viewCards(); else renderResult();
  };
}

/* ---------------------------------------------------------------- my cards */
const F = {q:'', game:'all', set:'all', sort:'new'};
function viewCards(){
  const cs = store.cards, total = cs.reduce((a, c) => a + c.qty, 0);
  const val = cur => cs.filter(c => c.currency === cur).reduce((a, c) => a + ((c.foil ? c.priceFoil : c.price) || 0) * c.qty, 0);
  const unpriced = cs.filter(c => (c.foil ? c.priceFoil : c.price) == null).reduce((a, c) => a + c.qty, 0);
  const games = [...new Set(cs.map(c => c.game))], sets = [...new Set(cs.filter(c => F.game === 'all' || c.game === F.game).map(c => c.showSet))].sort();
  const eur = val('EUR'), usd = val('USD');
  $('#main').innerHTML = `<div class="head"><h1>My cards</h1><div class="sp"></div><button class="btn sm" id="mman"><i class="ti ti-plus"></i>By hand</button><button class="btn sm primary" id="mexp"><i class="ti ti-device-desktop-up"></i>Send to Nightvault</button></div>
    <div class="sub" style="margin:-6px 0 12px">${total.toLocaleString()} cards · ${cs.length.toLocaleString()} different · value <b style="color:var(--text)">${fmt(eur, 'EUR')}</b>${usd ? ' + ' + fmt(usd, 'USD') : ''}${unpriced ? ` · ${unpriced} without a price` : ''}</div>
    <div class="bar"><input class="grow" id="mq" type="search" placeholder="Search by name" value="${esc(F.q)}">
      <select id="mgame"><option value="all">All games</option>${games.map(g => `<option value="${g}" ${F.game === g ? 'selected' : ''}>${esc(GAMES[g].label)}</option>`).join('')}</select>
      <select id="mset"><option value="all">All sets</option>${sets.map(s => `<option ${F.set === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
      <select id="msort"><option value="new" ${F.sort === 'new' ? 'selected' : ''}>Newest</option><option value="name" ${F.sort === 'name' ? 'selected' : ''}>Name</option><option value="value" ${F.sort === 'value' ? 'selected' : ''}>Value</option><option value="set" ${F.sort === 'set' ? 'selected' : ''}>Set</option></select></div>
    <div id="mlist"></div>`;
  const draw = () => {
    const q = F.q.toLowerCase();
    let rows = cs.filter(c => (F.game === 'all' || c.game === F.game) && (F.set === 'all' || c.showSet === F.set) && (!q || (c.name + ' ' + c.setName).toLowerCase().includes(q)));
    const pv = c => ((c.foil ? c.priceFoil : c.price) || 0) * c.qty;
    rows.sort(F.sort === 'name' ? (a, b) => a.name.localeCompare(b.name) : F.sort === 'value' ? (a, b) => pv(b) - pv(a)
            : F.sort === 'set' ? (a, b) => a.showSet.localeCompare(b.showSet) || normNum(a.number).localeCompare(normNum(b.number), undefined, {numeric:true}) : (a, b) => b.added - a.added);
    $('#mlist').innerHTML = rows.length ? rows.map(c => `<div class="srow">${c.image ? pic(c, 'loading="lazy"') : '<div class="ph"></div>'}
      <div class="grow"><div class="nm">${esc(c.name)}</div><div class="meta"><span class="dot" style="background:${GAMES[c.game].color};margin-right:5px"></span>${c.gameName ? esc(c.gameName) + ' · ' : ''}${esc(c.showSet)} #${esc(c.showNum)}${c.foil ? ' · foil' : ''} · <span class="price">${fmt(c.foil ? c.priceFoil : c.price, c.currency)}</span></div></div>
      <div class="qb"><button data-u="${c.uid}" data-d="-1" aria-label="One less">−</button><b>${c.qty}</b><button data-u="${c.uid}" data-d="1" aria-label="One more">+</button></div></div>`).join('')
      : `<div class="empty">${cs.length ? 'Nothing matches that filter.' : 'No cards yet.<br>Scan a card and tap Add.'}<br><button class="btn primary" id="mgo" style="margin-top:12px"><i class="ti ti-camera"></i>Scan cards</button></div>`;
    $$('#mlist [data-u]').forEach(b => b.onclick = () => { const c = store.cards.find(x => x.uid === b.dataset.u); if(!c) return;
      c.qty += +b.dataset.d; if(c.qty <= 0){ store.cards = store.cards.filter(x => x !== c); toast('Removed ' + c.name) } persist(); tabCount(); viewCards() });
    if($('#mgo')) $('#mgo').onclick = () => show('scan');
  };
  let t; $('#mq').oninput = e => { clearTimeout(t); t = setTimeout(() => { F.q = e.target.value; draw() }, 120) };
  $('#mgame').onchange = e => { F.game = e.target.value; F.set = 'all'; viewCards() };
  $('#mset').onchange = e => { F.set = e.target.value; draw() };
  $('#msort').onchange = e => { F.sort = e.target.value; draw() };
  $('#mexp').onclick = exportNightvault; $('#mman').onclick = () => openManual({});
  draw(); setSt('');
}

/* ---------------------------------------------------------------- export / import */
const stamp = () => new Date().toISOString().slice(0, 16).replace('T', '_').replace(':', '');
function payload(){
  return {format:PHONE_FORMAT, version:1, app:'Nightvault Pocket', exported:new Date().toISOString(),
    cards:store.cards.map(c => ({uid:c.uid, game:c.game === 'other' ? (String(c.gameName || 'other').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'other') : c.game, game_name:c.game === 'other' ? c.gameName : GAMES[c.game].full, set:c.set, number:c.number, name:c.name, set_name:c.setName, show_set:c.showSet, show_number:c.showNum,
      rarity:c.rarity, foil:c.foil, qty:c.qty, price:c.foil ? c.priceFoil : c.price, currency:c.currency, image:c.image, added:c.added}))};
}
async function saveFile(name, text, type){
  const blob = new Blob([text], {type});
  try{
    const file = new File([blob], name, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return 'shared' }
  }catch(e){ if(e.name === 'AbortError') return 'cancelled' }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 1000); return 'saved';
}
async function exportNightvault(){
  if(!store.cards.length){ toast('No cards to send yet', true); return }
  const r = await saveFile(`nightvault-pocket_${stamp()}.json`, JSON.stringify(payload()), 'application/json');
  if(r === 'cancelled') return;
  store.lastExport = Date.now(); persist();
  modal(`<h3>Send to Nightvault</h3><p style="margin:0 0 8px">${r === 'shared' ? 'Send the file to your PC (mail, Drive, OneDrive, Bluetooth ...).' : 'The file was saved to your Downloads. Copy it to your PC.'}</p>
    <ol class="steps"><li>On the PC, open Nightvault and go to <b>Cards</b> or <b>My cards</b>.</li><li>Tap <b>Import from phone</b> and choose the file.</li></ol>
    <p class="hint">You can send the whole collection again later: Nightvault remembers what it already imported and only adds what is new.</p>
    <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" id="mx">Done</button></div>`);
  $('#mx').onclick = closeModal;
}
function exportCsv(){
  const cols = ['Game', 'Name', 'Set', 'Set name', 'Number', 'Foil', 'Quantity', 'Price', 'Currency'], q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = store.cards.map(c => [c.gameName || GAMES[c.game].full, c.name, c.showSet, c.setName, c.showNum, c.foil ? 'yes' : '', c.qty, c.foil ? c.priceFoil : c.price, c.currency].map(q).join(';'));
  saveFile(`nightvault-pocket_${stamp()}.csv`, '﻿' + [cols.join(';'), ...rows].join('\n'), 'text/csv');
}
async function importBackup(e){
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const d = JSON.parse(await f.text()); if(d.format !== PHONE_FORMAT || !Array.isArray(d.cards)) throw 0;
    let n = 0;
    for(const x of d.cards){ if(!x || !x.game || !x.set || !x.number) continue; if(!GAMES[x.game] || x.game === 'other'){ x.game_name = x.game_name || x.game; x.game = 'other' }
      const k = (x.game === 'other' ? ['other:' + String(x.game_name || '').toLowerCase()] : [x.game]).concat([x.set, x.number, x.foil ? 1 : 0]).join('|'), ex = store.cards.find(c => c.uid === x.uid || c.key === k);
      if(ex){ ex.qty = Math.max(ex.qty, +x.qty || 0); continue }
      store.cards.push({uid:x.uid || uid(), key:k, game:x.game, gameName:x.game === 'other' ? x.game_name : '', set:x.set, number:x.number, showSet:x.show_set || x.set.toUpperCase(), showNum:String(x.show_number || x.number),
        name:x.name || '?', setName:x.set_name || '', rarity:x.rarity || '', image:x.image || '', price:x.foil ? null : x.price ?? null, priceFoil:x.foil ? x.price ?? null : null,
        currency:x.currency || 'EUR', psrc:'', foil:!!x.foil, qty:Math.max(1, +x.qty || 1), added:x.added || Date.now()}); n++ }
    persist(); tabCount(); toast(`Restored ${n} new entr${n === 1 ? 'y' : 'ies'}`); viewSettings();
  }catch(err){ toast('That file is not a Nightvault Pocket export.', true) }
}

/* ---------------------------------------------------------------- settings */
function viewSettings(){
  const total = store.cards.reduce((a, c) => a + c.qty, 0);
  $('#main').innerHTML = `<div class="head"><h1>Settings</h1></div>
    <div class="panel"><h3>Send to Nightvault</h3>
      <p style="margin:0 0 10px;font-size:13.5px">${total.toLocaleString()} cards on this phone${store.lastExport ? ` · last sent ${new Date(store.lastExport).toLocaleString()}` : ''}.</p>
      <div class="btns"><button class="btn primary" id="sexp"><i class="ti ti-device-desktop-up"></i>Export for Nightvault</button><button class="btn" id="scsv"><i class="ti ti-file-spreadsheet"></i>Export CSV</button>
        <label class="btn"><i class="ti ti-file-import"></i>Restore a backup<input type="file" id="simp" accept=".json,application/json" hidden></label></div>
      <p class="hint">The Nightvault export is also your backup. In Nightvault: Cards → <b>Import from phone</b>.</p></div>
    <div class="panel"><h3>Scanning</h3>
      <label class="row"><input type="checkbox" id="oauto" ${O.auto ? 'checked' : ''}><div class="grow">Scan automatically when the card is held still</div></label>
      <label class="row"><input type="checkbox" id="oadd" ${O.autoAdd ? 'checked' : ''}><div class="grow">Add automatically when sure<div class="hint" style="margin:2px 0 0">Only when the name matched and the printing is clear.</div></div></label>
      <label class="row"><input type="checkbox" id="onum" ${O.readNum ? 'checked' : ''}><div class="grow">Also read the collector number<div class="hint" style="margin:2px 0 0">Picks the right printing more often. Takes a moment longer.</div></div></label>
      <label class="row"><input type="checkbox" id="ofull" ${O.full ? 'checked' : ''}><div class="grow">Also read the whole card<div class="hint" style="margin:2px 0 0">Finds the name on full-art and special versions, and recognises the game by itself. Takes a second longer.</div></div></label>
      <div class="row"><div class="grow">Start with game</div><select id="ogame"><option value="auto">All games</option>${Object.entries(GAMES).map(([k, g]) => `<option value="${k}" ${O.game === k ? 'selected' : ''}>${esc(g.label)}</option>`).join('')}</select></div></div>
    <div class="panel"><h3>Card backs</h3><p class="hint" style="margin:0 0 6px">Teach the app a card back once. When you scan that back later, it switches to that game by itself.</p>
      ${Object.keys(FIND).map(g => { const n = store.backs.filter(b => b.game === g).length; return `<div class="row" style="padding:7px 0"><span class="dot" style="background:${GAMES[g].color}"></span><div class="grow">${esc(GAMES[g].label)} <span class="muted" style="font-size:12px">${n ? '· learned' : ''}</span></div>
        ${n ? `<button class="btn sm" data-forget="${g}">Forget</button>` : ''}<button class="btn sm" data-teach="${g}"><i class="ti ti-school"></i>${n ? 'Teach again' : 'Teach'}</button></div>` }).join('')}</div>
    <div class="panel"><h3>Appearance</h3><div class="thgrid">${THEMES.map(([id, nm]) => `<button class="thtile ${O.theme === id ? 'on' : ''}" data-t="${id}"><div class="pv" data-theme="${id}"><i style="background:var(--side);height:100%"></i><i style="background:var(--card);height:70%;border:1px solid var(--line2)"></i><i style="background:var(--accent);height:40%"></i></div><div class="nm">${nm}</div></button>`).join('')}</div></div>
    <div class="panel"><h3>Card data</h3>${Object.values(GAMES).filter(g => g.src).map(g => `<div class="row" style="padding:7px 0"><span class="dot" style="background:${g.color}"></span><div class="grow">${esc(g.full)}</div><span class="muted" style="font-size:12px">${esc(g.src)}</span></div>`).join('')}
      <p class="hint">Any other game can be added by hand (My cards → By hand). Card names are read on the phone. Lookups and prices need internet. Your cards stay on this phone until you export them.</p></div>
    <div class="panel"><h3>Danger zone</h3><button class="btn danger" id="sclear" ${store.cards.length ? '' : 'disabled'}><i class="ti ti-trash"></i>Remove all cards from this phone</button>
      <p class="hint">Cards already imported into Nightvault stay there.</p></div>`;
  $('#sexp').onclick = exportNightvault; $('#scsv').onclick = exportCsv; $('#simp').onchange = importBackup;
  $('#oauto').onchange = e => { O.auto = e.target.checked; persist() };
  $('#oadd').onchange = e => { O.autoAdd = e.target.checked; persist() };
  $('#onum').onchange = e => { O.readNum = e.target.checked; persist() };
  $('#ofull').onchange = e => { O.full = e.target.checked; persist() };
  $$('[data-teach]').forEach(b => b.onclick = () => { SC.teach = b.dataset.teach; show('scan') });
  $$('[data-forget]').forEach(b => b.onclick = () => { store.backs = store.backs.filter(x => x.game !== b.dataset.forget); persist(); viewSettings() });
  $('#ogame').onchange = e => { O.game = e.target.value; persist() };
  $$('.thtile').forEach(b => b.onclick = () => { O.theme = b.dataset.t; persist(); applyTheme(); viewSettings() });
  $('#sclear').onclick = () => {
    modal(`<h3>Remove all cards?</h3><p style="margin:0 0 6px">This removes ${total.toLocaleString()} cards from this phone. ${store.lastExport ? '' : '<b>You have not exported them yet.</b>'}</p>
      <div class="btns" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="cx">Cancel</button><button class="btn danger" id="cy"><i class="ti ti-trash"></i>Remove all</button></div>`);
    $('#cx').onclick = closeModal; $('#cy').onclick = () => { store.cards = []; SC.session = []; SC.last = null; persist(); tabCount(); closeModal(); toast('All cards removed'); viewSettings() };
  };
  setSt('');
}

/* ---------------------------------------------------------------- start */
applyTheme(); tabCount(); show('scan');
</script>
</body>
</html>
